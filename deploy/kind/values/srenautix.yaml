# Kind 上的 SreNautix：standard 配置，gateway 冻结；单实例 CNPG 与小型 MinIO 节省资源
profile: standard
clusterId: kind

datasources:
  prometheus: {url: http://kps-prometheus.monitoring.svc:9090}
  alertmanager: {url: http://kps-alertmanager.monitoring.svc:9093}
  loki: {url: http://loki.monitoring.svc:3100}
  tempo: {url: http://tempo.monitoring.svc:3200}

secrets:
  serviceSigningKey: {existingSecret: srenautix-service-signing}
  llm: {existingSecret: srenautix-llm}

freeze:
  frozen: true

# SreNautix 与监控一起固定在 zone a；节点 NotReady 场景停止 zone b 的节点
global:
  nodeSelector: {srenautix.io/zone: a}

roles:
  server:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  worker:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    # 模型路由按实际服务修改（SRENAUTIX_LLM_SECRET 提供密钥）
    config:
      llm:
        probe_on_start: false
        routes:
          - id: primary
            base_url: https://api.openai.com/v1
            api: responses
            model: gpt-5
            dialect_profile: openai-responses
            price: {currency: USD, input_per_mtok: 1.25, output_per_mtok: 10, cached_input_per_mtok: 0.125}
            in_domain: false
            tier: large
            retention_terms: 30 days
            api_key_file: /etc/srenautix/secrets/llm/api_key
      budget:
        daily_tokens: 2000000
  gateway:
    # 与 deploy/kind 场景中的 shop 业务对应；Kind 中 gateway 冻结，只提议
    policy:
      content: |
        version: 1
        cluster: kind
        approvers:
          - {principal: "local:admin", namespaces: ["*"], max_tier: H}
        actions:
          - {id: node_cordon}
          - {id: node_uncordon}
          - {id: workload_scale, namespaces: [shop]}
          - {id: rollout_pause, namespaces: [shop]}
          - {id: rollout_resume, namespaces: [shop]}
          - {id: pod_restart, namespaces: [shop]}
        self_dependencies:
          namespaces: [srenautix, monitoring]

database:
  cnpg:
    instances: 1
    allowSingleInstance: true
    storage: {size: 2Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}

audit:
  minio:
    storage: {size: 2Gi}
    resources:
      requests: {cpu: 20m, memory: 128Mi}

selfMonitoring:
  serviceMonitor: {enabled: true}
  prometheusRule: {enabled: true}
  dashboard: {enabled: true, namespace: monitoring}
  receiver: platform-oncall
  routeLabels: {team: platform}

alertmanagerConfig:
  enabled: true
  # Kind 中的值班接收方是 monitoring/alert-sink（workloads/alert-sink.yaml），收到的告警写入它的日志
  selfReceiverSpec:
    webhookConfigs:
      - url: http://alert-sink.monitoring.svc:8080/cgi-bin/alerts
        sendResolved: true

networkPolicy:
  datasourcesEgressTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
