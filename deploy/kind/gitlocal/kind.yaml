# Kind 中的本地 Git 服务（gitlocal）：kind/gitops 仓库、Argo CD 的同步来源、SreNautix 的 GitHub API。
# 镜像由 deploy/docker/gitlocal.Dockerfile 在本地构建并 kind load；Secret gitlocal-app（App 公钥）与 gitlocal-admin（管理员令牌）由 up.sh 生成。
# 数据在 emptyDir：Pod 重建后仓库回到初始内容。
apiVersion: v1
kind: Namespace
metadata:
  name: gitlocal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlocal
  namespace: gitlocal
  labels: {app: gitlocal}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gitlocal}
  template:
    metadata:
      labels: {app: gitlocal}
    spec:
      nodeSelector: {srenautix.io/zone: a}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gitlocal
          image: srenautix.local/gitlocal:e2e
          imagePullPolicy: Never
          args:
            - -listen=:3000
            - -data=/var/lib/gitlocal
            - -public-url=http://gitlocal.gitlocal.svc:3000
            - -app-id=1
            - -installation-id=1
            - -app-slug=srenautix-kind
            - -app-public-key=/etc/gitlocal/app/public.pem
            - -admin-token-file=/etc/gitlocal/admin/token
            - -seed=kind/gitops=/seed/gitops
            - -test-api
          env:
            - {name: HOME, value: /var/lib/gitlocal}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitlocal}
            - {name: app, mountPath: /etc/gitlocal/app, readOnly: true}
            - {name: admin, mountPath: /etc/gitlocal/admin, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: app, secret: {secretName: gitlocal-app}}
        - {name: admin, secret: {secretName: gitlocal-admin}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlocal
  namespace: gitlocal
  labels: {app: gitlocal}
spec:
  selector: {app: gitlocal}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
# 不变量测试（test/invariants/kind/run.sh 12）用的第二个实例：没有初始仓库，不校验 App JWT 的签名（测试每次生成自己的密钥），
# 测试经 /_test/repos 自己建仓库；与 SreNautix 使用的实例互不影响
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlocal-invariants
  namespace: gitlocal
  labels: {app: gitlocal-invariants}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gitlocal-invariants}
  template:
    metadata:
      labels: {app: gitlocal-invariants}
    spec:
      nodeSelector: {srenautix.io/zone: a}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gitlocal
          image: srenautix.local/gitlocal:e2e
          imagePullPolicy: Never
          args:
            - -listen=:3000
            - -data=/var/lib/gitlocal
            - -public-url=http://gitlocal-invariants.gitlocal.svc:3000
            # 与 test/invariants 中 GitHub App 的 slug、安装 id 一致
            - -app-slug=srenautix-test
            - -installation-id=2
            - -admin-token-file=/etc/gitlocal/admin/token
            - -test-api
          env:
            - {name: HOME, value: /var/lib/gitlocal}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitlocal}
            - {name: admin, mountPath: /etc/gitlocal/admin, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: admin, secret: {secretName: gitlocal-admin}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlocal-invariants
  namespace: gitlocal
  labels: {app: gitlocal-invariants}
spec:
  selector: {app: gitlocal-invariants}
  ports:
    - {name: http, port: 3000, targetPort: http}
