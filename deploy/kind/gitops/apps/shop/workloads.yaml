# 演示业务 shop：web → api → postgres，另有 checkout。由 Argo CD 从本地 Git 服务同步（argocd/applications/shop.yaml）。
# 依赖关系对 SreNautix 可见的方式：web 的 nginx 配置引用 api 的 Service 名，api 与 checkout 的环境变量引用 postgres。
# 发布：api 的 http 容器镜像与发布 ID 来自 release.json（kustomization.yaml 的 replacements）；
# api、checkout 的 initContainer wait-for-migrations 等到本次发布的迁移 Job（shop-migrate-<发布 ID>）写入 schema_migrations 后才启动。
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: shop
type: Opaque
stringData:
  # 演示用的固定口令，只存在于 Kind 集群
  password: shop-demo-password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres
          args: [-c, shared_buffers=32MB, -c, max_connections=60]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
            - name: POSTGRES_DB
              value: shop
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -h, 127.0.0.1]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            # 内存上限较小：数据库 OOM 场景中的大查询会触发整个容器被 OOM 终止
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# 每次发布一个迁移 Job：名称中的 RELEASE 与环境变量 RELEASE_ID 由 replacements 换成 release.json 的 data.release_id。
# 先建 schema_migrations，再在一个事务里执行 migrations/<发布 ID>.sql，成功后登记本次发布
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-migrate-RELEASE
  namespace: shop
  labels: {app: shop-migrate}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app: shop-migrate}
    spec:
      restartPolicy: Never
      # 首次部署时 postgres 与迁移 Job 同时创建：先等数据库可连接，迁移本身的失败才计入 backoffLimit
      initContainers:
        - name: wait-for-postgres
          image: postgres
          command: [sh, -c, "until pg_isready -h postgres.shop.svc -p 5432 -t 2; do sleep 2; done"]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: migrate
          image: postgres
          command:
            - sh
            - -ec
            - |
              psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (release_id text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
              psql -v ON_ERROR_STOP=1 --single-transaction -f "/migrations/${RELEASE_ID}.sql"
              psql -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (release_id) VALUES ('${RELEASE_ID}') ON CONFLICT DO NOTHING"
              echo "migrations of release ${RELEASE_ID} applied"
          env:
            - {name: RELEASE_ID, value: RELEASE}
            - {name: PGHOST, value: postgres.shop.svc}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: shop}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: migrations, mountPath: /migrations}
      volumes:
        - {name: migrations, configMap: {name: shop-migrations}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx
  namespace: shop
data:
  default.conf: |
    server {
      listen 8080;
      # 每个请求现场压缩商品目录，CPU 消耗与请求量成正比（HPA 达到上限场景依赖这一点）
      gzip on;
      gzip_comp_level 9;
      gzip_min_length 0;
      gzip_types text/plain;
      location = /healthz { return 200 "ok\n"; }
      location = /catalog {
        alias /data/catalog.txt;
        default_type text/plain;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
  labels: {app: api}
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels: {app: api, shop.example/migrations: wait}
spec:
  # 发布卡住时旧 Pod 保留，新 Pod 停在 Init（maxUnavailable 0）
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  progressDeadlineSeconds: 300
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: srenautix.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: api}
      initContainers:
        - name: wait-for-migrations
          image: postgres
          command:
            - sh
            - -c
            - |
              until psql -tAc "SELECT 1 FROM schema_migrations WHERE release_id = '${RELEASE_ID}'" 2>/dev/null | grep -q 1; do
                echo "waiting for the migrations of release ${RELEASE_ID}"
                sleep 5
              done
          env:
            - {name: RELEASE_ID, value: RELEASE}
            - {name: PGHOST, value: postgres.shop.svc}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: shop}
            - {name: PGCONNECT_TIMEOUT, value: "3"}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
        - name: catalog
          image: busybox
          command: [sh, -c, "seq 1 300000 | sed 's/$/ catalog item/' > /data/catalog.txt"]
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: http
          image: RELEASE_IMAGE
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          # 每个 /catalog 请求在一个 nginx worker 中单线程压缩约 5 MB：limit 不低于一个核，单个请求不会被 CFS 节流
          # （500m 时稳态 1 次/秒的背景流量就让约 30% 的周期被节流，CPUThrottlingHigh 持续触发）。
          # HPA 按 request 计算利用率，limit 不影响 hpa-at-max 场景
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 1000m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: nginx, mountPath: /etc/nginx/conf.d}
        # 应用的数据库连接检查：连不上 postgres 时存活探针失败，容器重启，反复失败后进入 CrashLoopBackOff
        - name: db-check
          image: postgres
          command: [sh, -c, "trap 'exit 0' TERM; while true; do sleep 3600 & wait; done"]
          env:
            - name: DB_HOST
              value: postgres.shop.svc
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h "$DB_HOST" -p 5432 -t 2']
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h "$DB_HOST" -p 5432 -t 2']
            periodSeconds: 5
            timeoutSeconds: 4
          # 存活与就绪探针每 5 秒各在容器内启动一次 sh 与 pg_isready，启动开销超过 100m 的单周期配额，
          # 空闲容器的大部分周期都被节流；500m 容得下两次探针的启动
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: nginx, configMap: {name: api-nginx}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: shop
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / {
        proxy_pass http://api.shop.svc:8080/catalog;
        proxy_set_header Accept-Encoding gzip;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
  labels: {app: web}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: srenautix.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: nginx
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: nginx, configMap: {name: web-nginx}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  mode: ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  labels: {app: checkout, shop.example/migrations: wait}
spec:
  replicas: 2
  # 发布卡住的判定时间较短，错误配置发布场景中 Deployment 很快进入 ProgressDeadlineExceeded
  progressDeadlineSeconds: 120
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      initContainers:
        - name: wait-for-migrations
          image: postgres
          command:
            - sh
            - -c
            - |
              until psql -tAc "SELECT 1 FROM schema_migrations WHERE release_id = '${RELEASE_ID}'" 2>/dev/null | grep -q 1; do
                echo "waiting for the migrations of release ${RELEASE_ID}"
                sleep 5
              done
          env:
            - {name: RELEASE_ID, value: RELEASE}
            - {name: PGHOST, value: postgres.shop.svc}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: shop}
            - {name: PGCONNECT_TIMEOUT, value: "3"}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: checkout
          image: busybox
          command:
            - sh
            - -c
            - |
              mode=$(cat /config/mode)
              if [ "$mode" != ok ]; then
                echo "checkout: invalid mode '$mode' in /config/mode" >&2
                exit 1
              fi
              # 启动时按 CACHE_MB 预热内存缓存（内存卷计入容器内存；配置与资源场景把它调大，超过内存上限）
              echo "checkout: started with mode=$mode, cache ${CACHE_MB}MiB, database $DB_HOST"
              dd if=/dev/zero of=/cache/warm bs=1048576 count="$CACHE_MB" 2>/dev/null
              # 缓存预热完成之后才就绪：预热中被 OOMKilled 的新 Pod 从未就绪，发布停在第一个新 Pod，旧 Pod 继续服务
              touch /tmp/ready
              trap 'exit 0' TERM
              while true; do sleep 3600 & wait; done
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 2
          env:
            - name: DB_HOST
              value: postgres.shop.svc
            - name: CACHE_MB
              value: "4"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache, mountPath: /cache}
      volumes:
        - {name: config, configMap: {name: checkout-config}}
        - {name: cache, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
