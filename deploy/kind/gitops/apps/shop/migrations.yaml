# 每个发布一个迁移文件（键 <发布 ID>.sql），迁移 Job 在一个事务里执行。
# r2 引用了不存在的表：发布 r2 的迁移 Job 失败，api 与 checkout 的新 Pod 停在 wait-for-migrations（"发布卡在 initContainer"场景）
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-migrations
  namespace: shop
data:
  r1.sql: |
    CREATE TABLE IF NOT EXISTS catalog (id integer PRIMARY KEY, name text NOT NULL);
  r2.sql: |
    ALTER TABLE catalog_items ADD COLUMN price numeric NOT NULL DEFAULT 0;
  r3.sql: |
    ALTER TABLE catalog ADD COLUMN IF NOT EXISTS price numeric NOT NULL DEFAULT 0;
