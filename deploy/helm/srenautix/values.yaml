# SreNautix Helm values。
# 三种安装配置的预设见 values-observe.yaml、values-standard.yaml、values-compliance.yaml；
# 也可以只写 --set profile=observe，未显式设置的开关按 profile 取默认值（见 templates/_profile.tpl）。

# observe | standard | compliance
profile: standard

# 所有事件键、拓扑和审计记录都带 cluster_id（小写字母、数字与连字符）
clusterId: default

# 消息与通知中的控制台链接前缀；为空时取 ingress 的第一个主机名（https），没有 ingress 时取 server 的集群内地址
publicUrl: ""

# 镜像对应的 40 位提交 SHA，worker 写进每次研判的清单（DESIGN §8.5）。
# 发布的 chart 由 release 工作流写在 Chart 注解 srenautix.io/code-sha 中，这里为空时取注解；
# 使用仓库中的 chart 与自己构建的镜像时填写
codeSha: ""

global:
  # 非空时替换两个镜像的仓库主机名，用于离线安装的私有仓库
  imageRegistry: ""
  imagePullSecrets: []
  # 对所有角色生效的调度约束，与各角色自己的设置合并（合规配置要求专用节点池）
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}

image:
  hub:
    repository: ghcr.io/zzhihon/srenautix
    # 为空时使用 Chart.appVersion
    tag: ""
    # 非空时按 digest 拉取，忽略 tag
    digest: ""
    pullPolicy: IfNotPresent
  spoke:
    repository: ghcr.io/zzhihon/srenautix-spoke
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

# 每个角色的 enabled 为 null 时按 profile 决定：
# observe：server、worker；standard 与 compliance：再加 reader、gateway；mcp 在三种配置下默认关闭。
roles:
  server:
    enabled: null
    replicas: 1
    # 单集群安装时 server 直接读取本集群（只读、不含 Secret）
    clusterRead: true
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    service:
      type: ClusterIP
      annotations: {}
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
      # - host: srenautix.example.com
      tls: []
    # server 的 GitHub App（安装令牌）：拓扑覆盖规则 PR、事件 issue（issues）与 GitHub 变更源（changes.sources）共用。
    # server 只读取 Secret 的 private-key.pem（挂载在 /etc/srenautix/secrets/github-app，可以与 gateway 共用同一个 Secret）；
    # chart 生成 server 配置的 github_app（private_key_file、apiUrl 非空时的 api_base，以及 appId、installationId）。
    # App 权限：issues、pull_requests 写，contents 读
    githubApp:
      existingSecret: ""
      appId: ""
      installationId: ""
      apiUrl: ""
    # 与 chart 生成的 server 配置深度合并（键见 apps/srenautix/src/config/server.ts），
    # 用于 notify（Telegram、飞书）、stage_a、scheduler 等业务设置；同名键以这里为准
    config: {}
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
    podLabels: {}
    podAnnotations: {}
  worker:
    enabled: null
    replicas: 1
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: "2", memory: 1Gi}
    # 与 chart 生成的 worker 配置深度合并（键见 apps/srenautix/src/research/config.ts）。
    # 必须给出 llm.routes（模型路由，api_key_file 指向 /etc/srenautix/secrets/llm/<键>）与 budget.daily_tokens；
    # cluster_id、code_sha、hub、inbound、database、listen 由 chart 生成
    config: {}
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
    podLabels: {}
    podAnnotations: {}
  mcp:
    enabled: null
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    # 与 chart 生成的 mcp 配置深度合并（键见 apps/srenautix/src/roles/mcp.ts）。
    # 必须给出 public_url、authorization_server 与 clients（每个客户端的 hub_token_file 是中心登记的外部调用方 token）；
    # enabled、listen、hub_url 由 chart 生成
    config: {}
    # 外部调用方 token 所在的 Secret，挂载到 /etc/srenautix/secrets/mcp-clients/
    clientTokensSecret: ""
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
    podLabels: {}
    podAnnotations: {}
  reader:
    enabled: null
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    # 声明的证据查询清单（键 queries.yaml）所在的 ConfigMap；为空时 reader 拒绝声明查询
    queryManifestConfigMap: ""
    # 与 chart 生成的 reader 配置深度合并（键见 internal/spoke/reader/config.go）；
    # cluster_id、listen、hub、datasources、alerts、history、query_manifest 由 chart 生成
    config: {}
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
    podLabels: {}
    podAnnotations: {}
  gateway:
    enabled: null
    # gateway 固定单副本 + Recreate（设计 §9.4），这里没有 replicas
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    # 启用的动作；每个动作对应准入策略（files/admission/）与 RBAC（templates/gateway/_catalog.tpl）
    actions:
      - node_cordon
      - node_uncordon
      - workload_scale
      - rollout_pause
      - rollout_resume
      - pod_restart
    # 本集群的 gateway 策略（contract/gateway/v1/gateway-policy.schema.json，DESIGN §2.1 中由 Git 管理）。
    # content 为策略 YAML 原文；existingConfigMap 为已存在的 ConfigMap（键 <clusterId>.yaml，可另有键 REVISION），二选一。
    # server 以同一份内容核对提议（policies_dir）
    policy:
      content: ""
      existingConfigMap: ""
    # gateway 信任的签名公钥（contract/gateway/v1/approver-keys.schema.json）：server 的服务签名公钥与审批人通行密钥。
    # content 为 YAML 原文；或已存在的 ConfigMap / Secret（键 approver-keys.yaml），三选一
    approverKeys:
      content: ""
      existingConfigMap: ""
      existingSecret: ""
    # 启用 workflow_submit 时必填：`srenautix-spoke admission workflow-allowlist --policy=<Git 中的 gateway 策略>`
    # 输出的 ValidatingAdmissionPolicy 原文（模板白名单与参数约束），chart 按动作目录中的策略同样渲染并绑定
    workflowAllowlistPolicy: ""
    # 启用 gitops_pr 时必填：GitHub App 凭证的 Secret（键 app-id、installation-id、private-key.pem），挂载为 gateway.github_app_dir。
    # slug 是 App 的 URL 名称（不是敏感信息），gateway 首次取令牌前用 GET /app 核对，不一致时拒绝使用：
    # 写在 slug 中（chart 生成 ConfigMap，与 Secret 投射到同一目录），为空时取 Secret 的 slug 键。GitHub Enterprise 时设置 apiUrl
    githubApp:
      existingSecret: ""
      slug: ""
      apiUrl: ""
    # 收到 SIGTERM 后不再认领工单，等进行中的执行、校验与撤销完成；至少覆盖动作目录中最长的校验时间窗（1800 秒）
    terminationGracePeriodSeconds: 1860
    # 本地审计暂存卷
    auditStaging:
      size: 1Gi
      storageClass: ""
    # 与 PG 实例的反亲和：preferred | required | none
    pgAntiAffinity: preferred
    # 与 chart 生成的 gateway 配置深度合并（键见 internal/spoke/gateway/run.go）
    config: {}
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""
    podLabels: {}
    podAnnotations: {}

# 熔断开关 srenautix-freeze：准入策略以 paramRef 引用，ConfigMap 缺失时拒绝 gateway 的全部写入。
# frozen=true 时 gateway 只提议、不执行。
freeze:
  frozen: true

# 治理选项；null 按 profile 取值，合规配置不允许放宽
governance:
  # 三权分立：admin 拆成 sys-admin 与 security-admin
  separationOfDuties: null
  # H 档审批必须使用通行密钥
  requirePasskey: null
  # 提议人能否审批自己的 L 档提议
  allowSelfApproval: null
  # H 档审批要求的重新认证时间窗（秒）
  highTierReauthMaxAgeSeconds: 300

# 数据源地址。server 用 prometheus 做证据卡查询与 ALERTS 对账，用 alertmanager 做 60 秒对账；
# worker 与 reader 的数据源配置写在各自的 roles.<角色>.config 中
datasources:
  prometheus:
    url: ""
    # promql | metricsql
    dialect: promql
  alertmanager: {url: ""}
  loki: {url: ""}
  tempo: {url: ""}

# 告警接入源（server 的 ingest.sources）。每个接入源一个 bearer token，
# 挂载为 /etc/srenautix/secrets/ingest/<id>；kind：alertmanager | grafana | nightingale | generic
ingest:
  sources:
    - {id: alertmanager, kind: alertmanager}
  # 已存在的 Secret，键为接入源 id；为空时由 chart 生成并在升级时保留
  existingSecret: ""
  # Prometheus 的 external labels：不计入告警身份（ADR 0117）。为空时用 server 的默认值 [prometheus, prometheus_replica]；
  # 告警源加了别的 external label（例如 vmalert 的 -external.label=cluster=x）时写在这里，要包含默认的两个
  externalLabels: []

# 需要人跟进的事件在 GitHub 开 issue，并关联修复 PR（需要 roles.server.githubApp）。enabled 以外的键原样写入 server 配置的
# issues（labels、title_prefix、max_per_hour、lookback、interval，见 apps/srenautix/src/config/server.ts）
issues:
  enabled: false
  # owner/name
  repo: ""
  labels: [srenautix]

# 变更（DESIGN §5 的"30 分钟内的变更"）。
changes:
  # 托管在 GitHub 上的仓库，经 roles.server.githubApp 用 REST API 读取；
  # 每一项原样写入 server 配置：{id, kind: github, repo, branch, paths: [{prefix, targets, kind}]}
  sources: []
  # 从拓扑推导发布变更：Pod 模板上表示版本的标签变化即一次发布，groupWithin 内同一版本或同一个管理应用的变化合成一次
  kubernetes:
    enabled: true
    # 可追加自己的发布标签，例如 GitOps 仓库写入 Pod 模板的发布 ID 标签
    revisionLabels: [app.kubernetes.io/version, helm.sh/chart]
    groupWithin: 2m
    # 发布之前的 Job（迁移、预检）按这些标签的取值关联到发布：Job 上的取值等于新 ReplicaSet 或工作负载上的同名标签时，
    # Job 算作发布的第一步（ADR 0104 §13）。默认不启用，例如 [example.com/release-id]
    preStepLabels: []

# 集群状态检测器（server 配置的 detectors）：没有告警规则时也能发现 Pod 卡在 Init 或 Pending、rollout 停滞、CrashLoop、
# PDB 阻塞驱逐与 Job 失败。只读，复用拓扑的 informer（单集群）或 reader 的上报（多集群），发现结果与告警一样进入事件。
# 关闭时 server 配置中不写这一节
detectors:
  enabled: false
  namespaces: ["*"]
  excludeNamespaces: []
  podInitAfter: 10m
  podPendingAfter: 10m
  rolloutStalledAfter: 15m
  crashLoopAfter: 5m
  pdbBlockedAfter: 10m
  jobFailed: true
  severity: warning
  interval: 30s
  # 告警名 → 检测器发现类型：同一对象上同类的告警规则与检测器发现去重
  equivalentAlerts: {}

# 自愈 PR：结论属于允许的类别且达到允许的结论等级时，向 GitOps 仓库开 PR 并关联事件 issue，由人审阅合并，SreNautix 从不合并。
# PR 只经 gateway 的 gitops_pr 推送（只改 Git、不写集群，冻结时也执行），需要 roles.gateway.actions 含 gitops_pr、
# roles.gateway.githubApp 与 roles.server.githubApp。分支前缀固定为 srenautix/，推送前后核对 refs。
# chart 生成 server 配置的 remediation；roles.gateway.policy.content 中没有 gitops 一节时，chart 按下面的值补上 gitops 一节
# 与 gitops_pr 动作（自动批准规则 remediation-pr）。gateway 策略来自 existingConfigMap 时由策略自己写这些。
remediation:
  enabled: false
  # 目标仓库 owner/name 与目标分支
  repository: ""
  baseBranch: main
  # 补丁模板的文件角色 → {path, format, fields}（领域包 gitops 的模板引用文件角色，不写路径）
  files: {}
  categories: [release_rollback, config_resource, alert_rule, topology_coverage]
  conclusions: [likely, evidence_consistent]
  # PR 标题前缀；为 null 时取通知前缀（notify.prefix）
  titlePrefix: null
  # 以下写入 gateway 策略的 gitops 一节
  # 允许修改的路径前缀（以 / 结尾表示目录）或完整路径
  paths: []
  reviewers: []
  # 每个仓库每小时开 PR 的上限，超出的工单拒绝
  maxPerHour: 2
  # base 分支没有分支保护时必填：{approvedBy, approvedAt, reference}，记录批准补偿控制的人、日期与依据
  compensatingControls: {}
  # main 出现非人工提交（App 直接推送、App 自己合并的 PR、未列出的机器人）时告警，并停止 gitops_pr
  mainWatchdog:
    interval: 5m
    lookback: 24h
    allowedBots: []

# 领域包：内置包在镜像的 /app/packs；用户的包以 ConfigMap 挂载
packs:
  # 每项是 ConfigMap 名（包名与它相同），或 {configMap: <名>, pack: <包名>}。一个 ConfigMap 放一个包：
  # 顶层文件以文件名为键，子目录中的文件以 <子目录>__<文件名> 为键（例如 runbooks__provider.md、tests__replay__x.json）
  userConfigMaps: []
  # 含 pack.lock 的 ConfigMap（键 pack.lock）；为空时由 server 在启动时计算
  lockConfigMap: ""
  # 用户包内容的版本（ADR 0143），由提供上面这些 ConfigMap 的一方填写，建议取 `srenautix pack lint` 输出的 pack.lock 摘要。
  # chart 不渲染用户包的 ConfigMap，算不出它们的校验和；server 只在启动时加载领域包。非空时 server 与 worker 的
  # Pod 模板带注解 checksum/packs（取值的 sha256），包变了、这里跟着变，就滚动更新；为空时没有这个注解，改了包要手动重启
  revision: ""
  # OCI 仓库中经 cosign 签名的领域包（镜像内带 cosign 与 oras）。sources 的每一项原样写入 server 配置的 packs.oci.sources：
  # repository、digest（sha256 固定）、key_file 或 certificate_identity + certificate_oidc_issuer（见 apps/srenautix/src/config/server.ts）。
  # key_file 写 /etc/srenautix/secrets/pack-keys/<键>，公钥放在 keySecret 指定的 Secret 中
  oci:
    sources: []
    keySecret: ""
    # 私有仓库凭证（类型 kubernetes.io/dockerconfigjson），以 DOCKER_CONFIG 提供给 oras 与 cosign
    dockerConfigSecret: ""
    # 拉取目录（emptyDir）的容量上限
    cacheSize: 512Mi

identity:
  # 本地管理员（只用于首次引导与紧急入口）。Secret 的两个键：
  #   password_hash：`srenautix admin hash-password` 输出的 scrypt 哈希
  #   totp_secret：base32 的 TOTP 密钥
  # existingSecret 为空时不启用本地管理员
  localAdmin:
    username: admin
    existingSecret: ""
    # 登录是否要求 TOTP（ADR 0118）。false 时本地管理员只凭口令登录（例如控制台前面已有 Cloudflare Access 之类的访问控制），
    # Secret 中的 totp_secret 保留；server 启动时打警告，控制台显示"TOTP 已关闭"，开关的变化写入审计链。
    # H 档审批的重新认证仍然要求口令加 TOTP
    totpRequired: true
    # 启用本地管理员时，chart 在角色绑定中加一个 local-admin.yaml：组 srenautix:local-admin → admin
    # （合规配置三权分立时为 sys-admin），作用域为全部集群与命名空间。identity.bindings 中已有 local-admin.yaml 时以它为准；
    # 使用 bindingsConfigMap 时 chart 不生成绑定，需要在那个 ConfigMap 中自行加入。接入 OIDC 后建议设为 false 或收窄作用域
    bindAdmin: true
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    scopes: [openid, profile, email, groups]
    groupsClaim: groups
    nameClaim: preferred_username
    # 含 client_secret 键的 Secret
    existingSecret: ""
  # 角色绑定（DESIGN §13）：文件名 → 内容，渲染成 ConfigMap 挂载到 /etc/srenautix/bindings；
  # bindingsConfigMap 非空时改用这个已存在的 ConfigMap（例如由 GitOps 同步）
  bindings: {}
  bindingsConfigMap: ""

# L 档审批的服务签名（server 签名，gateway 校验）
approvals:
  keyId: default

# 角色之间的服务 token。键：worker、reader、gateway（各自调用 server），server（server 调用 worker 的内部 API），
# server.sha256（server token 的 sha256，worker 用它校验来访）。
# existingSecret 为空时由 chart 生成，升级时用 lookup 沿用；Argo CD 等 GitOps 渲染时 lookup 为空，每次渲染都会得到新 token，
# 这种部署必须提供 existingSecret（例如 SealedSecret）
serviceTokens:
  existingSecret: ""

# server 的服务调用方文件（键 callers.yaml，格式见 apps/srenautix/src/identity/callers.ts），只保存 token 的 sha256。
# existingSecret 为空时由 chart 按 serviceTokens 生成，并追加 extra 中的条目（外部调用方只能提议）；
# 提供 serviceTokens.existingSecret 时也必须提供本项
callers:
  existingSecret: ""
  extra: []
  # - id: holmes
  #   kind: external
  #   channel: api
  #   actions: [workload_scale]
  #   namespaces: [shop]
  #   token_sha256: <64 位十六进制>

# 已存在的 Secret 名称。chart 按设计 §1.1 决定哪些角色挂载哪些 Secret，挂载路径为 /etc/srenautix/secrets/<键>/
secrets:
  # 模型密钥，只挂到 worker
  llm: {existingSecret: ""}
  # 渠道 token（Telegram bot token、飞书 app secret 等），只挂到 server
  channels: {existingSecret: ""}
  # 服务签名密钥（只签 L 档审批）：键 private.pem（Ed25519，PKCS#8），只挂到 server；
  # 对应的公钥写进 roles.gateway.approverKeys（use: service）。observe 以外的配置必填
  serviceSigningKey: {existingSecret: ""}
  # 治理审计链检查点签名密钥（键 private.pem，Ed25519），只挂到 server；为空时由 chart 生成并保留
  auditSigningKey: {existingSecret: ""}
  # 执行审计链检查点签名密钥（键 private.pem，Ed25519），只挂到 gateway；为空时由 chart 生成并保留
  gatewayAuditSigningKey: {existingSecret: ""}
  # 数据源只读凭证：server、worker、reader
  datasources: {existingSecret: ""}

database:
  # cnpg：在本命名空间创建 CNPG Cluster（需要已安装 CNPG operator）；external：使用外部 PostgreSQL 16+
  mode: cnpg
  name: srenautix
  # server、worker 的 initContainer（`db wait`）等到自己的 schema 存在且属于自己的库角色后再启动主进程。
  # db bootstrap 不是 Helm hook：CNPG 的 Cluster 与 bootstrap Job 在同一次安装中创建，pre-install 钩子会在 PG 存在之前运行；
  # 外部 PG 没有 adminSecret 时由管理员手动 bootstrap，这期间 Pod 停在 Init 状态
  waitForSchema: true
  # chart 自带的一次性容器（initContainer wait-for-schema 与 db-bootstrap Job，都是 Node 进程）的资源；
  # 默认内存 request 等于 limit，满足要求两者相等的准入规则
  waitForSchemaResources:
    requests: {cpu: 10m, memory: 128Mi}
    limits: {cpu: 200m, memory: 128Mi}
  bootstrapResources:
    requests: {cpu: 10m, memory: 256Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # 每个角色一个库角色，server 与 worker 各自拥有一个 schema（DESIGN §2.1）；mcp 不连接数据库
  roles:
    server: {username: srenautix_server}
    worker: {username: srenautix_worker}
  external:
    host: ""
    port: 5432
    # disable | require | verify-full
    sslmode: verify-full
    # 含 ca.crt 的 Secret，sslmode=verify-full 时必填
    caSecret: ""
    # 每个角色的密码 Secret（键 password）
    passwordSecrets:
      server: ""
      worker: ""
    # 数据库管理员凭证（键 username、password）。设置后 chart 运行 db bootstrap Job 建库角色与 schema；
    # 为空时由数据库管理员手动执行一次 `srenautix db bootstrap`
    adminSecret: ""
  cnpg:
    instances: 2
    # 设计要求至少 2 个实例；单实例只用于明确接受风险的部署
    allowSingleInstance: false
    # 为空时使用 CNPG operator 的默认 PostgreSQL 镜像
    imageName: ""
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {}
    parameters: {}
    # preferred | required
    podAntiAffinityType: preferred
    nodeSelector: {}
    tolerations: []
    # CNPG operator 所在命名空间，NetworkPolicy 放行它访问实例
    operatorNamespace: cnpg-system
    # 原样传给 Cluster.spec.backup
    backup: {}
    # 已存在的密码 Secret（类型 kubernetes.io/basic-auth）；为空时由 chart 生成并保留
    passwordSecrets:
      server: ""
      worker: ""

# 审计汇：执行链（gateway）与治理链（server）以 JSONL 哈希链写入对象存储
audit:
  # minio：在本命名空间部署小型 MinIO；s3：外部 S3 兼容存储；pg：写入 PG 独立表（只限 observe / standard，控制台持续提示风险）
  # 为 null 时按 profile 决定：observe 为 pg，standard 与 compliance 为 minio
  sink: null
  bucket: srenautix-audit
  objectLock:
    enabled: true
    # GOVERNANCE | COMPLIANCE；为 null 时 compliance 为 COMPLIANCE，其余为 GOVERNANCE
    mode: null
    retentionDays: 180
  s3:
    endpoint: ""
    region: ""
    forcePathStyle: true
    # 每个角色的凭证 Secret（键 accessKey、secretKey）：server 写治理链（前缀 governance/），gateway 写执行链（前缀 execution/），
    # 建议两个账号分别只能写自己的前缀；某个角色未设置时使用 existingSecret
    existingSecrets:
      server: ""
      gateway: ""
    existingSecret: ""
  minio:
    image:
      repository: cgr.dev/chainguard/minio
      digest: sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    clientImage:
      repository: cgr.dev/chainguard/minio-client
      digest: sha256:f4ffdb6d79586e6255d138641ab5e6b0dca8f188df4291fd62a3278785bbe468
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    # 建桶、对象锁与写入账号的一次性 Job（mc）；默认内存 request 等于 limit
    setupResources:
      requests: {cpu: 10m, memory: 128Mi}
      limits: {cpu: 200m, memory: 128Mi}
    nodeSelector: {}
    tolerations: []

# 自身监控：PrometheusRule、ServiceMonitor 与 Grafana 看板
selfMonitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  dashboard:
    enabled: false
    # Grafana sidecar 识别的标签
    labels:
      grafana_dashboard: "1"
    # 为空时放在发布所在命名空间
    namespace: ""
  # 自身告警必须发往 SreNautix 以外的接收方。每条告警都带 srenautix_self="true" 与下面的路由标签，
  # 在 Alertmanager 中把这些标签路由到 receiver 指定的接收方。
  receiver: ""
  routeLabels: {}

# 可选：用 prometheus-operator 的 AlertmanagerConfig 把告警路由到 SreNautix。
# 自身告警（srenautix_self="true"）先路由到 selfMonitoring.receiver，SreNautix 的 webhook 路由排除它们。
alertmanagerConfig:
  enabled: false
  labels: {}
  # SreNautix webhook 接收方的名称
  receiverName: srenautix
  groupWait: 30s
  groupInterval: 1m
  repeatInterval: 4h
  # selfMonitoring.receiver 的接收方配置（AlertmanagerConfig receivers[] 的一项，不含 name）
  selfReceiverSpec: {}

networkPolicy:
  enabled: true
  # kube-apiserver 的地址段；为空时放行到任意地址的 apiServerPorts
  apiServerCIDRs: []
  apiServerPorts: [443, 6443]
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # 可以访问 server HTTP 端口（webhook、控制台）的来源；为空时允许任意来源
  serverIngressFrom: []
  # 可以抓取指标端口的来源
  metricsIngressFrom:
    - namespaceSelector: {}
  # 数据源（Prometheus、Alertmanager、Loki、Tempo）所在位置，server、worker、reader 可以访问
  datasourcesEgressTo: []
  # 模型端点，只有 worker 可以访问；为空时放行到任意地址的 443
  modelsEgressTo: []
  # 聊天渠道（Telegram、飞书等）与 OIDC 提供方，只有 server 可以访问；为空时放行到任意地址的 443
  channelsEgressTo: []
  # gateway 执行后校验使用的本地指标端点
  gatewayMetricsEgressTo: []
  # GitHub API：gateway（gitops_pr，roles.gateway.githubApp）与 server（issue、PR，roles.server.githubApp）可以访问；
  # 为空时放行到任意地址的 githubEgressPorts
  githubEgressTo: []
  # GitHub API 的端口；GitHub Enterprise 或测试用的本地 Git 服务不在 443 时修改
  githubEgressPorts: [443]
  # OCI 领域包的仓库与 Rekor（packs.oci），只有 server 可以访问；为空时放行到任意地址的 443
  packRegistriesEgressTo: []
  # 外部 S3 审计汇（audit.sink=s3）
  auditEgressTo: []
  # Cilium 环境下为 worker 生成按 FQDN 限制的出站策略
  cilium:
    enabled: false
    modelFQDNs: []

podDisruptionBudget:
  enabled: true

# 默认不使用 PriorityClass；create=true 时创建一个并用于所有角色
priorityClass:
  create: false
  name: ""
  value: 0

resourceQuota:
  enabled: false
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    persistentvolumeclaims: "10"
    requests.storage: 60Gi

# policy-controller 的 ClusterImagePolicy，校验两个镜像的 cosign 无密钥签名（合规配置默认开启）
imagePolicy:
  enabled: null
  issuer: https://token.actions.githubusercontent.com
  # 镜像由可复用工作流 image.yml 签名，证书主体是该工作流的路径
  subjectRegExp: ^https://github\.com/Zzhihon/SreNautix/\.github/workflows/image\.yml@refs/(heads/main|tags/v.+)$
  # 隔离网络中引用离线包里的 TrustRoot（trustroot.yaml，名称 srenautix-sigstore）；为空时使用公共 Sigstore
  trustRootRef: ""

# 额外的只读 RBAC 规则，追加到 server、worker、mcp、reader（不允许包含 secrets）
rbac:
  extraReadRules: []
