suite: 配置校验
templates:
  - templates/validate.yaml
values:
  - ../ci/base/required.yaml
release:
  name: t
  namespace: srenautix
capabilities:
  majorVersion: "1"
  minorVersion: "34"
tests:
  - it: observe 默认配置通过校验
    set:
      profile: observe
    asserts:
      - hasDocuments: {count: 0}

  - it: server 不能关闭
    set:
      profile: observe
      roles.server.enabled: false
    asserts:
      - failedTemplate: {errorPattern: server 是必需的角色}

  - it: 必须给出 Prometheus 地址
    set:
      profile: observe
      datasources.prometheus.url: ""
    asserts:
      - failedTemplate: {errorPattern: 必须设置 datasources.prometheus.url}

  - it: observe 以外的配置必须提供服务签名密钥
    set:
      profile: standard
      roles.gateway.enabled: false
      secrets.serviceSigningKey.existingSecret: ""
    asserts:
      - failedTemplate: {errorPattern: 必须设置 secrets.serviceSigningKey.existingSecret}

  - it: observe 配置不需要服务签名密钥
    set:
      profile: observe
      secrets.serviceSigningKey.existingSecret: ""
    asserts:
      - hasDocuments: {count: 0}

  - it: clusterId 必须是 DNS 标签
    set:
      profile: observe
      clusterId: Prod_1
    asserts:
      - failedTemplate: {errorPattern: clusterId 只能包含}

  - it: 接入源 id 不能重复
    set:
      profile: observe
      ingest.sources:
        - {id: am, kind: alertmanager}
        - {id: am, kind: grafana}
    asserts:
      - failedTemplate: {errorPattern: id 不能重复}

  - it: OIDC 需要 issuer、clientId 与 Secret
    set:
      profile: observe
      identity.oidc.enabled: true
    asserts:
      - failedTemplate: {errorPattern: identity.oidc.enabled=true 时必须设置}

  - it: CNPG 默认至少 2 个实例
    set:
      profile: observe
      database.cnpg.instances: 1
    asserts:
      - failedTemplate: {errorPattern: 至少为 2}

  - it: 显式接受风险后允许单实例
    set:
      profile: observe
      database.cnpg.instances: 1
      database.cnpg.allowSingleInstance: true
    asserts:
      - hasDocuments: {count: 0}

  - it: 外部 PostgreSQL 必须给出地址与密码 Secret
    set:
      profile: observe
      database.mode: external
    asserts:
      - failedTemplate: {errorPattern: 必须设置 database.external.host}

  - it: 境外模型路由没有允许出境时不阻止安装（worker 禁用该路由，见 NOTES 与 ADR 0062）
    set:
      profile: standard
      roles.worker.config.llm.allow_cross_border: false
    asserts:
      - hasDocuments: {count: 0}

  - it: CNPG 角色密码 Secret 不能与 CNPG 自己的 Secret 重名
    set:
      profile: observe
      database.cnpg.passwordSecrets.server: t-srenautix-pg-server
    asserts:
      - failedTemplate: {errorPattern: 与 CNPG 自己管理的 Secret 重名}

  - it: 外部 PostgreSQL 使用 verify-full 时必须给出 CA
    set:
      profile: observe
      database.mode: external
      database.external.host: pg.example.com
      database.external.passwordSecrets.server: a
      database.external.passwordSecrets.worker: b
    asserts:
      - failedTemplate: {errorPattern: 必须设置 database.external.caSecret}

  - it: 开启自身告警时必须指定 SreNautix 以外的接收方
    set:
      profile: observe
      selfMonitoring.prometheusRule.enabled: true
    asserts:
      - failedTemplate: {errorPattern: 必须设置 selfMonitoring.receiver}

  - it: 自身告警需要路由标签
    set:
      profile: observe
      selfMonitoring.prometheusRule.enabled: true
      selfMonitoring.receiver: platform-oncall
    asserts:
      - failedTemplate: {errorPattern: selfMonitoring.routeLabels 不能为空}

  - it: 自身告警的接收方不能是 SreNautix 自己
    set:
      profile: observe
      selfMonitoring.prometheusRule.enabled: true
      selfMonitoring.receiver: srenautix
      selfMonitoring.routeLabels.team: platform
    asserts:
      - failedTemplate: {errorPattern: 不能是 SreNautix 自己的接收方}

  - it: 自身告警的 webhook 不能指向 SreNautix server
    set:
      profile: observe
      selfMonitoring.prometheusRule.enabled: true
      selfMonitoring.receiver: platform-oncall
      selfMonitoring.routeLabels.team: platform
      alertmanagerConfig.enabled: true
      alertmanagerConfig.selfReceiverSpec:
        webhookConfigs:
          - url: http://t-srenautix-server.srenautix.svc:8080/v1/ingest/alertmanager
    asserts:
      - failedTemplate: {errorPattern: 指向 SreNautix server}

  - it: 自身告警发往其他接收方时通过
    set:
      profile: observe
      selfMonitoring.prometheusRule.enabled: true
      selfMonitoring.receiver: platform-oncall
      selfMonitoring.routeLabels.team: platform
      alertmanagerConfig.enabled: true
      alertmanagerConfig.selfReceiverSpec:
        webhookConfigs:
          - url: http://oncall-bridge.monitoring.svc:8080/alerts
    asserts:
      - hasDocuments: {count: 0}

  - it: 合规配置不允许审计写入 PG
    values:
      - ../values-compliance.yaml
    set:
      audit.sink: pg
    asserts:
      - failedTemplate: {errorPattern: 审计必须写入对象存储}

  - it: worker 需要 40 位提交 SHA
    set:
      profile: observe
      codeSha: ""
    asserts:
      - failedTemplate: {errorPattern: 40 位提交 SHA}

  - it: worker 需要模型路由
    set:
      profile: observe
      roles.worker.config: null
    asserts:
      - failedTemplate: {errorPattern: roles.worker.config.llm.routes}

  - it: 提供已有的服务 token 时必须同时提供调用方文件
    set:
      profile: observe
      serviceTokens.existingSecret: my-tokens
    asserts:
      - failedTemplate: {errorPattern: 必须同时设置 callers.existingSecret}

  - it: 外部 S3：只启用 server 时只需要 server 的凭证
    set:
      profile: observe
      audit.sink: s3
      audit.s3.endpoint: https://s3.example.com
      audit.s3.existingSecrets.server: gov
      networkPolicy.auditEgressTo:
        - ipBlock: {cidr: 203.0.113.10/32}
    asserts:
      - hasDocuments: {count: 0}

  - it: 外部 S3：缺少某个角色的凭证时渲染失败
    set:
      profile: observe
      audit.sink: s3
      audit.s3.endpoint: https://s3.example.com
    asserts:
      - failedTemplate: {errorPattern: audit.s3.existingSecrets.server 或 audit.s3.existingSecret}

  - it: 合规配置要求 COMPLIANCE 模式的对象锁与 180 天保留
    values:
      - ../values-compliance.yaml
    set:
      audit.objectLock.retentionDays: 30
    asserts:
      - failedTemplate: {errorPattern: retentionDays≥180}

  - it: 合规配置要求专用节点池
    values:
      - ../values-compliance.yaml
    set:
      global.nodeSelector: null
    asserts:
      - failedTemplate: {errorPattern: 合规配置要求专用节点池}

  - it: 合规配置不允许放宽治理选项
    values:
      - ../values-compliance.yaml
    set:
      governance.allowSelfApproval: true
    asserts:
      - failedTemplate: {errorPattern: 合规配置不允许关闭三权分立}

  - it: 合规配置要求镜像签名校验
    values:
      - ../values-compliance.yaml
    set:
      imagePolicy.enabled: false
    asserts:
      - failedTemplate: {errorPattern: 合规配置要求开启 imagePolicy}

  - it: 外部 S3 审计汇需要地址与凭证
    set:
      profile: observe
      audit.sink: s3
    asserts:
      - failedTemplate: {errorPattern: audit.sink=s3 时必须设置}

  - it: Cilium FQDN 策略需要模型域名
    set:
      profile: observe
      networkPolicy.cilium.enabled: true
    asserts:
      - failedTemplate: {errorPattern: 必须列出 networkPolicy.cilium.modelFQDNs}
