suite: 角色的 ServiceAccount、配置、Service 与 PDB
templates:
  - templates/role-resources.yaml
values:
  - ../ci/base/required.yaml
release:
  name: t
  namespace: srenautix
capabilities:
  majorVersion: "1"
  minorVersion: "34"
tests:
  - it: 多副本的角色生成 PDB，单副本的不生成
    set:
      profile: observe
      roles.server.replicas: 2
    asserts:
      - containsDocument: {kind: PodDisruptionBudget, apiVersion: policy/v1, name: t-srenautix-server, any: true}
      - containsDocument: {kind: PodDisruptionBudget, apiVersion: policy/v1, name: t-srenautix-worker}
        not: true

  - it: podDisruptionBudget.enabled=false 时不生成 PDB
    set:
      profile: observe
      roles.server.replicas: 2
      podDisruptionBudget.enabled: false
    asserts:
      - containsDocument: {kind: PodDisruptionBudget, apiVersion: policy/v1, name: t-srenautix-server}
        not: true

  - it: server 的配置由部署事实生成，键与 server 配置 schema 一致
    set:
      profile: standard
    documentSelector: {path: metadata.name, value: t-srenautix-server-config}
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^cluster_id: default$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^public_url: http://t-srenautix-server\.srenautix\.svc:8080$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'token_file: /etc/srenautix/secrets/ingest/alertmanager'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'tokens_file: /etc/srenautix/secrets/callers/callers\.yaml'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'signing_key_file: /etc/srenautix/secrets/service-signing/private\.pem'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'checkpoint_key_file: /etc/srenautix/secrets/audit-key/private\.pem'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'endpoint: http://t-srenautix-minio\.srenautix\.svc:9000'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  source: reader$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  - /app/packs$'}

  - it: observe 配置的审计写入 PG，没有审批签名，拓扑由 server 的 informer 读取
    set:
      profile: observe
      secrets.serviceSigningKey.existingSecret: ""
    documentSelector: {path: metadata.name, value: t-srenautix-server-config}
    asserts:
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: 's3:'}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: 'approvals:'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  source: informer$'}

  - it: publicUrl 为空且启用 ingress 时取第一个主机名
    set:
      profile: observe
      roles.server.ingress.enabled: true
      roles.server.ingress.hosts:
        - host: srenautix.example.com
    documentSelector: {path: metadata.name, value: t-srenautix-server-config}
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^public_url: https://srenautix\.example\.com$'}

  - it: roles.server.config 与生成的配置深度合并，同名键以用户值为准
    set:
      profile: observe
      roles.server.config:
        notify:
          prefix: "[影子]"
        scheduler:
          slots: 6
        ingest:
          silence_threshold: 15m
    documentSelector: {path: metadata.name, value: t-srenautix-server-config}
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: "prefix: '\\[影子\\]'"}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'slots: 6'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'silence_threshold: 15m'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: 'self_label: srenautix_self'}

  - it: 其他角色的配置就是 roles.<角色>.config
    set:
      profile: observe
      roles.worker.config:
        budget: {daily_tokens: 15000000}
    documentSelector: {path: metadata.name, value: t-srenautix-worker-config}
    asserts:
      - equal:
          path: 'data["config.yaml"]'
          value: |
            budget:
              daily_tokens: 15000000
