suite: chart 生成的凭证
templates:
  - templates/secrets.yaml
values:
  - ../ci/base/required.yaml
release:
  name: t
  namespace: srenautix
capabilities:
  majorVersion: "1"
  minorVersion: "34"
tests:
  - it: server 的调用方文件只含启用角色的 token 摘要
    set:
      profile: observe
    documentSelector: {path: metadata.name, value: t-srenautix-callers}
    asserts:
      - matchRegex: {path: 'stringData["callers.yaml"]', pattern: 'kind: worker'}
      - matchRegex: {path: 'stringData["callers.yaml"]', pattern: 'token_sha256: [0-9a-f]{64}'}
      - notMatchRegex: {path: 'stringData["callers.yaml"]', pattern: 'kind: spoke'}

  - it: reader 与 gateway 以 spoke 身份登记，带 cluster_id
    set:
      profile: observe
      clusterId: prod
      roles.reader.enabled: true
    documentSelector: {path: metadata.name, value: t-srenautix-callers}
    asserts:
      - matchRegex: {path: 'stringData["callers.yaml"]', pattern: 'id: spoke-prod-reader'}
      - matchRegex: {path: 'stringData["callers.yaml"]', pattern: 'cluster_id: prod'}

  - it: 外部调用方原样追加
    set:
      profile: observe
      callers.extra:
        - id: holmes
          kind: external
          channel: api
          actions: [workload_scale]
          namespaces: [shop]
          token_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    documentSelector: {path: metadata.name, value: t-srenautix-callers}
    asserts:
      - matchRegex: {path: 'stringData["callers.yaml"]', pattern: 'id: holmes'}

  - it: 生成的 token、接入源 token 与签名密钥在卸载时保留
    set:
      profile: observe
    asserts:
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
        documentSelector: {path: metadata.name, value: t-srenautix-service-tokens}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
        documentSelector: {path: metadata.name, value: t-srenautix-ingest-tokens}
      - matchRegex: {path: 'stringData.alertmanager', pattern: '^[A-Za-z0-9]{48}$'}
        documentSelector: {path: metadata.name, value: t-srenautix-ingest-tokens}
      - matchRegex: {path: 'stringData["private.pem"]', pattern: '-----BEGIN PRIVATE KEY-----'}
        documentSelector: {path: metadata.name, value: t-srenautix-audit-key}

  - it: 提供已有 Secret 时不生成接入源 token 与治理链密钥
    set:
      profile: observe
      ingest.existingSecret: my-ingest
      secrets.auditSigningKey.existingSecret: my-audit
    asserts:
      - containsDocument: {kind: Secret, apiVersion: v1, name: t-srenautix-ingest-tokens}
        not: true
      - containsDocument: {kind: Secret, apiVersion: v1, name: t-srenautix-audit-key}
        not: true

  - it: 角色绑定渲染成 ConfigMap
    set:
      profile: observe
      identity.bindings:
        team.yaml: |
          bindings: []
    documentSelector: {path: metadata.name, value: t-srenautix-bindings}
    asserts:
      - equal:
          path: 'data["team.yaml"]'
          value: |
            bindings: []
      - notExists: {path: 'data["local-admin.yaml"]'}

  - it: 启用本地管理员时默认绑定 admin，作用域为全部集群与命名空间
    set:
      profile: standard
      identity.localAdmin.existingSecret: local-admin
    documentSelector: {path: metadata.name, value: t-srenautix-bindings}
    asserts:
      - equal:
          path: 'data["local-admin.yaml"]'
          value: |
            bindings:
            - role: admin
              scope:
                clusters:
                - '*'
                namespaces:
                - '*'
              subject:
                kind: group
                name: srenautix:local-admin

  - it: 合规配置下本地管理员绑定 sys-admin
    values:
      - ../values-compliance.yaml
    set:
      identity.localAdmin.existingSecret: local-admin
    documentSelector: {path: metadata.name, value: t-srenautix-bindings}
    asserts:
      - matchRegex: {path: 'data["local-admin.yaml"]', pattern: '(?m)^- role: sys-admin$'}

  - it: bindAdmin=false 时不生成本地管理员绑定
    set:
      profile: standard
      identity.localAdmin.existingSecret: local-admin
      identity.localAdmin.bindAdmin: false
    documentSelector: {path: metadata.name, value: t-srenautix-bindings}
    asserts:
      - notExists: {path: 'data["local-admin.yaml"]'}

  - it: identity.bindings 中的 local-admin.yaml 优先于默认绑定
    set:
      profile: standard
      identity.localAdmin.existingSecret: local-admin
      identity.bindings:
        local-admin.yaml: |
          bindings:
            - {subject: {kind: group, name: "srenautix:local-admin"}, role: viewer, scope: {clusters: ["*"], namespaces: ["*"]}}
    documentSelector: {path: metadata.name, value: t-srenautix-bindings}
    asserts:
      - matchRegex: {path: 'data["local-admin.yaml"]', pattern: 'role: viewer'}
      - notMatchRegex: {path: 'data["local-admin.yaml"]', pattern: 'role: admin'}

  - it: gateway 的 GitHub App slug 写在 values 时生成 ConfigMap
    set:
      profile: standard
      roles.gateway.githubApp: {existingSecret: gh-app, slug: srenautix-bot}
    documentSelector: {path: metadata.name, value: t-srenautix-gateway-github-app}
    asserts:
      - isKind: {of: ConfigMap}
      - equal: {path: data.slug, value: srenautix-bot}

  - it: 没有 slug 时不生成 ConfigMap
    set:
      profile: standard
      roles.gateway.githubApp.existingSecret: gh-app
    asserts:
      - containsDocument: {kind: ConfigMap, apiVersion: v1, name: t-srenautix-gateway-github-app}
        not: true
