suite: 自身监控
templates:
  - templates/self-monitoring.yaml
values:
  - ../ci/base/required.yaml
release:
  name: t
  namespace: srenautix
capabilities:
  majorVersion: "1"
  minorVersion: "34"
set:
  profile: observe
  selfMonitoring:
    serviceMonitor: {enabled: true}
    prometheusRule: {enabled: true}
    dashboard: {enabled: true}
    receiver: platform-oncall
    routeLabels: {team: platform}
tests:
  - it: 每条自身告警都带 srenautix_self 与路由标签
    documentSelector: {path: kind, value: PrometheusRule}
    asserts:
      - equal: {path: 'spec.groups[0].rules[*].labels.srenautix_self', value: "true"}
      - equal: {path: 'spec.groups[0].rules[*].labels.team', value: platform}

  - it: 自身告警只使用 srenautix_ 前缀的指标与 up
    documentSelector: {path: kind, value: PrometheusRule}
    asserts:
      - matchRegex: {path: 'spec.groups[0].rules[*].expr', pattern: '(srenautix_[a-z_]+|up)\{'}

  - it: 阶段 A p95 告警阈值为 60 秒
    documentSelector: {path: kind, value: PrometheusRule}
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: SreNautixStageALatencyHigh
          any: true

  - it: 每个启用的角色一个 ServiceMonitor
    asserts:
      - containsDocument: {kind: ServiceMonitor, apiVersion: monitoring.coreos.com/v1, name: t-srenautix-server, any: true}
      - containsDocument: {kind: ServiceMonitor, apiVersion: monitoring.coreos.com/v1, name: t-srenautix-worker, any: true}

  - it: 看板 ConfigMap 带 Grafana sidecar 标签并包含看板 JSON
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - equal: {path: metadata.labels.grafana_dashboard, value: "1"}
      - matchRegex: {path: 'data["srenautix-self.json"]', pattern: '"uid": "srenautix-self"'}

  - it: AlertmanagerConfig 把自身告警送到其他接收方，其余送到 SreNautix
    set:
      alertmanagerConfig.enabled: true
      alertmanagerConfig.selfReceiverSpec:
        webhookConfigs:
          - url: http://oncall-bridge.monitoring.svc:8080/alerts
    documentSelector: {path: kind, value: AlertmanagerConfig}
    asserts:
      - equal: {path: spec.route.receiver, value: srenautix}
      - equal: {path: 'spec.route.routes[0].receiver', value: platform-oncall}
      - equal:
          path: 'spec.route.routes[0].matchers[0]'
          value: {name: srenautix_self, value: "true", matchType: "="}
      - equal: {path: 'spec.route.routes[0].continue', value: false}
      - equal: {path: spec.route.groupWait, value: 30s}
      - equal:
          path: 'spec.receivers[0].webhookConfigs[0].url'
          value: http://t-srenautix-server.srenautix.svc:8080/v1/ingest/alertmanager

  - it: 状态条件告警按方向表区分：server、worker 为 1 异常，gateway 为 0 异常（限流为 1 异常、冻结不告警），reader 用自己的指标
    set:
      profile: standard
    documentSelector: {path: kind, value: PrometheusRule}
    asserts:
      - equal:
          path: "spec.groups[0].rules[?(@.alert == 'SreNautixConditionActive')].expr"
          value: >-
            max by (namespace, role, type) (srenautix_condition{namespace="srenautix", role="gateway", type!~"ApiserverThrottled|Freeze"} != 1)
            or max by (namespace, role, type) (srenautix_condition{namespace="srenautix", role="gateway", type="ApiserverThrottled"} != 0)
            or max by (namespace, role, type) (srenautix_condition{namespace="srenautix", role="server", type!~"Frozen"} != 0)
            or max by (namespace, role, type) (srenautix_condition{namespace="srenautix", role="worker"} != 0)
            or max by (namespace, role, type) (label_replace(srenautix_reader_condition{namespace="srenautix", type!~"QueryManifest"}, "role", "reader", "", "") != 1)

  - it: 挂载了证据查询清单时 reader 的 QueryManifest 也告警
    set:
      profile: standard
      roles.reader.queryManifestConfigMap: reader-queries
    documentSelector: {path: kind, value: PrometheusRule}
    asserts:
      - matchRegex:
          path: "spec.groups[0].rules[?(@.alert == 'SreNautixConditionActive')].expr"
          pattern: 'label_replace\(srenautix_reader_condition\{namespace="srenautix"\}, "role", "reader", "", ""\) != 1'

  - it: observe 配置只有 server 与 worker 的条件
    documentSelector: {path: kind, value: PrometheusRule}
    asserts:
      - equal:
          path: "spec.groups[0].rules[?(@.alert == 'SreNautixConditionActive')].expr"
          value: >-
            max by (namespace, role, type) (srenautix_condition{namespace="srenautix", role="server", type!~"Frozen"} != 0)
            or max by (namespace, role, type) (srenautix_condition{namespace="srenautix", role="worker"} != 0)

  - it: 看板的状态条件面板使用同一张方向表
    set:
      profile: standard
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - matchRegex:
          path: 'data["srenautix-self.json"]'
          pattern: 'label_replace\(srenautix_reader_condition\{namespace=\\"\$namespace\\", type!~\\"QueryManifest\\"\}'
      - notMatchRegex: {path: 'data["srenautix-self.json"]', pattern: __UNHEALTHY_CONDITIONS__}
