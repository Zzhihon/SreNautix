{{- if eq (include "srenautix.auditSink" .) "minio" }}
{{- $a := .Values.audit }}
{{- $m := $a.minio }}
{{- $name := include "srenautix.minio.name" . }}
{{- $rootSecret := printf "%s-root" $name }}
{{- $selector := dict "app.kubernetes.io/name" (include "srenautix.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "audit-store" }}
# 审计汇：单实例 MinIO，存储桶在创建时开启对象锁（WORM），默认保留期由 audit.objectLock 决定
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rootSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-store
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  rootUser: {{ include "srenautix.persistentRandom" (dict "ctx" $ "name" $rootSecret "key" "rootUser" "length" 16) | quote }}
  rootPassword: {{ include "srenautix.persistentRandom" (dict "ctx" $ "name" $rootSecret "key" "rootPassword" "length" 40) | quote }}
{{- range $role := list "server" "gateway" }}
{{- $secret := include "srenautix.audit.credentialsSecret" (dict "ctx" $ "role" $role) }}
---
# {{ $role }} 写入审计汇使用的服务账号，只能读写对象，不能删除，也不能绕过保留期
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: audit-store
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  accessKey: {{ include "srenautix.persistentRandom" (dict "ctx" $ "name" $secret "key" "accessKey" "length" 20) | quote }}
  secretKey: {{ include "srenautix.persistentRandom" (dict "ctx" $ "name" $secret "key" "secretKey" "length" 40) | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-store
spec:
  selector:
    {{- toYaml $selector | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-store
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $selector | nindent 8 }}
        app.kubernetes.io/part-of: srenautix
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "srenautix.podSecurityContext" . | nindent 8 }}
      {{- include "srenautix.imagePullSecrets" . | nindent 6 }}
      {{- with (merge (deepCopy ($m.nodeSelector | default dict)) (.Values.global.nodeSelector | default dict)) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (concat (.Values.global.tolerations | default list) ($m.tolerations | default list)) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: {{ include "srenautix.image" (dict "ctx" $ "image" $m.image) }}
          args: [server, /data, --address, ":9000", --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ $rootSecret }}, key: rootUser}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $rootSecret }}, key: rootPassword}
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 20
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          securityContext:
            {{- include "srenautix.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $m.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $m.storage.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-store-setup
data:
  writer-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:PutObject", "s3:GetObject", "s3:GetObjectRetention", "s3:PutObjectRetention"],
          "Resource": ["arn:aws:s3:::{{ $a.bucket }}/*"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetBucketObjectLockConfiguration"],
          "Resource": ["arn:aws:s3:::{{ $a.bucket }}"]
        }
      ]
    }
  setup.sh: |
    set -eu
    # 存储桶在创建时开启对象锁；已存在时保持原样
    mc mb --ignore-existing --with-lock "local/${BUCKET}"
    {{- if $a.objectLock.enabled }}
    mc retention set --default "${LOCK_MODE}" "${LOCK_DAYS}d" "local/${BUCKET}"
    {{- end }}
    for role in server gateway; do
      eval "ak=\${${role}_ACCESS_KEY}"
      eval "sk=\${${role}_SECRET_KEY}"
      if mc admin user svcacct info local "${ak}" >/dev/null 2>&1; then
        mc admin user svcacct edit local "${ak}" --secret-key "${sk}" --policy /setup/writer-policy.json
      else
        mc admin user svcacct add local "${MINIO_ROOT_USER}" --access-key "${ak}" --secret-key "${sk}" --policy /setup/writer-policy.json
      fi
    done
---
# 创建存储桶、设置默认保留期、更新 server 与 gateway 的服务账号。每个 revision 一个普通 Job（不是 Helm 钩子）：
# gateway 启动时要求这两个账号已经存在，钩子要等全部工作负载就绪后才执行，会与 gateway 互相等待；
# 作为普通 Job 与工作负载同时创建，账号就绪之前 gateway 以失败重启
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-setup-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-store-setup
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "srenautix.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: audit-store-setup
        app.kubernetes.io/part-of: srenautix
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "srenautix.podSecurityContext" . | nindent 8 }}
      {{- include "srenautix.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: setup
          image: {{ include "srenautix.image" (dict "ctx" $ "image" $m.clientImage) }}
          command: [/bin/sh, /setup/setup.sh]
          env:
            - name: HOME
              value: /tmp
            - name: BUCKET
              value: {{ $a.bucket | quote }}
            - name: LOCK_MODE
              value: {{ include "srenautix.auditLockMode" . | quote }}
            - name: LOCK_DAYS
              value: {{ $a.objectLock.retentionDays | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ $rootSecret }}, key: rootUser}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $rootSecret }}, key: rootPassword}
            - name: MC_HOST_local
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@{{ $name }}.{{ .Release.Namespace }}.svc:9000
            {{- range $role := list "server" "gateway" }}
            {{- $secret := include "srenautix.audit.credentialsSecret" (dict "ctx" $ "role" $role) }}
            - name: {{ $role }}_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: accessKey}
            - name: {{ $role }}_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: secretKey}
            {{- end }}
          resources:
            {{- toYaml $m.setupResources | nindent 12 }}
          securityContext:
            {{- include "srenautix.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: setup
              mountPath: /setup
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: setup
          configMap:
            name: {{ $name }}-setup
        - name: tmp
          emptyDir: {}
{{- end }}
