{{- $db := .Values.database }}
{{- $dbRoles := splitList " " (include "srenautix.dbRoles" .) }}
{{- if eq $db.mode "cnpg" }}
{{- $c := $db.cnpg }}
{{- $cluster := include "srenautix.pg.clusterName" . }}
{{- range $role := $dbRoles }}
{{- if not (index $c.passwordSecrets $role) }}
{{- $secret := include "srenautix.pg.passwordSecret" (dict "ctx" $ "role" $role) }}
---
# 库角色 {{ $role }} 的密码；首次安装时生成，之后的升级沿用已有值
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
    cnpg.io/reload: "true"
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ (index $db.roles $role).username }}
  password: {{ include "srenautix.persistentRandom" (dict "ctx" $ "name" $secret "key" "password" "length" 32) | quote }}
{{- end }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ $c.instances }}
  {{- with $c.imageName }}
  imageName: {{ . }}
  {{- end }}
  primaryUpdateStrategy: unsupervised
  # db bootstrap Job 以超级用户建库角色的 schema 与权限；各角色只用自己的库角色连接
  enableSuperuserAccess: true
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  postgresql:
    {{- with $c.parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if gt (int $c.instances) 1 }}
    # 同步复制为 preferred：单个副本故障时不阻塞写入（设计 §15.2）
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    {{- end }}
  bootstrap:
    initdb:
      database: {{ $db.name }}
      owner: srenautix_owner
  # server 与 worker 的库角色属性与 srenautix db bootstrap 一致（LOGIN、NOINHERIT、无特权），密码由 CNPG 维护
  managed:
    roles:
      {{- range $role := $dbRoles }}
      - name: {{ (index $db.roles $role).username }}
        ensure: present
        login: true
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: {{ include "srenautix.pg.passwordSecret" (dict "ctx" $ "role" $role) }}
      {{- end }}
  storage:
    size: {{ $c.storage.size }}
    {{- with $c.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: {{ $c.podAntiAffinityType }}
    {{- $ns := merge (deepCopy ($c.nodeSelector | default dict)) (.Values.global.nodeSelector | default dict) }}
    {{- with $ns }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with (concat (.Values.global.tolerations | default list) ($c.tolerations | default list)) }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $c.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- $admin := include "srenautix.pg.adminSecret" . }}
{{- if $admin }}
{{- $name := printf "%s-db-bootstrap-%d" (include "srenautix.fullname" .) .Release.Revision }}
---
# 以数据库管理员执行 srenautix db bootstrap：建库角色（已存在时跳过）、server 与 worker 两个 schema 并收回 PUBLIC 权限。
# 可以重复执行；每个 revision 一个 Job，PG 尚未就绪时按 backoffLimit 重试，server 在此之前以失败重启。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-bootstrap
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "srenautix.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db-bootstrap
        app.kubernetes.io/part-of: srenautix
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "srenautix.podSecurityContext" . | nindent 8 }}
      {{- include "srenautix.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ include "srenautix.image" (dict "ctx" $ "image" .Values.image.hub) }}
          imagePullPolicy: {{ .Values.image.hub.pullPolicy }}
          args: [db, bootstrap, --admin-password-file=/etc/srenautix/secrets/db-admin/password]
          env:
            - name: PGHOST
              value: {{ include "srenautix.pg.host" . | quote }}
            - name: PGPORT
              value: {{ include "srenautix.pg.port" . | quote }}
            - name: PGDATABASE
              value: {{ $db.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: {{ $admin }}, key: username}
            - name: PGSSLMODE
              value: {{ include "srenautix.pg.sslmode" . | quote }}
            {{- if include "srenautix.pg.caSecret" . }}
            - name: PGSSLROOTCERT
              value: /etc/srenautix/secrets/db-ca/ca.crt
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            {{- include "srenautix.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: admin
              mountPath: /etc/srenautix/secrets/db-admin
              readOnly: true
            {{- if include "srenautix.pg.caSecret" . }}
            - name: ca
              mountPath: /etc/srenautix/secrets/db-ca
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: admin
          secret:
            secretName: {{ $admin }}
            items:
              - {key: password, path: password}
        {{- if include "srenautix.pg.caSecret" . }}
        - name: ca
          secret:
            secretName: {{ include "srenautix.pg.caSecret" . }}
            items:
              - {key: ca.crt, path: ca.crt}
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
