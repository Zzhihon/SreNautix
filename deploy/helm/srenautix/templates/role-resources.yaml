{{- range $role := list "server" "worker" "mcp" "reader" "gateway" }}
{{- if include "srenautix.roleEnabled" (dict "ctx" $ "role" $role) }}
{{- $r := index $.Values.roles $role }}
{{- $name := include "srenautix.roleName" (dict "ctx" $ "role" $role) }}
{{- $replicas := ternary 1 (int ($r.replicas | default 1)) (eq $role "gateway") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
data:
  config.yaml: |
    {{- include "srenautix.roleConfig" (dict "ctx" $ "role" $role) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
  {{- if eq $role "server" }}
  {{- with $r.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  type: {{ if eq $role "server" }}{{ $r.service.type }}{{ else }}ClusterIP{{ end }}
  selector:
    {{- include "srenautix.selectorLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
{{- if and $.Values.podDisruptionBudget.enabled (gt $replicas 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "srenautix.selectorLabels" (dict "ctx" $ "role" $role) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
