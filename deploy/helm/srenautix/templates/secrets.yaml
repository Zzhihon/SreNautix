{{- /*
chart 生成的凭证：服务 token 与服务调用方文件、接入源 token、审计检查点签名密钥、角色绑定，以及 gateway 的策略与审批人公钥。
随机值与密钥在首次安装时生成，之后的升级通过 lookup 沿用已有值；卸载时保留。
GitOps 渲染时 lookup 为空，每次渲染都会得到新值，这种部署通过各项的 existingSecret 提供凭证。
*/}}
{{- $fullname := include "srenautix.fullname" . }}
{{- if not .Values.serviceTokens.existingSecret }}
{{- $tokensSecret := include "srenautix.serviceTokensSecret" . }}
{{- $tokens := dict }}
{{- range $role := list "worker" "reader" "gateway" "server" }}
{{- $_ := set $tokens $role (include "srenautix.persistentRandom" (dict "ctx" $ "name" $tokensSecret "key" $role "length" 48)) }}
{{- end }}
# 角色之间的服务 token：worker、reader、gateway 调用 server，server 调用 worker；server.sha256 供 worker 校验来访
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokensSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $role := keys $tokens | sortAlpha }}
  {{ $role }}: {{ index $tokens $role | quote }}
  {{- end }}
  server.sha256: {{ index $tokens "server" | sha256sum | quote }}
{{- if not .Values.callers.existingSecret }}
---
# server 的服务调用方文件：只保存 token 的 sha256（apps/srenautix/src/identity/callers.ts）
{{- $callers := list }}
{{- if include "srenautix.roleEnabled" (dict "ctx" $ "role" "worker") }}
{{- $callers = append $callers (dict "id" "worker" "kind" "worker" "token_sha256" (index $tokens "worker" | sha256sum)) }}
{{- end }}
{{- range $role := list "reader" "gateway" }}
{{- if include "srenautix.roleEnabled" (dict "ctx" $ "role" $role) }}
{{- $callers = append $callers (dict "id" (printf "spoke-%s-%s" $.Values.clusterId $role) "kind" "spoke" "role" $role "cluster_id" $.Values.clusterId "token_sha256" (index $tokens $role | sha256sum)) }}
{{- end }}
{{- end }}
{{- $callers = concat $callers .Values.callers.extra }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "srenautix.callersSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
type: Opaque
stringData:
  callers.yaml: |
    {{- dict "callers" $callers | toYaml | nindent 4 }}
{{- end }}
{{- end }}
{{- if include "srenautix.roleEnabled" (dict "ctx" $ "role" "gateway") }}
{{- $gw := .Values.roles.gateway }}
{{- if not $gw.policy.existingConfigMap }}
---
# 本集群的 gateway 策略；gateway 挂载 <clusterId>.yaml，server 挂载整个目录（policies_dir）
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srenautix.policyConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" "gateway") | nindent 4 }}
data:
  {{ include "srenautix.policyFile" . }}: |
    {{- $gw.policy.content | nindent 4 }}
{{- end }}
{{- end }}
{{- $keys := .Values.roles.gateway.approverKeys }}
{{- if and $keys.content (not $keys.existingConfigMap) (not $keys.existingSecret) (or (include "srenautix.roleEnabled" (dict "ctx" $ "role" "gateway")) (include "srenautix.serverApproverKeys" .)) }}
---
# 审批人公钥：gateway 校验审批断言；合规配置下 server 也挂载，用于 H 档的通行密钥审批
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-approver-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" "gateway") | nindent 4 }}
data:
  approver-keys.yaml: |
    {{- $keys.content | nindent 4 }}
{{- end }}
{{- if not .Values.ingest.existingSecret }}
{{- $ingestSecret := include "srenautix.ingestTokensSecret" . }}
---
# 每个接入源一个 bearer token；Alertmanager 的 webhook 接收方用同一个 token（见 alertmanagerConfig）
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ingestSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $s := .Values.ingest.sources }}
  {{ $s.id }}: {{ include "srenautix.persistentRandom" (dict "ctx" $ "name" $ingestSecret "key" $s.id "length" 48) | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.secrets.auditSigningKey.existingSecret }}
{{- $name := include "srenautix.auditKeySecret" . }}
---
# 治理审计链的检查点签名密钥（Ed25519）
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  private.pem: |
    {{- include "srenautix.persistentKey" (dict "ctx" $ "name" $name) | nindent 4 }}
{{- end }}
{{- if and (include "srenautix.roleEnabled" (dict "ctx" $ "role" "gateway")) (not .Values.secrets.gatewayAuditSigningKey.existingSecret) }}
{{- $name := include "srenautix.gatewayAuditKeySecret" . }}
---
# 执行审计链的检查点签名密钥（Ed25519），只挂到 gateway
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  private.pem: |
    {{- include "srenautix.persistentKey" (dict "ctx" $ "name" $name) | nindent 4 }}
{{- end }}
{{- if not .Values.identity.bindingsConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srenautix.bindingsConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srenautix.labels" . | nindent 4 }}
{{- $bindings := deepCopy .Values.identity.bindings }}
{{- $la := .Values.identity.localAdmin }}
{{- if and $la.existingSecret $la.bindAdmin (not (hasKey $bindings "local-admin.yaml")) }}
{{- /* 本地管理员（破窗账号）默认拥有全部集群与命名空间的管理员权限；合规配置三权分立，绑定 sys-admin */}}
{{- $g := include "srenautix.governance" . | fromYaml }}
{{- $binding := dict "subject" (dict "kind" "group" "name" "srenautix:local-admin") "role" (ternary "sys-admin" "admin" $g.separationOfDuties) "scope" (dict "clusters" (list "*") "namespaces" (list "*")) }}
{{- $_ := set $bindings "local-admin.yaml" (toYaml (dict "bindings" (list $binding))) }}
{{- end }}
data:
  {{- range $file := keys $bindings | sortAlpha }}
  {{ $file }}: |
    {{- index $bindings $file | nindent 4 }}
  {{- end }}
{{- end }}
