{{- range $role := list "server" "worker" "mcp" "reader" "gateway" }}
{{- if include "srenautix.roleEnabled" (dict "ctx" $ "role" $role) }}
{{- $r := index $.Values.roles $role }}
{{- $name := include "srenautix.roleName" (dict "ctx" $ "role" $role) }}
{{- $spoke := has $role (list "reader" "gateway") }}
{{- $image := ternary $.Values.image.spoke $.Values.image.hub $spoke }}
{{- $config := include "srenautix.roleConfig" (dict "ctx" $ "role" $role) }}
{{- $secrets := include "srenautix.roleSecrets" (dict "ctx" $ "role" $role) | fromYamlArray }}
{{- $replicas := ternary 1 (int ($r.replicas | default 1)) (eq $role "gateway") }}
{{- $ports := include "srenautix.rolePorts" (dict "role" $role) | fromYaml }}
{{- $probePort := include "srenautix.portName" (dict "ports" $ports "port" $ports.probes) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srenautix.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: 5
  {{- if eq $role "gateway" }}
  # gateway 单副本；Lease 只用于选主隔离，Recreate 保证新旧实例不会同时执行
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "srenautix.selectorLabels" (dict "ctx" $ "role" $role) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srenautix.selectorLabels" (dict "ctx" $ "role" $role) | nindent 8 }}
        app.kubernetes.io/part-of: srenautix
        {{- with (merge (deepCopy ($r.podLabels | default dict)) ($.Values.global.podLabels | default dict)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
        {{- with (merge (deepCopy ($r.podAnnotations | default dict)) ($.Values.global.podAnnotations | default dict)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- if eq $role "gateway" }}
      terminationGracePeriodSeconds: {{ $r.terminationGracePeriodSeconds }}
      {{- end }}
      securityContext:
        {{- include "srenautix.podSecurityContext" $ | nindent 8 }}
      {{- include "srenautix.imagePullSecrets" $ | nindent 6 }}
      {{- include "srenautix.scheduling" (dict "ctx" $ "role" $role) | nindent 6 }}
      {{- $affinity := deepCopy ($r.affinity | default dict) }}
      {{- if and (eq $role "gateway") (eq $.Values.database.mode "cnpg") (ne $r.pgAntiAffinity "none") }}
      {{- $term := dict "labelSelector" (dict "matchLabels" (dict "cnpg.io/cluster" (include "srenautix.pg.clusterName" $))) "topologyKey" "kubernetes.io/hostname" }}
      {{- $pgAnti := dict }}
      {{- if eq $r.pgAntiAffinity "required" }}
      {{- $pgAnti = dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $term)) }}
      {{- else }}
      {{- $pgAnti = dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "weight" 100 "podAffinityTerm" $term))) }}
      {{- end }}
      {{- $affinity = mustMergeOverwrite $pgAnti $affinity }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $.Values.database.waitForSchema (has $role (splitList " " (include "srenautix.dbRoles" $))) }}
      # 以角色自己的库角色等到它的 schema 存在且属于自己（db bootstrap Job 建好之后）再启动主进程；
      # 外部 PG 预先建好 schema 时立即通过
      initContainers:
        - name: wait-for-schema
          image: {{ include "srenautix.image" (dict "ctx" $ "image" $.Values.image.hub) }}
          imagePullPolicy: {{ $.Values.image.hub.pullPolicy }}
          args: [db, wait, --schema={{ $role }}, --password-file={{ include "srenautix.secretsDir" $ }}/db/password]
          env:
            {{- include "srenautix.pgEnv" (dict "ctx" $ "role" $role) | nindent 12 }}
          resources:
            {{- toYaml $.Values.database.waitForSchemaResources | nindent 12 }}
          securityContext:
            {{- include "srenautix.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- range $s := $secrets }}
            {{- if has $s.key (list "db" "db-ca") }}
            - name: secret-{{ $s.key }}
              mountPath: {{ include "srenautix.secretsDir" $ }}/{{ $s.key }}
              readOnly: true
            {{- end }}
            {{- end }}
      {{- end }}
      containers:
        - name: {{ $role }}
          image: {{ include "srenautix.image" (dict "ctx" $ "image" $image) }}
          imagePullPolicy: {{ $image.pullPolicy }}
          args:
            - --role={{ $role }}
            - --config=/etc/srenautix/config.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if $spoke }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            {{- end }}
            {{- if has $role (splitList " " (include "srenautix.dbRoles" $)) }}
            {{- include "srenautix.pgEnv" (dict "ctx" $ "role" $role) | nindent 12 }}
            {{- end }}
            {{- if and (eq $role "server") $.Values.packs.oci.dockerConfigSecret }}
            # oras 与 cosign 按 DOCKER_CONFIG 读取私有仓库的凭证
            - name: DOCKER_CONFIG
              value: {{ include "srenautix.secretsDir" $ }}/pack-registry
            {{- end }}
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if gt (int $ports.http) 0 }}
            - name: http
              containerPort: {{ $ports.http }}
              protocol: TCP
            {{- end }}
            {{- if ne (int $ports.metrics) (int $ports.http) }}
            - name: metrics
              containerPort: {{ $ports.metrics }}
              protocol: TCP
            {{- end }}
            {{- if and (ne (int $ports.probes) (int $ports.http)) (ne (int $ports.probes) (int $ports.metrics)) }}
            - name: probes
              containerPort: {{ $ports.probes }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: {{ $probePort }}}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: {{ $probePort }}}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ $ports.ready }}, port: {{ $probePort }}}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          securityContext:
            {{- include "srenautix.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/srenautix/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- range $s := $secrets }}
            - name: secret-{{ $s.key | lower }}
              mountPath: {{ include "srenautix.secretsDir" $ }}/{{ $s.key }}
              readOnly: true
            {{- end }}
            {{- if eq $role "gateway" }}
            - name: audit-staging
              mountPath: /var/lib/srenautix/audit-staging
            {{- end }}
            {{- if and (eq $role "reader") $.Values.roles.reader.queryManifestConfigMap }}
            - name: query-manifest
              mountPath: /etc/srenautix/query-manifest
              readOnly: true
            {{- end }}
            {{- if eq $role "server" }}
            {{- if include "srenautix.roleEnabled" (dict "ctx" $ "role" "gateway") }}
            - name: policies
              mountPath: /etc/srenautix/policies
              readOnly: true
            {{- end }}
            - name: bindings
              mountPath: /etc/srenautix/bindings
              readOnly: true
            {{- range $p := $.Values.packs.userConfigMaps }}
            {{- $u := include "srenautix.userPack" $p | fromYaml }}
            - name: pack-{{ $u.configMap }}
              mountPath: /etc/srenautix/packs/{{ $u.configMap }}/{{ $u.pack }}
              readOnly: true
            {{- end }}
            {{- if $.Values.packs.lockConfigMap }}
            - name: pack-lock
              mountPath: /etc/srenautix/pack-lock
              readOnly: true
            {{- end }}
            {{- if $.Values.packs.oci.sources }}
            - name: pack-cache
              mountPath: /var/cache/srenautix/packs
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- range $s := $secrets }}
        - name: secret-{{ $s.key | lower }}
          {{- if $s.projected }}
          projected:
            sources:
              {{- toYaml $s.projected | nindent 14 }}
          {{- else if $s.configMap }}
          configMap:
            name: {{ $s.configMap }}
          {{- else }}
          secret:
            secretName: {{ $s.secretName }}
          {{- end }}
            # 0440
            defaultMode: 288
            {{- with $s.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- if and (eq $role "reader") $.Values.roles.reader.queryManifestConfigMap }}
        - name: query-manifest
          configMap:
            name: {{ $.Values.roles.reader.queryManifestConfigMap }}
            items:
              - {key: queries.yaml, path: queries.yaml}
        {{- end }}
        {{- if and (eq $role "server") (include "srenautix.roleEnabled" (dict "ctx" $ "role" "gateway")) }}
        - name: policies
          configMap:
            name: {{ include "srenautix.policyConfigMap" $ }}
        {{- end }}
        {{- if eq $role "gateway" }}
        - name: audit-staging
          persistentVolumeClaim:
            claimName: {{ $name }}-audit-staging
        {{- end }}
        {{- if eq $role "server" }}
        - name: bindings
          configMap:
            name: {{ include "srenautix.bindingsConfigMap" $ }}
        {{- range $p := $.Values.packs.userConfigMaps }}
        {{- $u := include "srenautix.userPack" $p | fromYaml }}
        - name: pack-{{ $u.configMap }}
          configMap:
            name: {{ $u.configMap }}
        {{- end }}
        {{- if $.Values.packs.lockConfigMap }}
        - name: pack-lock
          configMap:
            name: {{ $.Values.packs.lockConfigMap }}
            items:
              - {key: pack.lock, path: pack.lock}
        {{- end }}
        {{- if $.Values.packs.oci.sources }}
        # OCI 领域包的拉取目录：server 启动时清空后按 digest 重新拉取
        - name: pack-cache
          emptyDir:
            sizeLimit: {{ $.Values.packs.oci.cacheSize }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
