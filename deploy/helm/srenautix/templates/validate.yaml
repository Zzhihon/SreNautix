{{- /* 渲染前的配置校验：任何一项不满足都直接失败 */}}
{{- $v := .Values }}
{{- $profile := include "srenautix.profile" . | fromYaml }}
{{- $on := dict }}
{{- range $role := list "server" "worker" "mcp" "reader" "gateway" }}
{{- $_ := set $on $role (include "srenautix.roleEnabled" (dict "ctx" $ "role" $role) | eq "true") }}
{{- end }}

{{- if not $on.server }}
{{- fail "server 是必需的角色，不能关闭" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" $v.clusterId) }}
{{- fail (printf "clusterId 只能包含小写字母、数字与连字符：%q" $v.clusterId) }}
{{- end }}
{{- if not $v.datasources.prometheus.url }}
{{- fail "必须设置 datasources.prometheus.url（证据卡查询与 ALERTS 对账）" }}
{{- end }}
{{- if and (ne $v.profile "observe") (not $v.secrets.serviceSigningKey.existingSecret) }}
{{- fail "observe 以外的配置必须设置 secrets.serviceSigningKey.existingSecret（键 private.pem 的 Ed25519 私钥）" }}
{{- end }}

{{- /* 服务 token 与调用方文件：二者由同一组 token 推导，提供已有的 token 时调用方文件也必须由用户提供 */}}
{{- if and $v.serviceTokens.existingSecret (not $v.callers.existingSecret) }}
{{- fail "设置 serviceTokens.existingSecret 时必须同时设置 callers.existingSecret（callers.yaml 中是这些 token 的 sha256）" }}
{{- end }}

{{- /* worker：模型路由与预算由用户给出，code_sha 由发布写入或 values.codeSha */}}
{{- if $on.worker }}
{{- if not (regexMatch "^[0-9a-f]{40}$" (include "srenautix.codeSha" .)) }}
{{- fail "worker 需要镜像对应的 40 位提交 SHA：使用发布的 chart（Chart 注解 srenautix.io/code-sha），或设置 codeSha" }}
{{- end }}
{{- $wc := $v.roles.worker.config | default dict }}
{{- if not (and $wc.llm $wc.llm.routes) }}
{{- fail "worker 需要 roles.worker.config.llm.routes（至少一条模型路由，api_key_file 指向 /etc/srenautix/secrets/llm/<键>）" }}
{{- end }}
{{- if not (and $wc.budget $wc.budget.daily_tokens) }}
{{- fail "worker 需要 roles.worker.config.budget.daily_tokens（每日 token 上限）" }}
{{- end }}
{{- end }}

{{- /* mcp：资源标识、授权服务器与客户端由用户给出 */}}
{{- if $on.mcp }}
{{- $mc := $v.roles.mcp.config | default dict }}
{{- if or (not $mc.public_url) (not $mc.authorization_server) (not $mc.clients) }}
{{- fail "mcp 需要 roles.mcp.config.public_url、authorization_server 与 clients" }}
{{- end }}
{{- end }}
{{- if $v.identity.oidc.enabled }}
{{- if or (not $v.identity.oidc.issuer) (not $v.identity.oidc.clientId) (not $v.identity.oidc.existingSecret) }}
{{- fail "identity.oidc.enabled=true 时必须设置 issuer、clientId 与 existingSecret" }}
{{- end }}
{{- end }}
{{- $sourceIds := list }}
{{- range $s := $v.ingest.sources }}
{{- if not (has $s.kind (list "alertmanager" "grafana" "nightingale" "generic")) }}
{{- fail (printf "ingest.sources 中 %q 的 kind 必须是 alertmanager、grafana、nightingale、generic 之一" $s.id) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9_]{0,61}[a-z0-9])?$" (toString $s.id)) }}
{{- fail (printf "ingest.sources 的 id 只能包含小写字母、数字、连字符与下划线：%q" (toString $s.id)) }}
{{- end }}
{{- $sourceIds = append $sourceIds $s.id }}
{{- end }}
{{- if ne (len $sourceIds) (len ($sourceIds | uniq)) }}
{{- fail "ingest.sources 的 id 不能重复" }}
{{- end }}

{{- /* 数据库 */}}
{{- if not (has $v.database.mode (list "cnpg" "external")) }}
{{- fail (printf "database.mode 必须是 cnpg 或 external，当前为 %q" $v.database.mode) }}
{{- end }}
{{- if eq $v.database.mode "cnpg" }}
{{- if and (lt (int $v.database.cnpg.instances) 2) (not $v.database.cnpg.allowSingleInstance) }}
{{- fail "database.cnpg.instances 至少为 2（设计 §15.2）；单实例需要显式设置 database.cnpg.allowSingleInstance=true" }}
{{- end }}
{{- $cluster := include "srenautix.pg.clusterName" . }}
{{- $reserved := list }}
{{- range $suffix := list "ca" "server" "replication" "app" "superuser" }}
{{- $reserved = append $reserved (printf "%s-%s" $cluster $suffix) }}
{{- end }}
{{- range $role, $name := $v.database.cnpg.passwordSecrets }}
{{- if has $name $reserved }}
{{- fail (printf "database.cnpg.passwordSecrets.%s=%s 与 CNPG 自己管理的 Secret 重名（%s），换一个名称" $role $name (join "、" $reserved)) }}
{{- end }}
{{- end }}
{{- else }}
{{- if not $v.database.external.host }}
{{- fail "database.mode=external 时必须设置 database.external.host" }}
{{- end }}
{{- range $role := splitList " " (include "srenautix.dbRoles" .) }}
{{- if and (index $on $role) (not (index $v.database.external.passwordSecrets $role)) }}
{{- fail (printf "database.mode=external 时必须设置 database.external.passwordSecrets.%s" $role) }}
{{- end }}
{{- end }}
{{- if not (has $v.database.external.sslmode (list "disable" "require" "verify-full")) }}
{{- fail "database.external.sslmode 必须是 disable、require、verify-full 之一" }}
{{- end }}
{{- if and (eq $v.database.external.sslmode "verify-full") (not $v.database.external.caSecret) }}
{{- fail "sslmode=verify-full 时必须设置 database.external.caSecret" }}
{{- end }}
{{- end }}

{{- /* 审计汇 */}}
{{- $sink := include "srenautix.auditSink" . }}
{{- $lockMode := include "srenautix.auditLockMode" . }}
{{- if not (has $sink (list "minio" "s3" "pg")) }}
{{- fail (printf "audit.sink 必须是 minio、s3、pg 之一，当前为 %q" $sink) }}
{{- end }}
{{- if eq $sink "s3" }}
{{- if not $v.audit.s3.endpoint }}
{{- fail "audit.sink=s3 时必须设置 audit.s3.endpoint" }}
{{- end }}
{{- range $role := list "server" "gateway" }}
{{- if and (index $on $role) (not (include "srenautix.audit.credentialsSecret" (dict "ctx" $ "role" $role))) }}
{{- fail (printf "audit.sink=s3 时必须设置 audit.s3.existingSecrets.%s 或 audit.s3.existingSecret" $role) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not (has $lockMode (list "GOVERNANCE" "COMPLIANCE")) }}
{{- fail "audit.objectLock.mode 必须是 GOVERNANCE 或 COMPLIANCE" }}
{{- end }}

{{- /* gateway */}}
{{- if $on.gateway }}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail (printf "启用 gateway 需要 Kubernetes ≥1.30（ValidatingAdmissionPolicy GA），当前为 %s；请使用 observe 配置" .Capabilities.KubeVersion.Version) }}
{{- end }}
{{- if not $v.roles.gateway.actions }}
{{- fail "启用 gateway 时 roles.gateway.actions 不能为空" }}
{{- end }}
{{- if eq $sink "pg" }}
{{- fail "启用 gateway 时审计必须写入对象存储（audit.sink=minio 或 s3），执行链不写入 PG" }}
{{- end }}
{{- $gw := $v.roles.gateway }}
{{- if eq (len (compact (list $gw.policy.content $gw.policy.existingConfigMap))) 0 }}
{{- fail "启用 gateway 时必须提供 roles.gateway.policy.content 或 roles.gateway.policy.existingConfigMap（本集群的 gateway 策略）" }}
{{- end }}
{{- if and $gw.policy.content $gw.policy.existingConfigMap }}
{{- fail "roles.gateway.policy.content 与 existingConfigMap 只能设置一个" }}
{{- end }}
{{- if ne (len (compact (list $gw.approverKeys.content $gw.approverKeys.existingConfigMap $gw.approverKeys.existingSecret))) 1 }}
{{- fail "启用 gateway 时 roles.gateway.approverKeys 的 content、existingConfigMap、existingSecret 必须恰好设置一个（gateway 信任的签名公钥）" }}
{{- end }}
{{- if $gw.policy.content }}
{{- $policy := $gw.policy.content | fromYaml }}
{{- if hasKey $policy "Error" }}
{{- fail (printf "roles.gateway.policy.content 不是合法的 YAML：%s" $policy.Error) }}
{{- end }}
{{- if ne (toString $policy.cluster) $v.clusterId }}
{{- fail (printf "gateway 策略的 cluster（%v）必须等于 clusterId（%s）" $policy.cluster $v.clusterId) }}
{{- end }}
{{- range $a := ($policy.actions | default list) }}
{{- if not (has $a.id $gw.actions) }}
{{- fail (printf "gateway 策略启用了动作 %s，但 roles.gateway.actions 中没有它，准入策略与 RBAC 不会安装，gateway 的自检会失败" $a.id) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not (has $v.roles.gateway.pgAntiAffinity (list "preferred" "required" "none")) }}
{{- fail "roles.gateway.pgAntiAffinity 必须是 preferred、required、none 之一" }}
{{- end }}
{{- end }}

{{- /* 合规配置：设计 §1.3、§16.3、§16.5 的强度要求 */}}
{{- if eq $v.profile "compliance" }}
{{- if eq $sink "pg" }}
{{- fail "合规配置要求审计写入开启对象锁的对象存储（audit.sink=minio 或 s3）" }}
{{- end }}
{{- if or (not $v.audit.objectLock.enabled) (ne $lockMode "COMPLIANCE") (lt (int $v.audit.objectLock.retentionDays) 180) }}
{{- fail "合规配置要求 audit.objectLock.enabled=true、mode=COMPLIANCE、retentionDays≥180" }}
{{- end }}
{{- if or (not $v.global.nodeSelector) (not $v.global.tolerations) }}
{{- fail "合规配置要求专用节点池：设置 global.nodeSelector 与 global.tolerations" }}
{{- end }}
{{- $g := include "srenautix.governance" . | fromYaml }}
{{- if or (not $g.separationOfDuties) (not $g.requirePasskey) $g.allowSelfApproval }}
{{- fail "合规配置不允许关闭三权分立、通行密钥，也不允许提议人审批自己的提议" }}
{{- end }}
{{- if not (include "srenautix.imagePolicyEnabled" .) }}
{{- fail "合规配置要求开启 imagePolicy（policy-controller 镜像签名校验）" }}
{{- end }}
{{- end }}

{{- /* 自身告警不得路由到 SreNautix（设计 §11、§15.5） */}}
{{- $sm := $v.selfMonitoring }}
{{- if $sm.prometheusRule.enabled }}
{{- if not $sm.receiver }}
{{- fail "selfMonitoring.prometheusRule.enabled=true 时必须设置 selfMonitoring.receiver（SreNautix 以外的接收方）" }}
{{- end }}
{{- if not $sm.routeLabels }}
{{- fail "selfMonitoring.routeLabels 不能为空：自身告警需要路由标签把它们送到 selfMonitoring.receiver" }}
{{- end }}
{{- if hasKey $sm.routeLabels "srenautix_self" }}
{{- fail "selfMonitoring.routeLabels 不能覆盖 srenautix_self" }}
{{- end }}
{{- end }}
{{- if and ($sm.prometheusRule.enabled) (eq $sm.receiver $v.alertmanagerConfig.receiverName) }}
{{- fail (printf "selfMonitoring.receiver 不能是 SreNautix 自己的接收方 %q" $v.alertmanagerConfig.receiverName) }}
{{- end }}
{{- if $v.alertmanagerConfig.enabled }}
{{- if or (not $sm.receiver) (eq $sm.receiver $v.alertmanagerConfig.receiverName) }}
{{- fail "alertmanagerConfig.enabled=true 时 selfMonitoring.receiver 必须是 SreNautix 以外的接收方" }}
{{- end }}
{{- if not $v.alertmanagerConfig.selfReceiverSpec }}
{{- fail "alertmanagerConfig.enabled=true 时必须设置 alertmanagerConfig.selfReceiverSpec" }}
{{- end }}
{{- $server := include "srenautix.roleName" (dict "ctx" $ "role" "server") }}
{{- range $hook := ($v.alertmanagerConfig.selfReceiverSpec.webhookConfigs | default list) }}
{{- if contains $server (toString $hook.url) }}
{{- fail (printf "自身告警的接收方 webhook %q 指向 SreNautix server，自身告警必须发往其他接收方" (toString $hook.url)) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and $v.networkPolicy.cilium.enabled (not $v.networkPolicy.cilium.modelFQDNs) $on.worker }}
{{- fail "networkPolicy.cilium.enabled=true 时必须列出 networkPolicy.cilium.modelFQDNs" }}
{{- end }}
{{- if and (eq $sink "s3") $v.networkPolicy.enabled (not $v.networkPolicy.auditEgressTo) }}
{{- fail "audit.sink=s3 且启用 NetworkPolicy 时必须设置 networkPolicy.auditEgressTo" }}
{{- end }}
