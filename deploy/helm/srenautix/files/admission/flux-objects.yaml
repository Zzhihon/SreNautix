# 由 internal/spoke/gateway/admission 生成（make gateway-generate），不要手工修改。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    srenautix.io/description: flux_suspend、flux_resume、flux_reconcile：Kustomization 与 HelmRelease 只改 spec.suspend 或 reconcile.fluxcd.io/requestedAt
  labels:
    app.kubernetes.io/component: gateway-admission
    app.kubernetes.io/name: srenautix
  name: '{{ include "srenautix.fullname" . }}-gateway-flux-objects'
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.userInfo.username == '{{ include "srenautix.gateway.username" . }}'
      name: gateway-only
  matchConstraints:
    resourceRules:
      - apiGroups:
          - kustomize.toolkit.fluxcd.io
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - kustomizations
      - apiGroups:
          - helm.toolkit.fluxcd.io
        apiVersions:
          - v2
        operations:
          - UPDATE
        resources:
          - helmreleases
      - apiGroups:
          - srenautix.io
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - actionexecutions
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
    - expression: '!variables.isRecord || object.metadata.?labels.orValue({})[?''srenautix.io/admission-probe''].orValue('''') != ''flux-objects'''
      message: admission self-check probe denied by flux-objects
      reason: Forbidden
    - expression: variables.isRecord || params.?data.?frozen.orValue('true') == 'false'
      message: srenautix-freeze is frozen or missing, gateway writes are proposal-only
      reason: Forbidden
    - expression: |-
        variables.isRecord || (object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        variables.annOld.all(k, k in ["srenautix.io/execution-id", "reconcile.fluxcd.io/requestedAt"] || (k in variables.annNew && variables.annNew[k] == variables.annOld[k])) &&
        variables.annNew.all(k, k in ["srenautix.io/execution-id", "reconcile.fluxcd.io/requestedAt"] || k in variables.annOld) &&
        (!('srenautix.io/execution-id' in variables.annNew) || variables.annNew['srenautix.io/execution-id'].matches('^[0-9a-f]{32}$')))
      message: gateway may only add its execution annotations; labels, owners, finalizers and other annotations must not change
      reason: Forbidden
    - expression: variables.isRecord || (variables.specSame)
      message: gateway may only change spec.suspend of a Flux Kustomization or HelmRelease
      reason: Forbidden
    - expression: variables.isRecord || (object.?status == oldObject.?status)
      message: gateway may not change the status of a Flux object
      reason: Forbidden
  variables:
    - expression: request.resource.group == 'srenautix.io' && request.resource.resource == 'actionexecutions'
      name: isRecord
    - expression: oldObject.metadata.?annotations.orValue({})
      name: annOld
    - expression: object.metadata.?annotations.orValue({})
      name: annNew
    - expression: |-
        request.resource.resource == 'kustomizations' ?
        (object.spec.?commonMetadata == oldObject.spec.?commonMetadata &&
        object.spec.?components == oldObject.spec.?components &&
        object.spec.?decryption == oldObject.spec.?decryption &&
        object.spec.?deletionPolicy == oldObject.spec.?deletionPolicy &&
        object.spec.?dependsOn == oldObject.spec.?dependsOn &&
        object.spec.?force == oldObject.spec.?force &&
        object.spec.?healthCheckExprs == oldObject.spec.?healthCheckExprs &&
        object.spec.?healthChecks == oldObject.spec.?healthChecks &&
        object.spec.?ignoreMissingComponents == oldObject.spec.?ignoreMissingComponents &&
        object.spec.?images == oldObject.spec.?images &&
        object.spec.?interval == oldObject.spec.?interval &&
        object.spec.?kubeConfig == oldObject.spec.?kubeConfig &&
        object.spec.?namePrefix == oldObject.spec.?namePrefix &&
        object.spec.?nameSuffix == oldObject.spec.?nameSuffix &&
        object.spec.?patches == oldObject.spec.?patches &&
        object.spec.?path == oldObject.spec.?path &&
        object.spec.?postBuild == oldObject.spec.?postBuild &&
        object.spec.?prune == oldObject.spec.?prune &&
        object.spec.?retryInterval == oldObject.spec.?retryInterval &&
        object.spec.?serviceAccountName == oldObject.spec.?serviceAccountName &&
        object.spec.?sourceRef == oldObject.spec.?sourceRef &&
        object.spec.?targetNamespace == oldObject.spec.?targetNamespace &&
        object.spec.?timeout == oldObject.spec.?timeout &&
        object.spec.?wait == oldObject.spec.?wait) :
        (object.spec.?chart == oldObject.spec.?chart &&
        object.spec.?chartRef == oldObject.spec.?chartRef &&
        object.spec.?commonMetadata == oldObject.spec.?commonMetadata &&
        object.spec.?dependsOn == oldObject.spec.?dependsOn &&
        object.spec.?driftDetection == oldObject.spec.?driftDetection &&
        object.spec.?install == oldObject.spec.?install &&
        object.spec.?interval == oldObject.spec.?interval &&
        object.spec.?kubeConfig == oldObject.spec.?kubeConfig &&
        object.spec.?maxHistory == oldObject.spec.?maxHistory &&
        object.spec.?persistentClient == oldObject.spec.?persistentClient &&
        object.spec.?postRenderers == oldObject.spec.?postRenderers &&
        object.spec.?releaseName == oldObject.spec.?releaseName &&
        object.spec.?rollback == oldObject.spec.?rollback &&
        object.spec.?serviceAccountName == oldObject.spec.?serviceAccountName &&
        object.spec.?storageNamespace == oldObject.spec.?storageNamespace &&
        object.spec.?targetNamespace == oldObject.spec.?targetNamespace &&
        object.spec.?test == oldObject.spec.?test &&
        object.spec.?timeout == oldObject.spec.?timeout &&
        object.spec.?uninstall == oldObject.spec.?uninstall &&
        object.spec.?upgrade == oldObject.spec.?upgrade &&
        object.spec.?values == oldObject.spec.?values &&
        object.spec.?valuesFrom == oldObject.spec.?valuesFrom)
      name: specSame
