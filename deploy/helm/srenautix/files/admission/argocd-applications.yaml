# 由 internal/spoke/gateway/admission 生成（make gateway-generate），不要手工修改。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    srenautix.io/description: argocd_app_sync、argocd_app_terminate_operation、argocd_autosync_suspend、argocd_autosync_resume：同步固定到 40 位提交 SHA，或终止运行中的操作，或只切换 automated.enabled
  labels:
    app.kubernetes.io/component: gateway-admission
    app.kubernetes.io/name: srenautix
  name: '{{ include "srenautix.fullname" . }}-gateway-argocd-applications'
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.userInfo.username == '{{ include "srenautix.gateway.username" . }}'
      name: gateway-only
  matchConstraints:
    resourceRules:
      - apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        operations:
          - UPDATE
        resources:
          - applications
      - apiGroups:
          - srenautix.io
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - actionexecutions
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
    - expression: '!variables.isRecord || object.metadata.?labels.orValue({})[?''srenautix.io/admission-probe''].orValue('''') != ''argocd-applications'''
      message: admission self-check probe denied by argocd-applications
    - expression: variables.isRecord || params.?data.?frozen.orValue('true') == 'false'
      message: srenautix-freeze is frozen or missing, gateway writes are proposal-only
    - expression: |-
        variables.isRecord || (object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        variables.annOld.all(k, k in ["srenautix.io/execution-id"] || (k in variables.annNew && variables.annNew[k] == variables.annOld[k])) &&
        variables.annNew.all(k, k in ["srenautix.io/execution-id"] || k in variables.annOld) &&
        (!('srenautix.io/execution-id' in variables.annNew) || variables.annNew['srenautix.io/execution-id'].matches('^[0-9a-f]{32}$')))
      message: gateway may only add its execution annotations; labels, owners, finalizers and other annotations must not change
    - expression: variables.isRecord || ((variables.specUnchanged && (variables.startsPinnedSync || variables.terminatesRunningOperation)) || variables.togglesAutosync)
      message: gateway may only start a sync pinned to a commit SHA without prune, force or dry run, terminate a running operation, or toggle spec.syncPolicy.automated.enabled
  variables:
    - expression: request.resource.group == 'srenautix.io' && request.resource.resource == 'actionexecutions'
      name: isRecord
    - expression: oldObject.metadata.?annotations.orValue({})
      name: annOld
    - expression: object.metadata.?annotations.orValue({})
      name: annNew
    - expression: object.spec == oldObject.spec
      name: specUnchanged
    - expression: |-
        !has(oldObject.operation) && has(object.operation) && has(object.operation.sync) &&
        object.operation.sync.?revision.orValue('').matches('^[0-9a-f]{40}$') &&
        !has(object.operation.sync.revisions) &&
        object.operation.sync.?prune.orValue(false) == false &&
        object.operation.sync.?dryRun.orValue(false) == false &&
        object.operation.sync.?syncStrategy.?apply.?force.orValue(false) == false &&
        object.operation.sync.?syncStrategy.?hook.?force.orValue(false) == false &&
        !has(object.operation.sync.manifests) && !has(object.operation.sync.source) &&
        !has(object.operation.sync.sources) && !has(object.operation.sync.syncOptions) &&
        !has(object.operation.sync.resources) &&
        object.?status == oldObject.?status
      name: startsPinnedSync
    - expression: |-
        has(oldObject.operation) && object.?operation == oldObject.?operation &&
        oldObject.?status.?operationState.?phase == optional.of('Running') &&
        object.?status.?operationState.?phase == optional.of('Terminating') &&
        object.status.?conditions == oldObject.status.?conditions &&
        object.status.?controllerNamespace == oldObject.status.?controllerNamespace &&
        object.status.?health == oldObject.status.?health &&
        object.status.?history == oldObject.status.?history &&
        object.status.?observedAt == oldObject.status.?observedAt &&
        object.status.?reconciledAt == oldObject.status.?reconciledAt &&
        object.status.?resourceHealthSource == oldObject.status.?resourceHealthSource &&
        object.status.?resources == oldObject.status.?resources &&
        object.status.?sourceHydrator == oldObject.status.?sourceHydrator &&
        object.status.?sourceType == oldObject.status.?sourceType &&
        object.status.?sourceTypes == oldObject.status.?sourceTypes &&
        object.status.?summary == oldObject.status.?summary &&
        object.status.?sync == oldObject.status.?sync &&
        object.status.operationState.?finishedAt == oldObject.status.operationState.?finishedAt &&
        object.status.operationState.?message == oldObject.status.operationState.?message &&
        object.status.operationState.?operation == oldObject.status.operationState.?operation &&
        object.status.operationState.?retryCount == oldObject.status.operationState.?retryCount &&
        object.status.operationState.?startedAt == oldObject.status.operationState.?startedAt &&
        object.status.operationState.?syncResult == oldObject.status.operationState.?syncResult
      name: terminatesRunningOperation
    - expression: |-
        object.spec.?source == oldObject.spec.?source &&
        object.spec.?sources == oldObject.spec.?sources &&
        object.spec.?destination == oldObject.spec.?destination &&
        object.spec.?project == oldObject.spec.?project &&
        object.spec.?ignoreDifferences == oldObject.spec.?ignoreDifferences &&
        object.spec.?info == oldObject.spec.?info &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit &&
        object.spec.?sourceHydrator == oldObject.spec.?sourceHydrator &&
        object.spec.?syncPolicy.?syncOptions == oldObject.spec.?syncPolicy.?syncOptions &&
        object.spec.?syncPolicy.?retry == oldObject.spec.?syncPolicy.?retry &&
        object.spec.?syncPolicy.?managedNamespaceMetadata == oldObject.spec.?syncPolicy.?managedNamespaceMetadata &&
        object.spec.?syncPolicy.?automated.?prune == oldObject.spec.?syncPolicy.?automated.?prune &&
        object.spec.?syncPolicy.?automated.?selfHeal == oldObject.spec.?syncPolicy.?automated.?selfHeal &&
        object.spec.?syncPolicy.?automated.?allowEmpty == oldObject.spec.?syncPolicy.?automated.?allowEmpty &&
        has(object.spec.syncPolicy) && has(object.spec.syncPolicy.automated) && has(object.spec.syncPolicy.automated.enabled) &&
        object.?operation == oldObject.?operation && object.?status == oldObject.?status
      name: togglesAutosync
