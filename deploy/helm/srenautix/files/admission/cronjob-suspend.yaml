# 由 internal/spoke/gateway/admission 生成（make gateway-generate），不要手工修改。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    srenautix.io/description: cronjob_suspend、cronjob_resume：CronJob 只改 spec.suspend
  labels:
    app.kubernetes.io/component: gateway-admission
    app.kubernetes.io/name: srenautix
  name: '{{ include "srenautix.fullname" . }}-gateway-cronjob-suspend'
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.userInfo.username == '{{ include "srenautix.gateway.username" . }}'
      name: gateway-only
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - cronjobs
      - apiGroups:
          - srenautix.io
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - actionexecutions
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
    - expression: '!variables.isRecord || object.metadata.?labels.orValue({})[?''srenautix.io/admission-probe''].orValue('''') != ''cronjob-suspend'''
      message: admission self-check probe denied by cronjob-suspend
      reason: Forbidden
    - expression: variables.isRecord || params.?data.?frozen.orValue('true') == 'false'
      message: srenautix-freeze is frozen or missing, gateway writes are proposal-only
      reason: Forbidden
    - expression: |-
        variables.isRecord || (object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        variables.annOld.all(k, k in ["srenautix.io/execution-id"] || (k in variables.annNew && variables.annNew[k] == variables.annOld[k])) &&
        variables.annNew.all(k, k in ["srenautix.io/execution-id"] || k in variables.annOld) &&
        (!('srenautix.io/execution-id' in variables.annNew) || variables.annNew['srenautix.io/execution-id'].matches('^[0-9a-f]{32}$')))
      message: gateway may only add its execution annotations; labels, owners, finalizers and other annotations must not change
      reason: Forbidden
    - expression: |-
        variables.isRecord || (object.spec.?schedule == oldObject.spec.?schedule &&
        object.spec.?timeZone == oldObject.spec.?timeZone &&
        object.spec.?startingDeadlineSeconds == oldObject.spec.?startingDeadlineSeconds &&
        object.spec.?concurrencyPolicy == oldObject.spec.?concurrencyPolicy &&
        object.spec.?jobTemplate == oldObject.spec.?jobTemplate &&
        object.spec.?successfulJobsHistoryLimit == oldObject.spec.?successfulJobsHistoryLimit &&
        object.spec.?failedJobsHistoryLimit == oldObject.spec.?failedJobsHistoryLimit)
      message: gateway may only change spec.suspend of a CronJob
      reason: Forbidden
  variables:
    - expression: request.resource.group == 'srenautix.io' && request.resource.resource == 'actionexecutions'
      name: isRecord
    - expression: oldObject.metadata.?annotations.orValue({})
      name: annOld
    - expression: object.metadata.?annotations.orValue({})
      name: annNew
