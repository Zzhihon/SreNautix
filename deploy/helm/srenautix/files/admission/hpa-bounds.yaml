# 由 internal/spoke/gateway/admission 生成（make gateway-generate），不要手工修改。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    srenautix.io/description: hpa_bounds_set：HorizontalPodAutoscaler 只改 spec.minReplicas 与 spec.maxReplicas，且下限不大于上限
  labels:
    app.kubernetes.io/component: gateway-admission
    app.kubernetes.io/name: srenautix
  name: '{{ include "srenautix.fullname" . }}-gateway-hpa-bounds'
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.userInfo.username == '{{ include "srenautix.gateway.username" . }}'
      name: gateway-only
  matchConstraints:
    resourceRules:
      - apiGroups:
          - autoscaling
        apiVersions:
          - v2
        operations:
          - UPDATE
        resources:
          - horizontalpodautoscalers
      - apiGroups:
          - srenautix.io
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - actionexecutions
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
    - expression: '!variables.isRecord || object.metadata.?labels.orValue({})[?''srenautix.io/admission-probe''].orValue('''') != ''hpa-bounds'''
      message: admission self-check probe denied by hpa-bounds
      reason: Forbidden
    - expression: variables.isRecord || params.?data.?frozen.orValue('true') == 'false'
      message: srenautix-freeze is frozen or missing, gateway writes are proposal-only
      reason: Forbidden
    - expression: |-
        variables.isRecord || (object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        variables.annOld.all(k, k in ["srenautix.io/execution-id"] || (k in variables.annNew && variables.annNew[k] == variables.annOld[k])) &&
        variables.annNew.all(k, k in ["srenautix.io/execution-id"] || k in variables.annOld) &&
        (!('srenautix.io/execution-id' in variables.annNew) || variables.annNew['srenautix.io/execution-id'].matches('^[0-9a-f]{32}$')))
      message: gateway may only add its execution annotations; labels, owners, finalizers and other annotations must not change
      reason: Forbidden
    - expression: |-
        variables.isRecord || (object.spec.?scaleTargetRef == oldObject.spec.?scaleTargetRef &&
        object.spec.?metrics == oldObject.spec.?metrics &&
        object.spec.?behavior == oldObject.spec.?behavior &&
        object.spec.?minReplicas.orValue(1) <= object.spec.maxReplicas)
      message: gateway may only change spec.minReplicas and spec.maxReplicas of a HorizontalPodAutoscaler
      reason: Forbidden
  variables:
    - expression: request.resource.group == 'srenautix.io' && request.resource.resource == 'actionexecutions'
      name: isRecord
    - expression: oldObject.metadata.?annotations.orValue({})
      name: annOld
    - expression: object.metadata.?annotations.orValue({})
      name: annNew
