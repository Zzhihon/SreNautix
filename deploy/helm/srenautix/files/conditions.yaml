# 状态条件指标的方向：每个角色正常时指标的取值（healthy），取值不同即为异常；types 按类型覆盖，ignore 表示不告警。
# 自身告警 SreNautixConditionActive 与看板的"当前异常的状态条件"都由这张表生成（templates/_conditions.tpl）。
#   server、worker、mcp：srenautix_condition 为 1 表示问题正在发生（contract/schemas/condition.schema.json 的 status）。
#     Frozen：gateway 处于冻结（只提议），是 standard 与 compliance 的默认状态，不告警。
#   gateway：srenautix_condition 为 1 表示该项正常（internal/spoke/gateway/engine 的 setCondition）；
#     ApiserverThrottled 为 1 表示正在被限流；Freeze 为 1 表示冻结，与 server 的 Frozen 相同，不告警。
#   reader：srenautix_reader_condition（没有 role 标签）为 1 表示正常（internal/spoke/reader 的 setCondition）。
#     QueryManifest：没有挂载证据查询清单（roles.reader.queryManifestConfigMap 为空）时为 0，此时不告警。
# 新增的条件类型按所在角色的 healthy 处理。
- metric: srenautix_condition
  roleLabel: true
  roles:
    server: {healthy: 0, types: {Frozen: ignore}}
    worker: {healthy: 0, types: {}}
    mcp: {healthy: 0, types: {}}
    gateway: {healthy: 1, types: {ApiserverThrottled: 0, Freeze: ignore}}
- metric: srenautix_reader_condition
  roleLabel: false
  roles:
    reader: {healthy: 1, types: {}}
