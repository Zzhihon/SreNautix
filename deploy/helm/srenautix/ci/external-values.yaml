# 外部 PostgreSQL、外部 S3 审计汇（每个角色一组凭证）、Cilium FQDN 出站策略，
# 以及 GitOps 部署的写法：凭证与策略全部来自已存在的 Secret 与 ConfigMap，渲染结果不依赖 lookup
profile: standard

serviceTokens:
  existingSecret: srenautix-service-tokens
callers:
  existingSecret: srenautix-callers
ingest:
  existingSecret: srenautix-ingest-tokens
secrets:
  auditSigningKey: {existingSecret: srenautix-audit-key}
  gatewayAuditSigningKey: {existingSecret: srenautix-gateway-audit-key}

roles:
  gateway:
    policy:
      content: ""
      existingConfigMap: srenautix-gateway-policy
    approverKeys:
      content: ""
      existingSecret: srenautix-approver-keys

database:
  mode: external
  external:
    host: pg.db.example.internal
    caSecret: srenautix-pg-ca
    passwordSecrets:
      server: srenautix-pg-server
      worker: srenautix-pg-worker

audit:
  sink: s3
  s3:
    endpoint: https://s3.example.com
    region: cn-north-1
    forcePathStyle: false
    existingSecrets:
      server: srenautix-audit-s3-governance
      gateway: srenautix-audit-s3-execution

networkPolicy:
  apiServerCIDRs: [10.0.0.1/32]
  datasourcesEgressTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  auditEgressTo:
    - ipBlock:
        cidr: 203.0.113.10/32
  cilium:
    enabled: true
    modelFQDNs: [api.example-llm.com]

global:
  imageRegistry: registry.example.internal
