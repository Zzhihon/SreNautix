  disposition: act
  forbid_evidence_consistent: false
scenario:
  summary: 人工提交发布 r2，Argo CD 同步后迁移 Job shop-migrate-r2 失败；api 与 checkout 的新 Pod 停在 wait-for-migrations，旧 Pod 继续服务
  expected_alerts: [ShopMigrationFailed, ShopRolloutIncomplete]
