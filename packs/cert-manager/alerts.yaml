# cert-manager 官方 chart 不带告警规则；以下条目对应 cert-manager 文档与社区 mixin（imusmanmalik/cert-manager-mixin）中常用的告警名。
entries:
  - {
      id: cert-manager-absent,
      primary_card: upstream-conditions/cert-manager-absent/condition,
      alertname: CertManagerAbsent,
      role: meta,
      entity: { kind: cluster, name_labels: [alertname] },
      component_type: cert-manager.controller,
      chains: [certificate, upstream-conditions/cert-manager-absent],
      mixin: other,
    }
  - {
      id: cert-manager-cert-expiry-soon,
      primary_card: certificate/expiry,
      alertname: CertManagerCertExpirySoon,
      role: cause,
      entity: { kind: Certificate, name_labels: [name] },
      component_type: cert-manager.certificate,
      chains: [certificate],
      mixin: other,
    }
  - {
      id: cert-manager-cert-not-ready,
      primary_card: certificate/expiry,
      alertname: CertManagerCertNotReady,
      role: cause,
      entity: { kind: Certificate, name_labels: [name] },
      component_type: cert-manager.certificate,
      chains: [certificate],
      mixin: other,
    }
  - {
      id: cert-manager-hitting-rate-limits,
      primary_card: upstream-conditions/cert-manager-hitting-rate-limits/condition,
      alertname: CertManagerHittingRateLimits,
      role: cause,
      entity: { kind: cluster, name_labels: [host] },
      component_type: cert-manager.controller,
      chains: [certificate, upstream-conditions/cert-manager-hitting-rate-limits],
      mixin: other,
    }
