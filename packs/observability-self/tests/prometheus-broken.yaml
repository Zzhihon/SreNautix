# Prometheus 栈，第 30 分钟起各处出问题。信号选中 Prometheus 的备选。
api_version: srenautix.io/pack-test/v1
interval: 1m
input_series:
  - { series: 'up{job="node",instance="a"}', values: '1x60' }
  - { series: 'up{job="app",instance="b"}', values: '1x30 0x30' }
  - { series: 'kube_state_metrics_list_total{result="success"}', values: '0+95x60' }
  - { series: 'kube_state_metrics_list_total{result="error"}', values: '0+5x60' }
  - { series: 'kube_state_metrics_watch_total{result="success"}', values: '0+100x60' }
  - { series: 'prometheus_tsdb_head_samples_appended_total{instance="p"}', values: '0+6000x30 180000x30' }
  - { series: 'prometheus_tsdb_compactions_failed_total{instance="p"}', values: '0x30 1x30' }
  - { series: 'prometheus_tsdb_reloads_failures_total{instance="p"}', values: '0x60' }
  - { series: 'prometheus_remote_storage_samples_failed_total{instance="p",remote_name="r"}', values: '0+60x60' }
  - { series: 'prometheus_config_last_reload_successful{job="prometheus",instance="p"}', values: '1x30 0x30' }
  - { series: 'prometheus_rule_group_last_duration_seconds{rule_group="g1"}', values: '0.1x60' }
  - { series: 'prometheus_rule_evaluation_failures_total{rule_group="g1"}', values: '0+1x60' }
  - { series: 'prometheus_rule_group_iterations_missed_total{rule_group="g1"}', values: '0x60' }
  - { series: 'prometheus_notifications_sent_total{instance="p"}', values: '0+10x60' }
  - {
      series: 'prometheus_notifications_errors_total{instance="p",alertmanager="http://am:9093/api/v2/alerts"}',
      values: '0+2x60',
    }
  - { series: 'alertmanager_notifications_total{integration="email"}', values: '0+5x60' }
  - { series: 'alertmanager_notifications_failed_total{integration="email"}', values: '0+1x60' }
  - { series: 'alertmanager_config_last_reload_successful{instance="am"}', values: '1x60' }
tests:
  - {
      name: 有失败的目标,
      eval_time: 40m,
      card: scrape/targets-down,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
  - {
      name: ksm 有错误,
      eval_time: 40m,
      card: scrape/kube-state-metrics,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
  - {
      name: 写入停止,
      eval_time: 40m,
      card: prometheus-tsdb/ingestion,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
  - {
      name: 存储与重载错误,
      eval_time: 40m,
      card: prometheus-tsdb/storage,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
  - {
      name: 规则求值失败,
      eval_time: 40m,
      card: rule-evaluation/failures,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
  - {
      name: 发往 Alertmanager 出错,
      eval_time: 40m,
      card: alert-delivery/rules-to-alertmanager,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
  - {
      name: 通知发送失败,
      eval_time: 40m,
      card: alert-delivery/notifications,
      entity: { kind: cluster, name: c1 },
      expect: { verdict: abnormal },
    }
