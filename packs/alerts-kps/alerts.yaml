      component_type: kubernetes.etcd,
      scope: hub,
      chains: [kubernetes-core/etcd],
      mixin: etcd,
    }
  - {
      id: etcd-excessive-database-growth,
      alertname: etcdExcessiveDatabaseGrowth,
      role: forecast,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: kubernetes.etcd,
      scope: hub,
      chains: [kubernetes-core/etcd],
      mixin: etcd,
    }
  - {
      id: etcd-database-high-fragmentation-ratio,
      alertname: etcdDatabaseHighFragmentationRatio,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: kubernetes.etcd,
      scope: hub,
      chains: [kubernetes-core/etcd],
      mixin: etcd,
