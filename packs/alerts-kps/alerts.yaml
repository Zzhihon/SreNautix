      component_type: kubernetes.etcd,
      scope: hub,
      chains: [kubernetes-core/etcd, node/node-filesystem],
      mixin: etcd,
    }
  - {
      id: etcd-high-commit-durations,
      alertname: etcdHighCommitDurations,
      role: cause,
