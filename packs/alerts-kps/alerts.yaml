# 每个条目：告警名、角色、实体映射、作用范围、证据链、来源 mixin。
# 同名告警只有在角色不同时才按 match_labels 拆成变体（例如 PVC 写满的 critical 变体描述当前状态，属于 cause；
# warning 变体用 predict_linear 预测，属于 forecast）。Watchdog 与 severity=none 的告警在接入时丢弃，这里只为覆盖率登记。
entries:
  # ---------- Alertmanager ----------
  - {
      id: alertmanager-failed-reload,
      alertname: AlertmanagerFailedReload,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-members-inconsistent,
      alertname: AlertmanagerMembersInconsistent,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-failed-to-send-alerts,
      alertname: AlertmanagerFailedToSendAlerts,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-cluster-failed-to-send-alerts,
      alertname: AlertmanagerClusterFailedToSendAlerts,
      role: symptom,
      entity: { kind: Service, name_labels: [service] },
      scope: service,
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-config-inconsistent,
      alertname: AlertmanagerConfigInconsistent,
      role: change,
      entity: { kind: Service, name_labels: [service] },
      scope: service,
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-cluster-down,
      alertname: AlertmanagerClusterDown,
      role: cause,
      entity: { kind: Service, name_labels: [service] },
      scope: service,
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-cluster-crashlooping,
      alertname: AlertmanagerClusterCrashlooping,
      role: cause,
      entity: { kind: Service, name_labels: [service] },
      scope: service,
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: alertmanager-cluster-failed-peers,
      alertname: AlertmanagerClusterFailedPeers,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      chains: [observability-self/alert-delivery],
      mixin: alertmanager,
    }
  - {
      id: config-reloader-sidecar-errors,
      alertname: ConfigReloaderSidecarErrors,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      chains: [observability-self/scrape],
      mixin: other,
    }

