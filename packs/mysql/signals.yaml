# 指标来自 prometheus/mysqld_exporter（mysqld-mixin/alerts 使用同一组指标）。
signals:
  - id: up
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod) (mysql_up{$selector})
  - id: connections_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: max by (namespace, pod) (mysql_global_status_threads_connected{$selector} / mysql_global_variables_max_connections{$selector})
  - id: replication_threads
    kind: metrics
    alternatives:
      # 只有副本有这些指标；IO 与 SQL 线程都在运行时为 1
      - expr: min by (namespace, pod) (mysql_slave_status_slave_io_running{$selector} * mysql_slave_status_slave_sql_running{$selector})
  - id: replication_lag_seconds
    kind: metrics
    unit: seconds
    alternatives:
      - expr: max by (namespace, pod) (mysql_slave_status_seconds_behind_master{$selector} - mysql_slave_status_sql_delay{$selector})
  - id: slow_queries
    kind: metrics
    unit: per_second
    alternatives:
      - expr: sum by (namespace, pod) (rate(mysql_global_status_slow_queries{$selector}[$rate_window]))
  - id: galera_ready
    kind: metrics
    alternatives:
      - expr: min by (namespace, pod) (min_over_time(mysql_global_status_wsrep_ready{$selector}[$window]))
