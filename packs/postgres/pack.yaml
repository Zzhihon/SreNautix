api_version: srenautix.io/pack/v1
name: postgres
version: 1.2.0
description: PostgreSQL（CloudNativePG 与 postgres_exporter）：主库切换与复制、实例 OOM、连接、语句耗时与长事务、锁等待与回滚、WAL 归档、备份；确定性结论规则（OOM 引发主库切换、语句变慢占满连接）；主动优化的数据库领域（语句份额、临时文件、轮询、顺序扫描、work_mem 与业务 issue 模板）
maturity: stable
min_srenautix_version: 0.1.0
depends_on:
  - pvc
  - observability-self
  # 实例 OOM 的卡读 workload 包的 container_oom_events 信号
  - workload
requires:
  - metrics.query
  - metrics.query_range
optional:
  - logs.match
  # 数据库领域的检查项读 dbstats（postgres-stats 集成）
  - dbstats.statements_top
  - dbstats.tables_top
