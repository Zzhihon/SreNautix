# 来源：CloudNativePG cluster chart（cloudnative-pg/charts，cluster-v0.9.0，告警带 namespace 与 cnpg_cluster 标签）
# 与 postgres_exporter 的 postgres_mixin（v0.20.1）。
entries:
  # ---------- CloudNativePG ----------
  - {
      id: cnpg-cluster-offline,
      primary_card: availability/instances-up,
      alertname: CNPGClusterOffline,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, saturation],
      mixin: other,
    }
  - {
      id: cnpg-instance-metrics-absent,
      primary_card: upstream-conditions/cnpg-instance-metrics-absent/condition,
      alertname: CNPGInstanceMetricsAbsent,
      role: meta,
      entity: { kind: Pod, name_labels: [pod] },
      chains: [availability, upstream-conditions/cnpg-instance-metrics-absent],
      mixin: other,
    }
  - {
      id: cnpg-cluster-ha-critical,
      primary_card: availability/instances-up,
      alertname: CNPGClusterHACritical,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability],
      mixin: other,
    }
  - {
      id: cnpg-cluster-ha-warning,
      primary_card: availability/instances-up,
      alertname: CNPGClusterHAWarning,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability],
      mixin: other,
    }
  - {
      id: cnpg-cluster-high-connections-critical,
      primary_card: saturation/connections,
      alertname: CNPGClusterHighConnectionsCritical,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [saturation],
      mixin: other,
    }
  - {
      id: cnpg-cluster-high-connections-warning,
      primary_card: saturation/connections,
      alertname: CNPGClusterHighConnectionsWarning,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [saturation],
      mixin: other,
    }
  - {
      id: cnpg-cluster-high-replication-lag,
      primary_card: availability/replication-lag,
      alertname: CNPGClusterHighReplicationLag,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, wal],
      mixin: other,
    }
  - {
      id: cnpg-cluster-physical-replication-lag-critical,
      primary_card: availability/replication-lag,
      alertname: CNPGClusterPhysicalReplicationLagCritical,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, wal],
      mixin: other,
    }
  - {
      id: cnpg-cluster-physical-replication-lag-warning,
      primary_card: availability/replication-lag,
      alertname: CNPGClusterPhysicalReplicationLagWarning,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, wal],
      mixin: other,
    }
  - {
      id: cnpg-cluster-low-disk-space-critical,
      primary_card: upstream-conditions/cnpg-cluster-low-disk-space-critical/condition,
      alertname: CNPGClusterLowDiskSpaceCritical,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [pvc/pvc-capacity, wal, upstream-conditions/cnpg-cluster-low-disk-space-critical],
      mixin: other,
    }
  - {
      id: cnpg-cluster-low-disk-space-warning,
      primary_card: upstream-conditions/cnpg-cluster-low-disk-space-warning/condition,
      alertname: CNPGClusterLowDiskSpaceWarning,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [pvc/pvc-capacity, wal, upstream-conditions/cnpg-cluster-low-disk-space-warning],
      mixin: other,
    }
  - {
      id: cnpg-cluster-instances-on-same-node,
      primary_card: upstream-conditions/cnpg-cluster-instances-on-same-node/condition,
      alertname: CNPGClusterInstancesOnSameNode,
      role: symptom,
      role_confidence: 0.6,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-cluster-instances-on-same-node],
      mixin: other,
    }
  - {
      id: cnpg-cluster-zone-spread-warning,
      primary_card: upstream-conditions/cnpg-cluster-zone-spread-warning/condition,
      alertname: CNPGClusterZoneSpreadWarning,
      role: symptom,
      role_confidence: 0.6,
      entity: { kind: Cluster, name_labels: [cnpg_cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-cluster-zone-spread-warning],
      mixin: other,
    }
  - {
      id: cnpg-logical-replication-errors,
      primary_card: upstream-conditions/cnpg-logical-replication-errors/condition,
      alertname: CNPGClusterLogicalReplicationErrors,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster, cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-logical-replication-errors],
      mixin: other,
    }
  - {
      id: cnpg-logical-replication-errors-critical,
      primary_card: upstream-conditions/cnpg-logical-replication-errors-critical/condition,
      alertname: CNPGClusterLogicalReplicationErrorsCritical,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster, cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-logical-replication-errors-critical],
      mixin: other,
    }
  - {
      id: cnpg-logical-replication-lagging,
      primary_card: upstream-conditions/cnpg-logical-replication-lagging/condition,
      alertname: CNPGClusterLogicalReplicationLagging,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster, cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-logical-replication-lagging],
      mixin: other,
    }
  - {
      id: cnpg-logical-replication-lagging-critical,
      primary_card: upstream-conditions/cnpg-logical-replication-lagging-critical/condition,
      alertname: CNPGClusterLogicalReplicationLaggingCritical,
      role: symptom,
      entity: { kind: Cluster, name_labels: [cnpg_cluster, cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-logical-replication-lagging-critical],
      mixin: other,
    }
  - {
      id: cnpg-logical-replication-stopped,
      primary_card: upstream-conditions/cnpg-logical-replication-stopped/condition,
      alertname: CNPGClusterLogicalReplicationStopped,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster, cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-logical-replication-stopped],
      mixin: other,
    }
  - {
      id: cnpg-logical-replication-stopped-critical,
      primary_card: upstream-conditions/cnpg-logical-replication-stopped-critical/condition,
      alertname: CNPGClusterLogicalReplicationStoppedCritical,
      role: cause,
      entity: { kind: Cluster, name_labels: [cnpg_cluster, cluster] },
      component_type: postgres.cnpg-cluster,
      chains: [availability, upstream-conditions/cnpg-logical-replication-stopped-critical],
      mixin: other,
    }

  # ---------- postgres_exporter mixin ----------
  - {
      id: postgresql-down,
      primary_card: availability/instances-up,
      alertname: PostgreSQLDown,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [availability],
      mixin: other,
    }
  - {
      id: postgresql-max-connections-reached,
      primary_card: saturation/connections,
      alertname: PostgreSQLMaxConnectionsReached,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation],
      mixin: other,
    }
  - {
      id: postgresql-high-connections,
      primary_card: saturation/connections,
      alertname: PostgreSQLHighConnections,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation],
      mixin: other,
    }
  - {
      id: postgresql-slow-queries,
      primary_card: upstream-conditions/postgresql-slow-queries/condition,
      alertname: PostgreSQLSlowQueries,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation, upstream-conditions/postgresql-slow-queries],
      mixin: other,
    }
  - {
      id: postgresql-qps,
      primary_card: upstream-conditions/postgresql-qps/condition,
      alertname: PostgreSQLQPS,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation, upstream-conditions/postgresql-qps],
      mixin: other,
    }
  - {
      id: postgresql-cache-hit-ratio,
      primary_card: upstream-conditions/postgresql-cache-hit-ratio/condition,
      alertname: PostgreSQLCacheHitRatio,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation, upstream-conditions/postgresql-cache-hit-ratio],
      mixin: other,
    }
  - {
      id: postgres-too-many-rollbacks,
      primary_card: saturation/rollbacks,
      alertname: PostgresHasTooManyRollbacks,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation],
      mixin: other,
    }
  - {
      id: postgres-high-deadlocks,
      primary_card: saturation/lock-waits,
      alertname: PostgresHasHighDeadLocks,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation],
      mixin: other,
    }
  - {
      id: postgres-too-many-locks,
      primary_card: upstream-conditions/postgres-too-many-locks/condition,
      alertname: PostgresAcquiredTooManyLocks,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation, upstream-conditions/postgres-too-many-locks],
      mixin: other,
    }
  - {
      id: postgres-replication-slot-unused,
      primary_card: upstream-conditions/postgres-replication-slot-unused/condition,
      alertname: PostgresHasReplicationSlotUsed,
      role: cause,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [wal, upstream-conditions/postgres-replication-slot-unused],
      mixin: other,
    }
  - {
      id: postgres-replication-role-changed,
      primary_card: availability/primary-changes,
      alertname: PostgresReplicationRoleChanged,
      role: change,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [availability],
      mixin: other,
    }
  - {
      id: postgres-exporter-errors,
      primary_card: upstream-conditions/postgres-exporter-errors/condition,
      alertname: PostgresHasExporterErrors,
      role: meta,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [observability-self/scrape, upstream-conditions/postgres-exporter-errors],
      mixin: other,
    }
  - {
      id: postgres-tables-not-vacuumed,
      primary_card: upstream-conditions/postgres-tables-not-vacuumed/condition,
      alertname: PostgresTablesNotVaccumed,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [saturation, upstream-conditions/postgres-tables-not-vacuumed],
      mixin: other,
    }
  - {
      id: postgres-too-many-checkpoints-requested,
      primary_card: upstream-conditions/postgres-too-many-checkpoints-requested/condition,
      alertname: PostgresTooManyCheckpointsRequested,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod] },
      component_type: postgres.instance,
      chains: [wal, upstream-conditions/postgres-too-many-checkpoints-requested],
      mixin: other,
    }
