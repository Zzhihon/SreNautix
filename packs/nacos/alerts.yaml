# Nacos 文档 monitor-guide 中 Prometheus 告警示例的告警名。
entries:
  - {
      id: nacos-down,
      primary_card: upstream-conditions/nacos-down/condition,
      alertname: NacosDown,
      role: cause,
      entity: { kind: Pod, name_labels: [pod, instance] },
      component_type: nacos.server,
      chains: [nacos, upstream-conditions/nacos-down],
      mixin: other,
    }
  - {
      id: nacos-db-unhealthy,
      primary_card: nacos/exceptions,
      alertname: NacosDatabaseUnhealthy,
      role: cause,
      entity: { kind: Pod, name_labels: [pod, instance] },
      component_type: nacos.server,
      chains: [nacos],
      mixin: other,
    }
  - {
      id: nacos-jvm-heap-high,
      primary_card: nacos/connections-heap,
      alertname: NacosJvmHeapHigh,
      role: symptom,
      entity: { kind: Pod, name_labels: [pod, instance] },
      component_type: nacos.server,
      chains: [nacos],
      mixin: other,
    }
