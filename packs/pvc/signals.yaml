# 卷的用量来自 kubelet（kubelet_volume_stats_*，带 namespace 与 persistentvolumeclaim 标签）。
# 每个容量信号写成两半，用 or 合并：
#   前一半按 $selector 直接选 PVC（实体是 PersistentVolumeClaim 时命中）；
#   后一半经 kube_pod_spec_volumes_persistentvolumeclaims_info 找到 Pod 挂载的 PVC（实体是 Pod 或工作负载时命中）。
signals:
  - id: pvc_used_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, persistentvolumeclaim) (
            kubelet_volume_stats_used_bytes{$selector} / kubelet_volume_stats_capacity_bytes{$selector}
          )
          or
          max by (namespace, persistentvolumeclaim) (
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
            * on (namespace, persistentvolumeclaim) group_left ()
            max by (namespace, persistentvolumeclaim) (kube_pod_spec_volumes_persistentvolumeclaims_info{$selector})
          )
  - id: pvc_inodes_used_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, persistentvolumeclaim) (
            kubelet_volume_stats_inodes_used{$selector} / kubelet_volume_stats_inodes{$selector}
          )
          or
          max by (namespace, persistentvolumeclaim) (
            (kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes)
            * on (namespace, persistentvolumeclaim) group_left ()
            max by (namespace, persistentvolumeclaim) (kube_pod_spec_volumes_persistentvolumeclaims_info{$selector})
          )
  - id: pvc_hours_to_full
    kind: metrics
    unit: hours
    alternatives:
      # 按近 6 小时趋势，只保留可用空间在下降的卷；值为预计写满前的小时数
      - expr: >-
          min by (namespace, persistentvolumeclaim) (
            kubelet_volume_stats_available_bytes{$selector} / -(deriv(kubelet_volume_stats_available_bytes{$selector}[6h]) < 0) / 3600
          )
          or
          min by (namespace, persistentvolumeclaim) (
            (kubelet_volume_stats_available_bytes / -(deriv(kubelet_volume_stats_available_bytes[6h]) < 0) / 3600)
            * on (namespace, persistentvolumeclaim) group_left ()
            max by (namespace, persistentvolumeclaim) (kube_pod_spec_volumes_persistentvolumeclaims_info{$selector})
          )
  - id: namespace_pvc_used_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          topk(5, max by (namespace, persistentvolumeclaim) (
            kubelet_volume_stats_used_bytes{namespace="$namespace"} / kubelet_volume_stats_capacity_bytes{namespace="$namespace"}
          ))
  - id: pvc_phase_pending
    kind: metrics
    alternatives:
      - expr: max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{$selector, phase="Pending"})
  - id: pv_phase_bad
    kind: metrics
    alternatives:
      - expr: max by (persistentvolume, phase) (kube_persistentvolume_status_phase{persistentvolume="$name", phase=~"Failed|Pending"})
  # 命名空间存在：日志卡用它区分"没有匹配的日志"与"没有数据"
  - id: namespace_active
    kind: metrics
    alternatives:
      - expr: max by (namespace) (kube_namespace_status_phase{namespace="$namespace", phase="Active"})
  - id: enospc_log_lines
    kind: logs
    alternatives:
      - expr: (?i)(no space left on device|ENOSPC|disk quota exceeded)
        dialect: logs_match
