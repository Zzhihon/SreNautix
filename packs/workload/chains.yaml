chains:
  - id: pod-restarts
    title: { zh-CN: 重启与资源, en: Restarts and resources }
    runbook: workload.md
    cards:
      - id: restarts
        title: { zh-CN: 重启与终止原因, en: Restarts and termination reasons }
        note:
          {
            zh-CN: 窗口内的重启次数、CrashLoopBackOff 与最近一次终止原因,
            en: 'Restarts, CrashLoopBackOff and the last termination reason',
          }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        params: { restarts: 0 }
        refs:
          - { name: restarts, signal: container_restarts, mode: instant }
          - { name: crash, signal: container_crashloop, mode: instant, empty_is: normal }
          - { name: reasons, signal: container_last_terminated, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: total, cel: sum(restarts) }
            - { name: looping, cel: size(crash) }
          abnormal_if:
            - cel: looping > 0
              say:
                { zh-CN: '{looping} 个容器处于 CrashLoopBackOff', en: '{looping} containers are in CrashLoopBackOff' }
            - cel: total > double(params.restarts)
              say: { zh-CN: '窗口内重启 {total, number} 次', en: '{total, number} restarts in the window' }
        display:
          value: total
          unit: count
          table:
            rows_from: reasons
            columns:
              - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
              - { header: { zh-CN: 容器, en: Container }, cel: 'label(row, "container")' }
              - { header: { zh-CN: 最近终止原因, en: Last termination }, cel: 'label(row, "reason")' }
        egress: allow
      - id: memory
        title: { zh-CN: 内存占 limit 与 OOM, en: Memory vs limit and OOM }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        params: { limit_ratio: 0.9 }
        refs:
          - { name: mem, signal: container_memory_limit_ratio, mode: range }
          - { name: oom, signal: container_oom_events, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: peak, cel: max(mem) }
            - { name: ooms, cel: count(oom) }
            - { name: anomaly_started_at, cel: 'first_above(mem, params.limit_ratio)' }
          abnormal_if:
            - cel: ooms > 0
              say: { zh-CN: '{ooms} 个容器被 OOM 终止', en: '{ooms} containers were OOM-killed' }
            - cel: peak > params.limit_ratio
              say: { zh-CN: 'working set 峰值 {peak, number, percent}', en: 'Peak working set {peak, number, percent}' }
        display:
          value: peak
          unit: percent
          threshold: params.limit_ratio
          table:
            rows_from: mem
            sort_by: max(row)
            limit: 5
            columns:
              - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
              - { header: { zh-CN: 容器, en: Container }, cel: 'label(row, "container")' }
              - { header: { zh-CN: 峰值, en: Peak }, cel: max(row), unit: percent }
        egress: allow
      - id: throttling
        title: { zh-CN: CPU 限流, en: CPU throttling }
        note: { zh-CN: 被 CFS 限流的周期占比；超过 25% 时延迟会明显上升, en: Share of throttled CFS periods }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        params: { ratio: 0.25 }
        refs:
          - { name: thr, signal: container_cpu_throttled_ratio, mode: range }
        judge:
          let:
            - { name: peak, cel: max(thr) }
          abnormal_if:
            - cel: peak > params.ratio
              say: { zh-CN: '限流比例峰值 {peak, number, percent}', en: 'Peak throttling {peak, number, percent}' }
        display: { value: peak, unit: percent, threshold: params.ratio }
        egress: allow
      - id: readiness
        title: { zh-CN: 就绪, en: Readiness }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        refs:
          - { name: ready, signal: pod_ready, mode: range }
        judge:
          let:
            - { name: notReady, cel: 'size(ready.filter(s, min(s) < 1.0))' }
            - { name: anomaly_started_at, cel: 'first_below(ready, 1.0)' }
          abnormal_if:
            - cel: notReady > 0
              say: { zh-CN: '{notReady} 个 Pod 在窗口内未就绪', en: '{notReady} pods were not ready in the window' }
        display:
          value: double(notReady)
          unit: count
          table:
            rows_from: ready
            columns:
              - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
              - { header: { zh-CN: 最低, en: Min }, cel: min(row) }
        egress: allow

  - id: pod-pending
    title: { zh-CN: 调度与启动, en: Scheduling and startup }
    runbook: workload.md
    cards:
      - id: pending
        title: { zh-CN: 持续 Pending, en: Stuck pending }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        refs:
          - { name: pending, signal: pod_pending, mode: range }
          - { name: unsched, signal: pod_unschedulable, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: stuck, cel: 'size(pending.filter(s, min(s) >= 1.0))' }
            - { name: unschedulable, cel: size(unsched) }
          abnormal_if:
            - cel: unschedulable > 0
              say: { zh-CN: '{unschedulable} 个 Pod 无法调度', en: '{unschedulable} pods are unschedulable' }
            - cel: stuck > 0
              say:
                { zh-CN: '{stuck} 个 Pod 在整个窗口内 Pending', en: '{stuck} pods stayed pending for the whole window' }
        display: { value: double(stuck), unit: count }
        egress: allow
      - id: waiting
        title: { zh-CN: 容器等待原因, en: Container waiting reasons }
        note:
          {
            zh-CN: 'ImagePullBackOff、CreateContainerConfigError 等（CrashLoopBackOff 在重启卡）',
            en: 'ImagePullBackOff, CreateContainerConfigError and similar',
          }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        refs:
          - { name: info, signal: pod_info, mode: instant }
          - { name: waiting, signal: container_waiting_other, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: n, cel: size(waiting) }
          abnormal_if:
            - cel: n > 0
              say: { zh-CN: '{n} 个容器在等待（拉取镜像或配置错误）', en: '{n} containers are waiting' }
        display:
          table:
            rows_from: waiting
            columns:
              - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
              - { header: { zh-CN: 容器, en: Container }, cel: 'label(row, "container")' }
              - { header: { zh-CN: 原因, en: Reason }, cel: 'label(row, "reason")' }
        egress: allow
      - id: init-stuck
        title: { zh-CN: 卡住的 init 容器, en: Stuck init containers }
        note:
          {
            zh-CN: init 容器在整个窗口内一直运行或等待；常见于等待的依赖已经恢复、但 init 容器没有重试,
            en: An init container ran or waited for the whole window,
          }
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        window: { before: 15m, after: 1m }
        refs:
          - { name: info, signal: pod_info, mode: instant }
          - { name: running, signal: init_container_running, mode: range, empty_is: normal }
          - { name: waiting, signal: init_container_waiting, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: stuckRunning, cel: 'size(running.filter(s, min(s) >= 1.0))' }
            - { name: stuckWaiting, cel: size(waiting) }
          abnormal_if:
            - cel: stuckRunning > 0
              say:
                {
                  zh-CN: '{stuckRunning} 个 init 容器运行超过 15 分钟没有结束',
                  en: '{stuckRunning} init containers ran for over 15 minutes',
                }
            - cel: stuckWaiting > 0
              say: { zh-CN: '{stuckWaiting} 个 init 容器在等待', en: '{stuckWaiting} init containers are waiting' }
        display:
          table:
            rows_from: running
            columns:
              - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
              - { header: { zh-CN: init 容器, en: Init container }, cel: 'label(row, "container")' }
        egress: allow
      - id: pdb
        title: { zh-CN: PDB 健康副本, en: PDB healthy pods }
        applies_to: { kinds: [PodDisruptionBudget] }
        refs:
          - { name: missing, signal: pdb_missing_healthy, mode: range }
        judge:
          let:
            - { name: lack, cel: last(missing) }
          abnormal_if:
            - cel: lack > 0.0
              say:
                { zh-CN: '健康副本比要求少 {lack, number} 个', en: '{lack, number} fewer healthy pods than required' }
        display: { value: lack, unit: count }
        egress: allow

  - id: rollout
    title: { zh-CN: 发布进度, en: Rollout progress }
    runbook: workload.md
    cards:
      - id: deployment
        title: { zh-CN: Deployment 发布, en: Deployment rollout }
        applies_to: { kinds: [Deployment] }
        refs:
          - { name: unavailable, signal: deployment_unavailable, mode: range }
          - { name: changes, signal: deployment_spec_changes, mode: instant }
        judge:
          let:
            - { name: missing, cel: last(unavailable) }
            - { name: specChanges, cel: last(changes) }
          abnormal_if:
            - cel: missing > 0.0
              say:
                {
                  zh-CN: '窗口结束时仍有 {missing, number} 个副本不可用',
                  en: '{missing, number} replicas still unavailable',
                }
            - cel: specChanges > 0.0
              say:
                {
                  zh-CN: '窗口内 spec 变更 {specChanges, number} 次',
                  en: 'The spec changed {specChanges, number} times in the window',
                }
        display: { value: missing, unit: count }
        egress: allow
      - id: statefulset
        title: { zh-CN: StatefulSet 发布, en: StatefulSet rollout }
        applies_to: { kinds: [StatefulSet] }
        refs:
          - { name: notReady, signal: statefulset_not_ready, mode: range }
          - { name: notUpdated, signal: statefulset_not_updated, mode: instant }
          - { name: changes, signal: statefulset_spec_changes, mode: instant }
        judge:
          let:
            - { name: missing, cel: last(notReady) }
            - { name: stale, cel: last(notUpdated) }
            - { name: specChanges, cel: last(changes) }
          abnormal_if:
            - cel: missing > 0.0
              say:
                {
                  zh-CN: '窗口结束时仍有 {missing, number} 个副本未就绪',
                  en: '{missing, number} replicas still not ready',
                }
            - cel: stale > 0.0
              say:
                { zh-CN: '{stale, number} 个副本还是旧版本', en: '{stale, number} replicas still run the old revision' }
            - cel: specChanges > 0.0
              say:
                {
                  zh-CN: '窗口内 spec 变更 {specChanges, number} 次',
                  en: 'The spec changed {specChanges, number} times in the window',
                }
        display: { value: missing, unit: count }
        egress: allow
      - id: daemonset
        title: { zh-CN: DaemonSet 发布, en: DaemonSet rollout }
        applies_to: { kinds: [DaemonSet] }
        refs:
          - { name: unavailable, signal: daemonset_unavailable, mode: range }
          - { name: changes, signal: daemonset_spec_changes, mode: instant }
        judge:
          let:
            - { name: missing, cel: last(unavailable) }
            - { name: specChanges, cel: last(changes) }
          abnormal_if:
            - cel: missing > 0.0
              say:
                {
                  zh-CN: '{missing, number} 个节点上的 Pod 不可用或调度错误',
                  en: '{missing, number} pods unavailable or misscheduled',
                }
            - cel: specChanges > 0.0
              say:
                {
                  zh-CN: '窗口内 spec 变更 {specChanges, number} 次',
                  en: 'The spec changed {specChanges, number} times in the window',
                }
        display: { value: missing, unit: count }
        egress: allow

  - id: job
    title: { zh-CN: Job, en: Job }
    runbook: workload.md
    cards:
      - id: status
        title: { zh-CN: Job 失败与运行时长, en: Job failures and duration }
        applies_to: { kinds: [Job] }
        params: { max_hours: 12 }
        refs:
          - { name: failed, signal: job_failed, mode: instant }
          - { name: active, signal: job_active_seconds, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: failures, cel: last(failed) }
            - { name: longRunning, cel: 'size(active.filter(s, last(s) > double(params.max_hours) * 3600.0))' }
          abnormal_if:
            - cel: failures > 0.0
              say: { zh-CN: 'Job 失败 {failures, number} 次', en: 'The job failed {failures, number} times' }
            - cel: longRunning > 0
              say: { zh-CN: Job 运行超过 12 小时仍未结束, en: The job has been running for over 12 hours }
        display: { value: failures, unit: count }
        egress: allow

  - id: capacity
    title: { zh-CN: 容量, en: Capacity }
    runbook: workload.md
    cards:
      - id: hpa
        title: { zh-CN: HPA 上限, en: HPA ceiling }
        applies_to: { kinds: [HorizontalPodAutoscaler] }
        refs:
          - { name: ratio, signal: hpa_at_max, mode: range }
        judge:
          let:
            - { name: peak, cel: max(ratio) }
          abnormal_if:
            - cel: peak >= 1.0
              say: { zh-CN: 副本数顶到 HPA 上限, en: Replicas reached the HPA maximum }
        display: { value: peak, unit: percent }
        egress: allow
      - id: quota
        title: { zh-CN: 命名空间配额, en: Namespace quota }
        applies_to: { kinds: [ResourceQuota, Namespace, Pod, Deployment, StatefulSet, DaemonSet] }
        params: { ratio: 0.9 }
        refs:
          - { name: usage, signal: quota_usage, mode: instant }
        judge:
          let:
            - { name: peak, cel: max(usage) }
          abnormal_if:
            - cel: peak > params.ratio
              say: { zh-CN: '配额最高占用 {peak, number, percent}', en: 'Highest quota usage {peak, number, percent}' }
        display:
          value: peak
          unit: percent
          table:
            rows_from: usage
            sort_by: last(row)
            columns:
              - { header: { zh-CN: 配额, en: Quota }, cel: 'label(row, "resourcequota")' }
              - { header: { zh-CN: 资源, en: Resource }, cel: 'label(row, "resource")' }
              - { header: { zh-CN: 占用, en: Used }, cel: last(row), unit: percent }
        egress: allow
      - id: node-requests
        title: { zh-CN: 节点 requests 占可分配量, en: Node requests vs allocatable }
        note: { zh-CN: 超过 90% 时新 Pod 无法调度, en: Above 90% new pods cannot be scheduled }
        applies_to: { kinds: [cluster, Node, Pod, Deployment, StatefulSet, DaemonSet] }
        params: { ratio: 0.9 }
        refs:
          - { name: req, signal: node_requests_ratio, mode: instant }
        judge:
          let:
            - { name: peak, cel: max(req) }
          abnormal_if:
            - cel: peak > params.ratio
              say:
                {
                  zh-CN: '节点 requests 最高占 {peak, number, percent}',
                  en: 'Highest node requests {peak, number, percent}',
                }
        display:
          value: peak
          unit: percent
          table:
            rows_from: req
            sort_by: last(row)
            columns:
              - { header: { zh-CN: 节点, en: Node }, cel: 'label(row, "node")' }
              - { header: { zh-CN: 资源, en: Resource }, cel: 'label(row, "resource")' }
              - { header: { zh-CN: 占比, en: Ratio }, cel: last(row), unit: percent }
        egress: allow

  # 发布：新 Pod 是否卡在 init 容器（例如等待数据库迁移）、新旧 ReplicaSet 的就绪、就绪 Pod 运行的版本、迁移 Job、
  # 发布前后的错误率与延迟。gitops 包的发布回退模板依据这些卡片判断是否适用。
  - id: release
    title: { zh-CN: 发布, en: Release }
    runbook: workload.md
    cards:
      - id: init-waiting
        title: { zh-CN: 卡在 init 容器的 Pod, en: Pods stuck in an init container }
        note:
          zh-CN: 窗口内 init 容器处于运行状态超过 params.minutes 分钟的 Pod；等待数据库迁移的 init 容器在迁移没有完成或镜像与库不兼容时会一直等待
          en: Pods whose init container ran longer than params.minutes minutes in the window, for example waiting for a database migration
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        window: { before: 30m, after: 30m }
        params: { minutes: 10 }
        refs:
          - { name: pods, signal: pod_info, mode: instant }
          - { name: running, signal: init_running_minutes, mode: instant, empty_is: normal }
          - { name: waiting, signal: init_container_waiting, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: stuck, cel: 'size(running.filter(s, last(s) > double(params.minutes)))' }
            - { name: crashing, cel: size(waiting) }
            - { name: longest, cel: 'count(running) > 0 ? max(running) : 0.0' }
          abnormal_if:
            - cel: stuck > 0
              say:
                {
                  zh-CN: '{stuck} 个 Pod 的 init 容器运行超过 {longest, number} 分钟',
                  en: '{stuck} pods kept an init container running for up to {longest, number} minutes',
                }
            - cel: crashing > 0
              say: { zh-CN: '{crashing} 个 init 容器在反复失败', en: '{crashing} init containers keep failing' }
        display:
          value: longest
          unit: count
          table:
            rows_from: running
            sort_by: last(row)
            columns:
              - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
              - { header: { zh-CN: init 容器, en: Init container }, cel: 'label(row, "container")' }
              - { header: { zh-CN: 分钟, en: Minutes }, cel: last(row), unit: count }
        egress: allow
      - id: replicasets
        title: { zh-CN: 新旧 ReplicaSet 的就绪, en: Old and new ReplicaSets }
        note:
          zh-CN: Deployment 的各 ReplicaSet 在窗口末尾的期望与就绪副本数；有期望副本却没有全部就绪的 ReplicaSet 说明滚动停在半路
          en: Desired and ready replicas of each ReplicaSet at the end of the window; a ReplicaSet short of ready replicas means the rollout stopped midway
        applies_to: { kinds: [Deployment] }
        window: { before: 30m, after: 30m }
        refs:
          - { name: desired, signal: replicaset_desired, mode: instant }
          - { name: missing, signal: replicaset_missing_ready, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: active, cel: 'size(desired.filter(s, last(s) > 0.0))' }
            - { name: short, cel: count(missing) }
          abnormal_if:
            - cel: short > 0
              say:
                {
                  zh-CN: '{short} 个 ReplicaSet 没有达到期望的就绪副本数（{active} 个 ReplicaSet 有期望副本）',
                  en: '{short} ReplicaSets are short of ready replicas ({active} have desired replicas)',
                }
        display:
          value: short
          unit: count
          table:
            rows_from: desired
            columns:
              - { header: { zh-CN: ReplicaSet, en: ReplicaSet }, cel: 'label(row, "replicaset")' }
              - { header: { zh-CN: 期望, en: Desired }, cel: last(row), unit: count }
        egress: allow
      - id: serving-versions
        title: { zh-CN: 就绪 Pod 运行的版本, en: Versions run by ready pods }
        note:
          zh-CN: 工作负载的就绪 Pod 中每个容器运行的镜像 digest；同一容器在不同 Pod 中运行不同的 digest 说明发布或回退没有完成，就绪 Pod 最多的就是正在服务的版本
          en: Image digests run by each container of the workload's ready pods; one container running different digests across pods means a release or rollback is incomplete
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet] }
        window: { before: 30m, after: 30m }
        refs:
          - { name: images, signal: ready_pod_images, mode: instant }
        judge:
          let:
            # 有另一个 digest 的容器（每个这样的容器计两次以上，只用于是否混跑）
            - {
                name: mixed,
                cel: 'size(images.filter(s, images.exists(o, label(o, "container") == label(s, "container") && label(o, "image_id") != label(s, "image_id"))))',
              }
            - { name: digests, cel: count(images) }
          abnormal_if:
            - cel: mixed > 0
              say:
                {
                  zh-CN: '就绪 Pod 中同一容器运行 {mixed} 个不同的镜像版本',
                  en: 'The same container runs {mixed} different image versions across ready pods',
                }
        display:
          value: digests
          unit: count
          table:
            rows_from: images
            sort_by: last(row)
            columns:
              - { header: { zh-CN: 容器, en: Container }, cel: 'label(row, "container")' }
              - { header: { zh-CN: 镜像, en: Image }, cel: 'label(row, "image_id")' }
              - { header: { zh-CN: 就绪 Pod, en: Ready pods }, cel: last(row), unit: count }
        egress: allow
      - id: migration-jobs
        title: { zh-CN: 迁移 Job, en: Migration jobs }
        note:
          zh-CN: 命名空间内名字匹配 params.job_pattern 的 Job 在窗口末尾是否失败或仍在运行
          en: Whether jobs matching params.job_pattern failed or are still running at the end of the window
        applies_to: { kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job] }
        window: { before: 60m, after: 30m }
        params: { job_pattern: '.*migrat.*' }
        refs:
          - { name: pods, signal: pod_info, mode: instant }
          - { name: failed, signal: job_failed_matching, mode: instant, empty_is: normal }
          - { name: active, signal: job_active_matching, mode: instant, empty_is: normal }
        judge:
          let:
            - { name: failures, cel: count(failed) }
            - { name: running, cel: count(active) }
          abnormal_if:
            - cel: failures > 0
              say: { zh-CN: '{failures} 个迁移 Job 失败', en: '{failures} migration jobs failed' }
        display:
          value: running
          unit: count
          table:
            rows_from: failed
            columns:
              - { header: { zh-CN: Job, en: Job }, cel: 'label(row, "job_name")' }
        egress: allow
  # 发布前后的流量指标：按 Prometheus 客户端库惯例的 http_requests_total 与 http_request_duration_seconds；
  # 与 release 分开，没有这两个指标的应用只挂 release，在自己的包里写对应的对比卡
  - id: release-traffic
    title: { zh-CN: 发布前后的流量, en: Traffic before and after a release }
    runbook: workload.md
    cards:
      # 开始之前与之后各自取峰值对比；任何一侧没有点时不可求值
      - id: errors-before-after
        title: { zh-CN: 开始前后的 5xx 比例, en: 5xx ratio before and after the start }
        note:
          zh-CN: 事件开始前后 HTTP 5xx 比例的峰值；之后的峰值超过 params.error_ratio 且超过之前的 params.factor 倍时判为异常
          en: Peak HTTP 5xx ratio before and after the incident started; abnormal when the later peak exceeds params.error_ratio and params.factor times the earlier peak
        applies_to: { kinds: [Deployment, StatefulSet, DaemonSet] }
        window: { before: 30m, after: 30m }
        params: { factor: 2.0, error_ratio: 0.01 }
        refs:
          - { name: errors, signal: http_error_ratio, mode: range }
        judge:
          let:
            - { name: e0, cel: 'max_in(errors, window.from, window.anchor)' }
            - { name: e1, cel: 'max_in(errors, window.anchor, window.to + 1.0)' }
          abnormal_if:
            - cel: e1 > params.error_ratio && e1 > params.factor * e0
              say:
                {
                  zh-CN: '5xx 比例的峰值由开始之前的 {e0, number, percent} 升到 {e1, number, percent}',
                  en: 'Peak 5xx ratio rose from {e0, number, percent} before the start to {e1, number, percent}',
                }
        display: { value: e1, unit: percent, threshold: params.error_ratio }
        egress: allow
      - id: latency-before-after
        title: { zh-CN: 开始前后的 p95 延迟, en: p95 latency before and after the start }
        note:
          zh-CN: 事件开始前后 HTTP p95 延迟的峰值；之后的峰值超过之前的 params.factor 倍时判为异常
          en: Peak HTTP p95 latency before and after the incident started; abnormal when the later peak exceeds params.factor times the earlier peak
        applies_to: { kinds: [Deployment, StatefulSet, DaemonSet] }
        window: { before: 30m, after: 30m }
        params: { factor: 2.0 }
        refs:
          - { name: latency, signal: http_latency_p95, mode: range }
        judge:
          let:
            - { name: l0, cel: 'max_in(latency, window.from, window.anchor)' }
            - { name: l1, cel: 'max_in(latency, window.anchor, window.to + 1.0)' }
          abnormal_if:
            - cel: l1 > params.factor * l0
              say:
                {
                  zh-CN: 'p95 延迟的峰值由开始之前的 {l0, number} 秒升到 {l1, number} 秒',
                  en: 'Peak p95 latency rose from {l0, number} s before the start to {l1, number} s',
                }
        display: { value: l1, unit: seconds }
        egress: allow
