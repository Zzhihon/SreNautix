# Pod 级信号用 $selector：Pod 实体展开为 namespace + pod，工作负载实体展开为 namespace + 按控制器命名规则匹配的 pod。
# 工作负载级信号用 $namespace 与 $name，标签名取 kube-state-metrics 的约定。
signals:
  - id: pod_info
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod, node) (kube_pod_info{$selector})
  - id: container_restarts
    kind: metrics
    unit: count
    alternatives:
      - expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{$selector}[$window]))
  - id: container_last_terminated
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod, container, reason) (kube_pod_container_status_last_terminated_reason{$selector}) == 1
  - id: container_crashloop
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{$selector, reason="CrashLoopBackOff"}[$window])) == 1
  - id: container_waiting_other
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod, container, reason) (max_over_time(kube_pod_container_status_waiting_reason{$selector, reason!="CrashLoopBackOff", reason!="ContainerCreating"}[$window])) == 1
  - id: container_memory_limit_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, pod, container) (
            container_memory_working_set_bytes{$selector, container!="", container!="POD"}
            / on (namespace, pod, container)
            kube_pod_container_resource_limits{$selector, resource="memory"}
          )
  - id: container_oom_events
    kind: metrics
    alternatives:
      - expr: sum by (namespace, pod, container) (increase(container_oom_events_total{$selector, container!=""}[$window])) > 0
      - expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_last_terminated_reason{$selector, reason="OOMKilled"}[$window])) > 0
  - id: container_cpu_throttled_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{$selector, container!=""}[$rate_window]))
          / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{$selector, container!=""}[$rate_window]))
  - id: pod_ready
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod) (kube_pod_status_ready{$selector, condition="true"})
  - id: pod_pending
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod) (kube_pod_status_phase{$selector, phase="Pending"})
  - id: pod_unschedulable
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod) (max_over_time(kube_pod_status_unschedulable{$selector}[$window])) == 1
  - id: init_container_running
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod, container) (kube_pod_init_container_status_running{$selector})
  - id: init_container_waiting
    kind: metrics
    alternatives:
      - expr: max by (namespace, pod, container, reason) (max_over_time(kube_pod_init_container_status_waiting_reason{$selector}[$window])) == 1
  - id: pdb_missing_healthy
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, poddisruptionbudget) (
            kube_poddisruptionbudget_status_desired_healthy{namespace="$namespace", poddisruptionbudget="$name"}
            - kube_poddisruptionbudget_status_current_healthy{namespace="$namespace", poddisruptionbudget="$name"}
          )
  - id: deployment_unavailable
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, deployment) (
            kube_deployment_spec_replicas{namespace="$namespace", deployment="$name"}
            - kube_deployment_status_replicas_available{namespace="$namespace", deployment="$name"}
          )
  - id: deployment_spec_changes
    kind: metrics
    unit: count
    alternatives:
      - expr: max by (namespace, deployment) (changes(kube_deployment_metadata_generation{namespace="$namespace", deployment="$name"}[$window]))
  - id: statefulset_not_ready
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, statefulset) (
            kube_statefulset_replicas{namespace="$namespace", statefulset="$name"}
            - kube_statefulset_status_replicas_ready{namespace="$namespace", statefulset="$name"}
          )
  - id: statefulset_not_updated
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, statefulset) (
            kube_statefulset_replicas{namespace="$namespace", statefulset="$name"}
            - kube_statefulset_status_replicas_updated{namespace="$namespace", statefulset="$name"}
          )
  - id: statefulset_spec_changes
    kind: metrics
    unit: count
    alternatives:
      - expr: max by (namespace, statefulset) (changes(kube_statefulset_metadata_generation{namespace="$namespace", statefulset="$name"}[$window]))
  - id: daemonset_unavailable
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, daemonset) (
            kube_daemonset_status_number_unavailable{namespace="$namespace", daemonset="$name"}
            + kube_daemonset_status_number_misscheduled{namespace="$namespace", daemonset="$name"}
          )
  - id: daemonset_spec_changes
    kind: metrics
    unit: count
    alternatives:
      - expr: max by (namespace, daemonset) (changes(kube_daemonset_metadata_generation{namespace="$namespace", daemonset="$name"}[$window]))
  - id: job_failed
    kind: metrics
    unit: count
    alternatives:
      - expr: max by (namespace, job_name) (kube_job_status_failed{namespace="$namespace", job_name="$name"})
  - id: job_active_seconds
    kind: metrics
    unit: seconds
    alternatives:
      # 仍在运行的 Job 已运行的秒数；没有在运行时没有序列
      - expr: >-
          max by (namespace, job_name) (
            time() - kube_job_status_start_time{namespace="$namespace", job_name="$name"}
            and on (namespace, job_name) kube_job_status_active{namespace="$namespace", job_name="$name"} > 0
          )
  - id: hpa_at_max
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, horizontalpodautoscaler) (
            kube_horizontalpodautoscaler_status_current_replicas{namespace="$namespace", horizontalpodautoscaler="$name"}
            / kube_horizontalpodautoscaler_spec_max_replicas{namespace="$namespace", horizontalpodautoscaler="$name"}
          )
  # ---- HPA 达到上限时是否已经饱和（capacity 链）：区分"副本数顶到上限但资源仍有余量"与"已经饱和" ----
  # HPA 各指标当前值占目标值的比例（kube-state-metrics 2.9 起导出 spec/status_target_metric，按 metric_name 与类型配对）
  - id: hpa_target_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, horizontalpodautoscaler, metric_name, metric_target_type) (
            kube_horizontalpodautoscaler_status_target_metric{namespace="$namespace", horizontalpodautoscaler="$name"}
          )
          / on (namespace, horizontalpodautoscaler, metric_name, metric_target_type)
          (max by (namespace, horizontalpodautoscaler, metric_name, metric_target_type) (
            kube_horizontalpodautoscaler_spec_target_metric{namespace="$namespace", horizontalpodautoscaler="$name"}
          ) > 0)
  # HPA 伸缩对象（Deployment 或 StatefulSet）的 Pod 的 CPU 限流比例：
  # HPA 的 scaletargetref → Deployment 的 ReplicaSet（kube_replicaset_owner）或 StatefulSet → Pod（kube_pod_owner）
  - id: hpa_target_throttled_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, pod) (
            (
              sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace", container!=""}[$rate_window]))
              / (sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{namespace="$namespace", container!=""}[$rate_window])) > 0)
            )
            * on (namespace, pod) group_left ()
            (
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left ()
                max by (namespace, replicaset) (
                  label_replace(kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment"}, "target", "$1", "owner_name", "(.+)")
                  * on (namespace, target) group_left ()
                  max by (namespace, target) (
                    label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="Deployment"}, "target", "$1", "scaletargetref_name", "(.+)")
                  )
                )
              )
              or
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="StatefulSet"}, "target", "$1", "owner_name", "(.+)")
                * on (namespace, target) group_left ()
                max by (namespace, target) (
                  label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="StatefulSet"}, "target", "$1", "scaletargetref_name", "(.+)")
                )
              )
            )
          )
  # HPA 伸缩对象的 Pod 的 HTTP 请求 p95 延迟，与一天前同一时刻的 p95（基线）；指标名按 Prometheus 客户端库的惯例
  - id: hpa_target_latency_p95
    kind: metrics
    unit: seconds
    alternatives:
      - expr: >-
          histogram_quantile(0.95, sum by (le) (
            rate(http_request_duration_seconds_bucket{namespace="$namespace"}[$rate_window])
            * on (namespace, pod) group_left ()
            (
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left ()
                max by (namespace, replicaset) (
                  label_replace(kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment"}, "target", "$1", "owner_name", "(.+)")
                  * on (namespace, target) group_left ()
                  max by (namespace, target) (
                    label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="Deployment"}, "target", "$1", "scaletargetref_name", "(.+)")
                  )
                )
              )
              or
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="StatefulSet"}, "target", "$1", "owner_name", "(.+)")
                * on (namespace, target) group_left ()
                max by (namespace, target) (
                  label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="StatefulSet"}, "target", "$1", "scaletargetref_name", "(.+)")
                )
              )
            )
          ))
  # 同一组 Pod 超过最高有限桶的观测占比：大于 1 - 0.95 时 p95 饱和在最高有限桶的上界
  - id: hpa_target_latency_p95_overflow
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          1 - max(sum by (le) (
            rate(http_request_duration_seconds_bucket{namespace="$namespace", le!="+Inf"}[$rate_window])
            * on (namespace, pod) group_left ()
            (
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left ()
                max by (namespace, replicaset) (
                  label_replace(kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment"}, "target", "$1", "owner_name", "(.+)")
                  * on (namespace, target) group_left ()
                  max by (namespace, target) (
                    label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="Deployment"}, "target", "$1", "scaletargetref_name", "(.+)")
                  )
                )
              )
              or
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="StatefulSet"}, "target", "$1", "owner_name", "(.+)")
                * on (namespace, target) group_left ()
                max by (namespace, target) (
                  label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="StatefulSet"}, "target", "$1", "scaletargetref_name", "(.+)")
                )
              )
            )
          ))
          / (sum(
            rate(http_request_duration_seconds_bucket{namespace="$namespace", le="+Inf"}[$rate_window])
            * on (namespace, pod) group_left ()
            (
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left ()
                max by (namespace, replicaset) (
                  label_replace(kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment"}, "target", "$1", "owner_name", "(.+)")
                  * on (namespace, target) group_left ()
                  max by (namespace, target) (
                    label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="Deployment"}, "target", "$1", "scaletargetref_name", "(.+)")
                  )
                )
              )
              or
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="StatefulSet"}, "target", "$1", "owner_name", "(.+)")
                * on (namespace, target) group_left ()
                max by (namespace, target) (
                  label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="StatefulSet"}, "target", "$1", "scaletargetref_name", "(.+)")
                )
              )
            )
          ) > 0)
  - id: hpa_target_latency_p95_baseline
    kind: metrics
    unit: seconds
    alternatives:
      - expr: >-
          histogram_quantile(0.95, sum by (le) (
            rate(http_request_duration_seconds_bucket{namespace="$namespace"}[$rate_window] offset 1d)
            * on (namespace, pod) group_left ()
            (
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="ReplicaSet"} offset 1d, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left ()
                max by (namespace, replicaset) (
                  label_replace(kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment"} offset 1d, "target", "$1", "owner_name", "(.+)")
                  * on (namespace, target) group_left ()
                  max by (namespace, target) (
                    label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="Deployment"}, "target", "$1", "scaletargetref_name", "(.+)")
                  )
                )
              )
              or
              max by (namespace, pod) (
                label_replace(kube_pod_owner{namespace="$namespace", owner_kind="StatefulSet"} offset 1d, "target", "$1", "owner_name", "(.+)")
                * on (namespace, target) group_left ()
                max by (namespace, target) (
                  label_replace(kube_horizontalpodautoscaler_info{namespace="$namespace", horizontalpodautoscaler="$name", scaletargetref_kind="StatefulSet"}, "target", "$1", "scaletargetref_name", "(.+)")
                )
              )
            )
          ))
  - id: quota_usage
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          max by (namespace, resourcequota, resource) (kube_resourcequota{namespace="$namespace", type="used"})
          / max by (namespace, resourcequota, resource) (kube_resourcequota{namespace="$namespace", type="hard"} > 0)
  - id: node_requests_ratio
    kind: metrics
    unit: ratio
    alternatives:
      # 只有 Pending 与 Running 的 Pod 占用节点容量；kube-state-metrics 对已结束的 Pod 也保留 requests 序列
      - expr: >-
          topk(5,
            sum by (node, resource) (
              kube_pod_container_resource_requests{resource=~"cpu|memory"}
              * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
            )
            / on (node, resource) group_left () max by (node, resource) (kube_node_status_allocatable{resource=~"cpu|memory"})
          )

  # ---- 发布（chains.yaml 的 release 链） ----
  # init 容器在窗口内处于运行状态的分钟数（1 分钟分辨率的子查询）
  - id: init_running_minutes
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, pod, container) (
            count_over_time((max by (namespace, pod, container) (kube_pod_init_container_status_running{$selector}) == 1)[$window:1m])
          )
  # Deployment 的各 ReplicaSet：期望副本数与就绪副本数
  - id: replicaset_desired
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, replicaset) (
            kube_replicaset_spec_replicas{namespace="$namespace"}
            * on (namespace, replicaset) group_left ()
            max by (namespace, replicaset) (kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment", owner_name="$name"})
          )
  # 期望副本数减就绪副本数，只保留缺副本的 ReplicaSet
  - id: replicaset_missing_ready
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          max by (namespace, replicaset) (
            (
              kube_replicaset_spec_replicas{namespace="$namespace"}
              - on (namespace, replicaset) kube_replicaset_status_ready_replicas{namespace="$namespace"}
            )
            * on (namespace, replicaset) group_left ()
            max by (namespace, replicaset) (kube_replicaset_owner{namespace="$namespace", owner_kind="Deployment", owner_name="$name"})
          ) > 0
  # 工作负载的就绪 Pod 中每个容器运行的镜像 digest（image_id）与就绪 Pod 数；只看这个工作负载的 Pod，
  # 同一命名空间的其他应用与同一 Pod 的其他容器不会被当成另一个版本
  - id: ready_pod_images
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          count by (container, image_id) (
            max by (namespace, pod, container, image_id) (kube_pod_container_info{$selector, image_id=~".*sha256:.*"})
            * on (namespace, pod) group_left ()
            (max by (namespace, pod) (kube_pod_status_ready{$selector, condition="true"}) == 1)
          )
  # 命名空间内名字匹配的 Job：失败与仍在运行
  - id: job_failed_matching
    kind: metrics
    unit: count
    alternatives:
      - expr: max by (namespace, job_name) (kube_job_status_failed{namespace="$namespace", job_name=~"$params.job_pattern"}) > 0
  - id: job_active_matching
    kind: metrics
    unit: count
    alternatives:
      - expr: max by (namespace, job_name) (kube_job_status_active{namespace="$namespace", job_name=~"$params.job_pattern"}) > 0
  # 应用的 HTTP 5xx 比例与 p95 延迟（发布前后对比）；指标名按 Prometheus 客户端库的惯例
  - id: http_error_ratio
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          sum(rate(http_requests_total{$selector, code=~"5.."}[$rate_window]))
          / sum(rate(http_requests_total{$selector}[$rate_window]))
  - id: http_latency_p95
    kind: metrics
    unit: seconds
    alternatives:
      - expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{$selector}[$rate_window])))
  # 超过最高有限桶的观测占比：大于 1 - 0.95 时 p95 饱和在最高有限桶的上界
  - id: http_latency_p95_overflow
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          1 - max(sum by (le) (rate(http_request_duration_seconds_bucket{$selector, le!="+Inf"}[$rate_window])))
          / (sum(rate(http_request_duration_seconds_bucket{$selector, le="+Inf"}[$rate_window])) > 0)

  # ---- 查询模板（阶段 B 的区分性检查）用的信号：按 Pod 拆分的前 params.k 名 ----
  # 分组标签不能作为参数（信号探测时参数取占位值），所以固定按 pod 拆分
  - id: cpu_by_pod
    kind: metrics
    unit: ratio
    alternatives:
      - expr: >-
          topk($params.k, sum by (pod) (
            rate(container_cpu_usage_seconds_total{$selector, container!="", container!="POD"}[$rate_window])
          ))
  - id: memory_by_pod
    kind: metrics
    unit: bytes
    alternatives:
      - expr: >-
          topk($params.k, sum by (pod) (
            container_memory_working_set_bytes{$selector, container!="", container!="POD"}
          ))
  - id: restarts_by_pod
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          topk($params.k, sum by (pod) (
            increase(kube_pod_container_status_restarts_total{$selector}[$window])
          ))
  # 同一命名空间中另一个工作负载（Pod 名以 params.other 开头）在窗口内的重启次数
  - id: restarts_of_other
    kind: metrics
    unit: count
    alternatives:
      - expr: >-
          sum(increase(kube_pod_container_status_restarts_total{namespace="$namespace", pod=~"$params.other-.+"}[$window]))
  - id: restarts_total
    kind: metrics
    unit: count
    alternatives:
      - expr: sum(increase(kube_pod_container_status_restarts_total{$selector}[$window]))

# 区分性检查的查询模板：卡片表达不了的按 Pod 拆分的前 k 名与两个工作负载的对比。参数作为附带卡的 params 传入
templates:
  - id: cpu-by-pod
    signal: cpu_by_pod
    description: 工作负载的 CPU 用量按 Pod 拆分的前 k 名；判断用量是集中在一个 Pod 上（热点）还是整体上升
    args:
      type: object
      additionalProperties: false
      properties:
        k: { type: integer, minimum: 1, maximum: 20, description: 列出前几名 }
        share: { type: number, minimum: 0.3, maximum: 0.95, description: 第一名占比超过它时判为集中 }
    card:
      id: cpu-by-pod
      title: { zh-CN: CPU 用量按 Pod 拆分, en: CPU usage split by pod }
      note:
        zh-CN: 窗口末尾按 Pod 拆分的 CPU 用量前 params.k 名；第一名占比超过 params.share 时判为集中在一个 Pod 上
        en: CPU usage split by pod at the end of the window; concentrated when the first exceeds params.share of the total
      applies_to: { kinds: [Deployment, StatefulSet, DaemonSet] }
      params: { k: 5, share: 0.6 }
      refs:
        - { name: top, signal: cpu_by_pod, mode: instant }
      judge:
        let:
          - { name: share, cel: 'top_share(top, 1)' }
          # last(列表) 是各序列最后值中的最大值，等于它的序列就是第一名
          - { name: peak, cel: last(top) }
          - { name: leader, cel: 'label(top.filter(s, last(s) >= peak)[0], "pod")' }
        abnormal_if:
          - cel: count(top) > 1 && share > params.share
            say:
              {
                zh-CN: '{leader} 占 CPU 用量的 {share, number, percent}',
                en: '{leader} accounts for {share, number, percent} of the CPU usage',
              }
      display:
        value: share
        unit: percent
        table:
          rows_from: top
          sort_by: last(row)
          columns:
            - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
            - { header: { zh-CN: CPU（核）, en: CPU (cores) }, cel: last(row) }
      egress: allow
  - id: memory-by-pod
    signal: memory_by_pod
    description: 工作负载的内存工作集按 Pod 拆分的前 k 名；判断内存是集中在一个 Pod 上（泄漏）还是整体增长
    args:
      type: object
      additionalProperties: false
      properties:
        k: { type: integer, minimum: 1, maximum: 20, description: 列出前几名 }
        share: { type: number, minimum: 0.3, maximum: 0.95, description: 第一名占比超过它时判为集中 }
    card:
      id: memory-by-pod
      title: { zh-CN: 内存用量按 Pod 拆分, en: Memory usage split by pod }
      note:
        zh-CN: 窗口末尾按 Pod 拆分的内存工作集前 params.k 名；第一名占比超过 params.share 时判为集中在一个 Pod 上
        en: Memory working set split by pod at the end of the window; concentrated when the first exceeds params.share of the total
      applies_to: { kinds: [Deployment, StatefulSet, DaemonSet] }
      params: { k: 5, share: 0.6 }
      refs:
        - { name: top, signal: memory_by_pod, mode: instant }
      judge:
        let:
          - { name: share, cel: 'top_share(top, 1)' }
          - { name: peak, cel: last(top) }
          - { name: leader, cel: 'label(top.filter(s, last(s) >= peak)[0], "pod")' }
        abnormal_if:
          - cel: count(top) > 1 && share > params.share
            say:
              {
                zh-CN: '{leader} 占内存工作集的 {share, number, percent}',
                en: '{leader} accounts for {share, number, percent} of the memory working set',
              }
      display:
        value: share
        unit: percent
        table:
          rows_from: top
          sort_by: last(row)
          columns:
            - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
            - { header: { zh-CN: 工作集, en: Working set }, cel: last(row), unit: bytes }
      egress: allow
  - id: restarts-by-pod
    signal: restarts_by_pod
    description: 工作负载窗口内的容器重启按 Pod 拆分的前 k 名；判断重启是集中在一个 Pod 上还是普遍发生
    args:
      type: object
      additionalProperties: false
      properties:
        k: { type: integer, minimum: 1, maximum: 20, description: 列出前几名 }
        share: { type: number, minimum: 0.3, maximum: 0.95, description: 第一名占比超过它时判为集中 }
    card:
      id: restarts-by-pod
      title: { zh-CN: 重启按 Pod 拆分, en: Restarts split by pod }
      note:
        zh-CN: 窗口内按 Pod 拆分的重启次数前 params.k 名；有重启且第一名占比超过 params.share 时判为集中在一个 Pod 上
        en: Restarts in the window split by pod; concentrated when there are restarts and the first exceeds params.share of them
      applies_to: { kinds: [Deployment, StatefulSet, DaemonSet] }
      params: { k: 5, share: 0.6 }
      refs:
        - { name: top, signal: restarts_by_pod, mode: instant }
      judge:
        let:
          - { name: total, cel: sum(top) }
          - { name: share, cel: 'total > 0.0 ? top_share(top, 1) : 0.0' }
          - { name: peak, cel: last(top) }
          - { name: leader, cel: 'label(top.filter(s, last(s) >= peak)[0], "pod")' }
        abnormal_if:
          - cel: total > 0.0 && count(top) > 1 && share > params.share
            say:
              {
                zh-CN: '{total, number} 次重启中 {leader} 占 {share, number, percent}',
                en: '{leader} accounts for {share, number, percent} of {total, number} restarts',
              }
      display:
        value: total
        unit: count
        table:
          rows_from: top
          sort_by: last(row)
          columns:
            - { header: { zh-CN: Pod, en: Pod }, cel: 'label(row, "pod")' }
            - { header: { zh-CN: 重启, en: Restarts }, cel: last(row), unit: count }
      egress: allow
  - id: compare-restarts
    signal: restarts_total
    description: 对比本工作负载与同一命名空间中另一个工作负载（名字为 other）在窗口内的重启次数；判断问题是本工作负载特有还是命名空间里普遍发生
    args:
      type: object
      additionalProperties: false
      properties:
        other:
          { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', description: 对比的工作负载名（同一命名空间） }
        factor: { type: number, minimum: 1, maximum: 100, description: 本工作负载的重启超过对方的几倍时判为特有 }
    card:
      id: compare-restarts
      title: { zh-CN: 与另一个工作负载对比重启, en: Restarts compared with another workload }
      note:
        zh-CN: 窗口内本工作负载与 params.other 的重启次数；本工作负载有重启且超过对方的 params.factor 倍时判为本工作负载特有
        en: Restarts of this workload and params.other in the window; specific to this workload when it restarts more than params.factor times as often
      applies_to: { kinds: [Deployment, StatefulSet, DaemonSet] }
      params: { other: none, factor: 3 }
      refs:
        - { name: mine, signal: restarts_total, mode: instant }
        - { name: theirs, signal: restarts_of_other, mode: instant }
      judge:
        let:
          - { name: a, cel: sum(mine) }
          - { name: b, cel: sum(theirs) }
          - { name: other, cel: params.other }
        abnormal_if:
          - cel: a > 0.0 && a > double(params.factor) * b
            say:
              {
                zh-CN: '本工作负载重启 {a, number} 次，{other} 重启 {b, number} 次',
                en: 'This workload restarted {a, number} times and {other} {b, number} times',
              }
      display: { value: a, unit: count }
      egress: allow
