# 来源：apache/rocketmq-exporter 仓库 example.rules 中的告警名。
# 集群发送 TPS 过高的告警在上游名为 RocketMQClusterProduceHigh（example.rules 与 rocketmq_exporter_quickstart.md）；
# 曾登记的 SendTPSTooHigh 在上游规则与文档中都不存在，已改为上游的名字。
entries:
  - {
      id: rocketmq-cluster-produce-high,
      primary_card: upstream-conditions/rocketmq-cluster-produce-high/condition,
      alertname: RocketMQClusterProduceHigh,
      role: symptom,
      entity: { kind: Namespace, name_labels: [namespace] },
      chains: [rocketmq, upstream-conditions/rocketmq-cluster-produce-high],
      mixin: other,
    }
  - {
      id: rocketmq-consumer-fallen-behind,
      primary_card: rocketmq/consumer-lag,
      alertname: ConsumerFallingBehind,
      role: symptom,
      entity: { kind: Namespace, name_labels: [namespace] },
      chains: [rocketmq],
      mixin: other,
    }
  - {
      id: rocketmq-group-get-latency,
      primary_card: upstream-conditions/rocketmq-group-get-latency/condition,
      alertname: GroupGetLatencyByStoretime,
      role: symptom,
      entity: { kind: Namespace, name_labels: [namespace] },
      chains: [rocketmq, upstream-conditions/rocketmq-group-get-latency],
      mixin: other,
    }
  - {
      id: rocketmq-disk-ratio-high,
      primary_card: rocketmq/broker,
      alertname: DiskRatioTooHigh,
      role: cause,
      entity: { kind: Namespace, name_labels: [namespace] },
      chains: [rocketmq],
      mixin: other,
    }
