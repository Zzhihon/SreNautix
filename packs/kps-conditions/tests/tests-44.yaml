# 由 packages/packs-sdk/scripts/kps-conditions.ts 从 kubernetes-mixin 的 promtool 测试（Apache-2.0，提交见 upstream/kubernetes-mixin-tests.json）转换，不要手工修改。
api_version: srenautix.io/pack-test/v1
interval: 1m
input_series:
  - series: kubelet_server_expiration_renew_errors{job="kubelet",cluster="kubernetes",namespace="monitoring",node="minikube"}
    values: 0+1x20
tests:
  - name: KubeletServerCertificateRenewalErrors 在 16m 触发（tests.yaml#44）
    eval_time: 16m
    card: kubelet-server-certificate-renewal-errors/condition
    entity:
      kind: Node
      namespace: monitoring
      name: minikube
    expect:
      verdict: abnormal
