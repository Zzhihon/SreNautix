chains:
  - id: alertmanager-cluster-crashlooping
    title:
      zh-CN: 告警条件：AlertmanagerClusterCrashlooping
      en: 'Alert condition: AlertmanagerClusterCrashlooping'
    cards:
      - id: condition
        title:
          zh-CN: 告警 AlertmanagerClusterCrashlooping 的条件
          en: Condition of alert AlertmanagerClusterCrashlooping
        note:
          zh-CN: '与 kube-prometheus-stack 92.10.1 (alertmanager.rules) 中 AlertmanagerClusterCrashlooping 的表达式相同；条件持续 for: 5m 时判异常'
          en: Same expression as AlertmanagerClusterCrashlooping in kube-prometheus-stack 92.10.1 (alertmanager.rules); abnormal when it holds for 5m
        applies_to:
          kinds:
            - Service
        window:
          before: 30m
          after: 10m
        refs:
          - name: inputs
            signal: alertmanager_cluster_crashlooping.inputs
            mode: range
          - name: value_0
            signal: alertmanager_cluster_crashlooping.value
            mode: range
            empty_is: normal
          - name: held_0
            signal: alertmanager_cluster_crashlooping.held
            mode: range
            empty_is: normal
        judge:
          let:
            - name: shown_0
              cel: 'value_0.filter(s, ("service" in s.labels ? s.labels["service"] == entity.name : true))'
            - name: peak_0
              cel: 'count(shown_0) > 0 ? max(shown_0) : 0.0'
            - name: mine_0
              cel: 'held_0.filter(s, ("service" in s.labels ? s.labels["service"] == entity.name : true))'
            - name: longest_0
              cel: 'count(mine_0) > 0 ? max(mine_0) : 0.0'
          abnormal_if:
            - cel: count(inputs) > 0 && longest_0 >= 5.0
              say:
                zh-CN: 告警 AlertmanagerClusterCrashlooping 的条件持续了 5m，表达式的值最高 {peak_0, number}
                en: The condition of AlertmanagerClusterCrashlooping held for 5m, with the expression peaking at {peak_0, number}
        display:
          value: peak_0
        egress: allow
