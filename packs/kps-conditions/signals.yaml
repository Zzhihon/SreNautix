# 由 packages/packs-sdk/scripts/kps-conditions.ts 生成，不要手工修改。
signals:
  - id: alertmanager_cluster_crashlooping.inputs
    kind: metrics
    alternatives:
      - expr: count(process_start_time_seconds{job="kps-kube-prometheus-stack-alertmanager", container="alertmanager", namespace="monitoring"}) or count(up{job="kps-kube-prometheus-stack-alertmanager", container="alertmanager", namespace="monitoring"})
  - id: alertmanager_cluster_crashlooping.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            count by (namespace,service,cluster) (
              changes(process_start_time_seconds{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[10m]) > 4
            )
          /
            count by (namespace,service,cluster) (
              up{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}
            )
          )
          >= 0.5
  - id: alertmanager_cluster_crashlooping.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            count by (namespace,service,cluster) (
              changes(process_start_time_seconds{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[10m]) > 4
            )
          /
            count by (namespace,service,cluster) (
              up{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}
            )
          )
          >= 0.5
          )[5m:1m])
  - id: alertmanager_cluster_down.inputs
    kind: metrics
    alternatives:
      - expr: count(up{job="kps-kube-prometheus-stack-alertmanager", container="alertmanager", namespace="monitoring"})
  - id: alertmanager_cluster_down.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            count by (namespace,service,cluster) (
              avg_over_time(up{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[5m]) < 0.5
            )
          /
            count by (namespace,service,cluster) (
              up{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}
            )
          )
          >= 0.5
  - id: alertmanager_cluster_down.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            count by (namespace,service,cluster) (
              avg_over_time(up{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[5m]) < 0.5
            )
          /
            count by (namespace,service,cluster) (
              up{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}
            )
          )
          >= 0.5
          )[5m:1m])
  - id: alertmanager_cluster_failed_peers.inputs
    kind: metrics
    alternatives:
      - expr: count(alertmanager_cluster_failed_peers{job="kps-kube-prometheus-stack-alertmanager", container="alertmanager", namespace="monitoring"})
  - id: alertmanager_cluster_failed_peers.value
    kind: metrics
    alternatives:
      - expr: |-
          # Without max_over_time, failed scrapes could create false negatives, see
          # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
          max_over_time(alertmanager_cluster_failed_peers{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[5m]) > 0
  - id: alertmanager_cluster_failed_peers.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          # Without max_over_time, failed scrapes could create false negatives, see
          # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
          max_over_time(alertmanager_cluster_failed_peers{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[5m]) > 0
          )[15m:1m])
  - id: alertmanager_cluster_failed_to_send_alerts.1.inputs
    kind: metrics
    alternatives:
      - expr: count(alertmanager_notifications_failed_total{job="kps-kube-prometheus-stack-alertmanager", container="alertmanager", namespace="monitoring", integration=~".*"}) or count(alertmanager_notifications_total{job="kps-kube-prometheus-stack-alertmanager", container="alertmanager", namespace="monitoring", integration=~".*"})
  - id: alertmanager_cluster_failed_to_send_alerts.1.value
    kind: metrics
    alternatives:
      - expr: |-
          min by (namespace,service, integration) (
            rate(alertmanager_notifications_failed_total{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring", integration=~`.*`}[15m])
          /
            ignoring (reason) group_left rate(alertmanager_notifications_total{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring", integration=~`.*`}[15m]) > 0
          )
          > 0.01
  - id: alertmanager_cluster_failed_to_send_alerts.1.held
