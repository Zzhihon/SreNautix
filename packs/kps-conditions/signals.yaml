            max_over_time(alertmanager_cluster_members{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[5m])
          < on (namespace,service,cluster) group_left
            count by (namespace,service,cluster) (max_over_time(alertmanager_cluster_members{job="kps-kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[5m]))
