  - id: kube_cpu_overcommit.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_role{job="kube-state-metrics", role="control-plane"}) or count(kube_node_status_allocatable{job="kube-state-metrics", resource="cpu"}) or count(namespace_cpu:kube_pod_container_resource_requests:sum{})
  - id: kube_cpu_overcommit.value
    kind: metrics
    alternatives:
      - expr: |-
          # Non-HA clusters.
          (
            (
              sum by (cluster) (namespace_cpu:kube_pod_container_resource_requests:sum{})
              -
              sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"}) > 0
            )
            and
            count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
          )
          or
          # HA clusters.
          (
            sum by (cluster) (namespace_cpu:kube_pod_container_resource_requests:sum{})
            -
            (
              # Skip clusters with only one allocatable node.
              (
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
                -
                max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
              ) > 0
            ) > 0
          )
  - id: kube_cpu_overcommit.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          # Non-HA clusters.
          (
            (
              sum by (cluster) (namespace_cpu:kube_pod_container_resource_requests:sum{})
              -
              sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"}) > 0
            )
            and
            count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
          )
          or
          # HA clusters.
          (
            sum by (cluster) (namespace_cpu:kube_pod_container_resource_requests:sum{})
            -
            (
              # Skip clusters with only one allocatable node.
              (
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
                -
                max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
              ) > 0
            ) > 0
          )
          )[10m:1m])
