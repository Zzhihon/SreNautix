  - id: etcd_database_high_fragmentation_ratio.inputs
    kind: metrics
    alternatives:
      - expr: count(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}) or count(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"})
  - id: etcd_database_high_fragmentation_ratio.value
    kind: metrics
    alternatives:
      - expr: (last_over_time(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"}[5m]) / last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])) < 0.5 and etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"} > 104857600
  - id: etcd_database_high_fragmentation_ratio.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (last_over_time(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"}[5m]) / last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])) < 0.5 and etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"} > 104857600
          )[10m:1m])
