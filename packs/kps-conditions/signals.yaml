            ) or (
              kube_daemonset_status_number_available{job="kube-state-metrics", namespace=~".*"}
                !=
              kube_daemonset_status_desired_number_scheduled{job="kube-state-metrics", namespace=~".*"}
            )
          ) and (
            changes(kube_daemonset_status_updated_number_scheduled{job="kube-state-metrics", namespace=~".*"}[5m])
              ==
            0
          )
          )[15m:1m])
  - id: kube_deployment_generation_mismatch.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_deployment_metadata_generation{job="kube-state-metrics", namespace=~".*"}) or count(kube_deployment_status_observed_generation{job="kube-state-metrics", namespace=~".*"})
  - id: kube_deployment_generation_mismatch.value
    kind: metrics
    alternatives:
      - expr: |-
          kube_deployment_status_observed_generation{job="kube-state-metrics", namespace=~".*"}
            !=
          kube_deployment_metadata_generation{job="kube-state-metrics", namespace=~".*"}
  - id: kube_deployment_generation_mismatch.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          kube_deployment_status_observed_generation{job="kube-state-metrics", namespace=~".*"}
            !=
          kube_deployment_metadata_generation{job="kube-state-metrics", namespace=~".*"}
          )[15m:1m])
  - id: kube_deployment_replicas_mismatch.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~".*"}) or count(kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~".*"}) or count(kube_deployment_status_replicas_updated{job="kube-state-metrics", namespace=~".*"})
  - id: kube_deployment_replicas_mismatch.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~".*"}
              >
            kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~".*"}
          ) and (
            changes(kube_deployment_status_replicas_updated{job="kube-state-metrics", namespace=~".*"}[10m])
              ==
            0
          )
  - id: kube_deployment_replicas_mismatch.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~".*"}
              >
            kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~".*"}
          ) and (
            changes(kube_deployment_status_replicas_updated{job="kube-state-metrics", namespace=~".*"}[10m])
              ==
            0
          )
          )[15m:1m])
  - id: kube_deployment_rollout_stuck.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_deployment_status_condition{condition="Progressing", status="false", job="kube-state-metrics", namespace=~".*"})
  - id: kube_deployment_rollout_stuck.value
    kind: metrics
    alternatives:
      - expr: |-
          kube_deployment_status_condition{condition="Progressing", status="false",job="kube-state-metrics", namespace=~".*"}
          != 0
  - id: kube_deployment_rollout_stuck.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          kube_deployment_status_condition{condition="Progressing", status="false",job="kube-state-metrics", namespace=~".*"}
          != 0
          )[15m:1m])
  - id: kube_hpa_maxed_out.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}) or count(kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"}) or count(kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"})
  - id: kube_hpa_maxed_out.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
              ==
            kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
          )
          and on (namespace, horizontalpodautoscaler, cluster) (
            kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
              !=
            kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"}
          )
  - id: kube_hpa_maxed_out.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
              ==
            kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
          )
          and on (namespace, horizontalpodautoscaler, cluster) (
            kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
              !=
            kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"}
          )
          )[15m:1m])
  - id: kube_hpa_replicas_mismatch.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}) or count(kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"}) or count(kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}) or count(kube_horizontalpodautoscaler_status_desired_replicas{job="kube-state-metrics", namespace=~".*"})
  - id: kube_hpa_replicas_mismatch.value
    kind: metrics
    alternatives:
      - expr: |-
          (kube_horizontalpodautoscaler_status_desired_replicas{job="kube-state-metrics", namespace=~".*"}
            !=
          kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"})
            and
          (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
            >
          kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"})
            and
          (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
            <
          kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"})
            and
          changes(kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}[15m]) == 0
  - id: kube_hpa_replicas_mismatch.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (kube_horizontalpodautoscaler_status_desired_replicas{job="kube-state-metrics", namespace=~".*"}
            !=
          kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"})
            and
          (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
            >
          kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"})
            and
          (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
            <
          kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"})
            and
          changes(kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}[15m]) == 0
          )[15m:1m])
  - id: kube_job_failed.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_job_failed{job="kube-state-metrics", namespace=~".*"})
  - id: kube_job_failed.value
    kind: metrics
    alternatives:
      - expr: kube_job_failed{job="kube-state-metrics", namespace=~".*"}  > 0
  - id: kube_job_failed.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          kube_job_failed{job="kube-state-metrics", namespace=~".*"}  > 0
          )[15m:1m])
  - id: kube_job_not_completed.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_job_labels{job="kube-state-metrics", namespace=~".*", label_excluded_from_alerts="true"}) or count(kube_job_status_active{job="kube-state-metrics", namespace=~".*"}) or count(kube_job_status_start_time{job="kube-state-metrics", namespace=~".*"})
  - id: kube_job_not_completed.value
    kind: metrics
    alternatives:
      - expr: |-
          time() - max by (namespace, job_name, cluster) (kube_job_status_start_time{job="kube-state-metrics", namespace=~".*"}
            and
          kube_job_status_active{job="kube-state-metrics", namespace=~".*"} > 0) > 43200
            unless on (namespace, job_name, cluster)
          max by (namespace, job_name, cluster) (kube_job_labels{job="kube-state-metrics", namespace=~".*",label_excluded_from_alerts="true"} == 1)
  - id: kube_memory_overcommit.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_role{job="kube-state-metrics", role="control-plane"}) or count(kube_node_status_allocatable{job="kube-state-metrics", resource="memory"}) or count(namespace_memory:kube_pod_container_resource_requests:sum{})
  - id: kube_memory_overcommit.value
    kind: metrics
    alternatives:
      - expr: |-
          # Non-HA clusters.
          (
            (
              sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum{})
              -
              sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"}) > 0
            )
            and
            count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
          )
          or
          # HA clusters.
          (
            sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum{})
            -
            (
              # Skip clusters with only one allocatable node.
              (
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
                -
                max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
              ) > 0
            ) > 0
          )
  - id: kube_memory_overcommit.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          # Non-HA clusters.
          (
            (
              sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum{})
              -
              sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"}) > 0
            )
            and
            count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
          )
          or
          # HA clusters.
          (
            sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum{})
            -
            (
              # Skip clusters with only one allocatable node.
              (
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
                -
                max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
              ) > 0
            ) > 0
          )
          )[10m:1m])
  - id: kube_memory_quota_overcommit.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_status_allocatable{resource="memory", job="kube-state-metrics"}) or count(kube_resourcequota{job="kube-state-metrics", type="hard", resource=~"(memory|requests.memory)"})
  - id: kube_memory_quota_overcommit.value
    kind: metrics
    alternatives:
      - expr: |-
          sum by (cluster) (
            min without(resource) (kube_resourcequota{job="kube-state-metrics", type="hard", resource=~"(memory|requests.memory)"})
          )
          /
          sum by (cluster) (
            kube_node_status_allocatable{resource="memory", job="kube-state-metrics"}
          ) > 1.5
  - id: kube_memory_quota_overcommit.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          sum by (cluster) (
            min without(resource) (kube_resourcequota{job="kube-state-metrics", type="hard", resource=~"(memory|requests.memory)"})
          )
          /
          sum by (cluster) (
            kube_node_status_allocatable{resource="memory", job="kube-state-metrics"}
          ) > 1.5
          )[5m:1m])
  - id: kube_node_eviction.inputs
    kind: metrics
    alternatives:
      - expr: count(kubelet_evictions{job="kubelet", metrics_path="/metrics"}) or count(kubelet_node_name{job="kubelet", metrics_path="/metrics"})
  - id: kube_node_eviction.value
    kind: metrics
    alternatives:
      - expr: |-
          sum(rate(kubelet_evictions{job="kubelet", metrics_path="/metrics"}[15m])) by (cluster, eviction_signal, instance)
          * on (cluster, instance) group_left(node)
          max by (cluster, instance, node) (
            kubelet_node_name{job="kubelet", metrics_path="/metrics"}
          )
          > 0
  - id: kube_node_not_ready.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_spec_unschedulable{job="kube-state-metrics"}) or count(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true"})
  - id: kube_node_not_ready.value
    kind: metrics
    alternatives:
      - expr: |-
          kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true"} == 0
          and on (cluster, node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
  - id: kube_node_not_ready.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true"} == 0
          and on (cluster, node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
          )[15m:1m])
  - id: kube_node_pressure.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_spec_unschedulable{job="kube-state-metrics"}) or count(kube_node_status_condition{job="kube-state-metrics", condition=~"(MemoryPressure|DiskPressure|PIDPressure)", status="true"})
  - id: kube_node_pressure.value
    kind: metrics
    alternatives:
      - expr: |-
          kube_node_status_condition{job="kube-state-metrics",condition=~"(MemoryPressure|DiskPressure|PIDPressure)",status="true"} == 1
          and on (cluster, node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
  - id: kube_node_pressure.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          kube_node_status_condition{job="kube-state-metrics",condition=~"(MemoryPressure|DiskPressure|PIDPressure)",status="true"} == 1
          and on (cluster, node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
          )[10m:1m])
  - id: kube_node_readiness_flapping.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_spec_unschedulable{job="kube-state-metrics"}) or count(kube_node_status_condition{job="kube-state-metrics", status="true", condition="Ready"})
  - id: kube_node_readiness_flapping.value
    kind: metrics
    alternatives:
      - expr: |-
          sum(changes(kube_node_status_condition{job="kube-state-metrics",status="true",condition="Ready"}[15m])) by (cluster, node) > 2
          and on (cluster, node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
  - id: kube_node_readiness_flapping.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          sum(changes(kube_node_status_condition{job="kube-state-metrics",status="true",condition="Ready"}[15m])) by (cluster, node) > 2
          and on (cluster, node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
          )[15m:1m])
  - id: kube_node_unreachable.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_node_spec_taint{job="kube-state-metrics", key="node.kubernetes.io/unreachable", effect="NoSchedule"}) or count(kube_node_spec_taint{job="kube-state-metrics", key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn"})
  - id: kube_node_unreachable.value
    kind: metrics
    alternatives:
      - expr: (kube_node_spec_taint{job="kube-state-metrics",key="node.kubernetes.io/unreachable",effect="NoSchedule"} unless ignoring(key,value) kube_node_spec_taint{job="kube-state-metrics",key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn"}) == 1
  - id: kube_node_unreachable.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (kube_node_spec_taint{job="kube-state-metrics",key="node.kubernetes.io/unreachable",effect="NoSchedule"} unless ignoring(key,value) kube_node_spec_taint{job="kube-state-metrics",key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn"}) == 1
          )[15m:1m])
  - id: kube_pdb_not_enough_healthy_pods.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_poddisruptionbudget_status_current_healthy{job="kube-state-metrics", namespace=~".*"}) or count(kube_poddisruptionbudget_status_desired_healthy{job="kube-state-metrics", namespace=~".*"}) or count(kube_poddisruptionbudget_status_expected_pods{job="kube-state-metrics", namespace=~".*"})
  - id: kube_pdb_not_enough_healthy_pods.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            kube_poddisruptionbudget_status_desired_healthy{job="kube-state-metrics", namespace=~".*"}
            -
            kube_poddisruptionbudget_status_current_healthy{job="kube-state-metrics", namespace=~".*"}
          )
          > 0
          and
          kube_poddisruptionbudget_status_expected_pods{job="kube-state-metrics", namespace=~".*"}
          > 0
  - id: kube_pdb_not_enough_healthy_pods.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            kube_poddisruptionbudget_status_desired_healthy{job="kube-state-metrics", namespace=~".*"}
            -
            kube_poddisruptionbudget_status_current_healthy{job="kube-state-metrics", namespace=~".*"}
          )
          > 0
          and
          kube_poddisruptionbudget_status_expected_pods{job="kube-state-metrics", namespace=~".*"}
          > 0
          )[15m:1m])
  - id: kube_persistent_volume_errors.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_persistentvolume_status_phase{phase=~"Failed|Pending", job="kube-state-metrics"})
  - id: kube_persistent_volume_errors.value
    kind: metrics
    alternatives:
      - expr: kube_persistentvolume_status_phase{phase=~"Failed|Pending",job="kube-state-metrics"} > 0
  - id: kube_persistent_volume_errors.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          kube_persistentvolume_status_phase{phase=~"Failed|Pending",job="kube-state-metrics"} > 0
          )[5m:1m])
  - id: kube_persistent_volume_filling_up.1.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_persistentvolumeclaim_access_mode{access_mode="ReadOnlyMany"}) or count(kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"}) or count(kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}) or count(kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}) or count(kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"})
  - id: kube_persistent_volume_filling_up.1.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
              /
            kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
          ) < 0.03
          and
          kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"} > 0
          unless on (cluster, namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_access_mode{ access_mode="ReadOnlyMany"} == 1
          unless on (cluster, namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
  - id: kube_persistent_volume_filling_up.1.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
              /
            kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
          ) < 0.03
          and
          kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"} > 0
          unless on (cluster, namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_access_mode{ access_mode="ReadOnlyMany"} == 1
          unless on (cluster, namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
          )[1m:1m])
  - id: kube_persistent_volume_filling_up.2.inputs
    kind: metrics
    alternatives:
      - expr: count(kube_persistentvolumeclaim_access_mode{access_mode="ReadOnlyMany"}) or count(kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"}) or count(kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}) or count(kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}) or count(kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"})
  - id: kube_persistent_volume_filling_up.2.value
    kind: metrics
    alternatives:
      - expr: |-
          (
            kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
              /
            kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
          ) < 0.15
          and
          kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"} > 0
          and
          predict_linear(kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}[6h], 4 * 24 * 3600) < 0
          unless on (cluster, namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_access_mode{ access_mode="ReadOnlyMany"} == 1
          unless on (cluster, namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
  - id: kube_persistent_volume_filling_up.2.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (
            kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
              /
            kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
          ) < 0.15
          and
          kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"} > 0
          and
          predict_linear(kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}[6h], 4 * 24 * 3600) < 0
