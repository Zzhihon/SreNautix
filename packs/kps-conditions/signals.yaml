  - id: cpu_throttling_high.inputs
    kind: metrics
    alternatives:
      - expr: count(container_cpu_cfs_periods_total{job="kubelet", metrics_path="/metrics/cadvisor"}) or count(container_cpu_cfs_throttled_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor"})
  - id: cpu_throttling_high.value
    kind: metrics
    alternatives:
      - expr: |-
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(
                container_cpu_cfs_throttled_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor", }
              [5m])
            )
          )
          / on (cluster, namespace, pod, container, instance) group_left
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(
                container_cpu_cfs_periods_total{job="kubelet", metrics_path="/metrics/cadvisor", }
              [5m])
            )
          )
          > ( 25 / 100 )
  - id: cpu_throttling_high.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(
                container_cpu_cfs_throttled_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor", }
              [5m])
            )
          )
