  - id: etcd_excessive_database_growth.value
    kind: metrics
    alternatives:
      - expr: predict_linear(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[4h], 4*60*60) > etcd_server_quota_backend_bytes{job=~".*etcd.*"}
  - id: etcd_excessive_database_growth.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          predict_linear(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[4h], 4*60*60) > etcd_server_quota_backend_bytes{job=~".*etcd.*"}
