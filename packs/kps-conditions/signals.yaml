  - id: etcd_database_quota_low_space.value
    kind: metrics
    alternatives:
      - expr: (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]) / last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))*100 > 95
  - id: etcd_database_quota_low_space.held
    kind: metrics
    unit: count
    alternatives:
      - expr: |-
          count_over_time((
          (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]) / last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))*100 > 95
          )[10m:1m])
  - id: etcd_excessive_database_growth.inputs
