# 构建并推送一个多架构镜像，cosign 无密钥签名，附加 SPDX 与 CycloneDX SBOM 证明和构建溯源（由 release.yml 调用）。
# 签名证书的主体是本工作流：https://github.com/Zzhihon/SreNautix/.github/workflows/image.yml@<ref>
name: image

on:
  workflow_call:
    inputs:
      name:
        description: 镜像名（ghcr.io/zzhihon/<name>）
        required: true
        type: string
      dockerfile:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    env:
      IMAGE: ghcr.io/zzhihon/${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 读取提交时间作为 SOURCE_DATE_EPOCH
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算标签
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送（linux/amd64、linux/arm64）
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=image,rewrite-timestamp=true
          provenance: mode=max
          sbom: false
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,scope=${{ inputs.name }},mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # 构建可复现：同一份源码得到同一个 digest，Rekor 会拒绝重复的签名记录。
      # digest 已有本工作流在同一 ref 上的有效签名时跳过签名与证明。
      - name: 检查 digest 是否已签名
        id: signed
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}
        run: |
          if cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" "$REF" >/dev/null 2>&1; then
            echo "$REF 已有有效签名，跳过签名与 SBOM 证明"
            echo "done=true" >>"$GITHUB_OUTPUT"
          else
            echo "done=false" >>"$GITHUB_OUTPUT"
          fi

      - name: cosign 无密钥签名
        if: steps.signed.outputs.done != 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: 生成 SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 生成 CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 以 cosign 证明附加两种 SBOM
        if: steps.signed.outputs.done != 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - name: 签名与证明可以校验
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}
        run: |
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" "$REF" >/dev/null
          for type in spdxjson cyclonedx; do
            cosign verify-attestation --type "$type" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$IDENTITY" "$REF" >/dev/null
          done

      - name: GitHub 构建溯源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: 保存 SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.name }}
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error
