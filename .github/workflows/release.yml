# 发布：构建并推送两个多架构镜像与 Helm chart（OCI），全部 cosign 签名。
# 触发：v* tag；每 30 分钟发布一次 main 的最新提交（该提交的 chart 已发布、或 ci 未成功完成时跳过）；手动 workflow_dispatch。
# main 的推送频率高于一次发布的耗时，按推送触发会让排队中的运行不断被替换，所以不按推送触发。
# 标签：镜像 sha-<短 SHA>，tag 上另加 <版本> 与 <主>.<次>；
# chart 在 main 上为 <Chart.version>-main.<提交时间 UTC，年月日时分秒>.g<短 SHA>（同一提交的版本号固定），tag 上为 <版本>。
name: release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      hub: ${{ steps.detect.outputs.hub }}
      spoke: ${{ steps.detect.outputs.spoke }}
      chart_version: ${{ steps.version.outputs.chart }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检查两个镜像的源码是否已在仓库中
        id: detect
        run: |
          # 中心镜像包含 server/worker/mcp、内置领域包与控制台，三者都在仓库中才构建
          hub=false
          if [[ -f apps/srenautix/package.json && -d packs && -f web/console/package.json ]]; then hub=true; fi
          echo "hub=$hub" >>"$GITHUB_OUTPUT"
          echo "spoke=$([[ -d cmd/srenautix-spoke ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      - name: 计算 chart 版本
        id: version
        run: |
          base=$(yq '.version' deploy/helm/srenautix/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            chart_version="${GITHUB_REF_NAME#v}"
          else
            stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
            chart_version="${base}-main.${stamp}.g${GITHUB_SHA::7}"
          fi
          echo "chart=$chart_version" >>"$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # 定时运行时，main 的最新提交已经发布过（chart 已存在），或者该提交的 ci 没有成功完成（失败、取消或仍在运行），
      # 就不构建；ci 仍在运行的提交由下一次定时运行发布。tag 与手动触发不做这两项检查
      - name: 检查本提交是否已发布、ci 是否通过
        id: published
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            ci=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --commit "$GITHUB_SHA" --event push \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            if helm show chart oci://ghcr.io/zzhihon/charts/srenautix --version "$CHART_VERSION" >/dev/null 2>&1; then
              echo "chart ${CHART_VERSION} 已发布，跳过"
              skip=true
            elif [[ "$ci" != "completed success" ]]; then
              echo "${GITHUB_SHA::7} 的 ci 为 ${ci:-无运行}，跳过"
              skip=true
            fi
          fi
          echo "published=$skip" >>"$GITHUB_OUTPUT"

  hub:
    needs: detect
    if: needs.detect.outputs.hub == 'true' && needs.detect.outputs.published != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      name: srenautix
      dockerfile: deploy/docker/srenautix.Dockerfile

  spoke:
    needs: detect
    if: needs.detect.outputs.spoke == 'true' && needs.detect.outputs.published != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      name: srenautix-spoke
      dockerfile: deploy/docker/srenautix-spoke.Dockerfile

  chart:
    needs: [detect, hub, spoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      CHART_REPO: oci://ghcr.io/zzhihon/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: chart 与镜像的版本
        id: version
        env:
          IMAGE_VERSION: ${{ needs.hub.outputs.version }}
          SPOKE_VERSION: ${{ needs.spoke.outputs.version }}
          CHART_VERSION: ${{ needs.detect.outputs.chart_version }}
        run: |
          if [[ "$IMAGE_VERSION" != "$SPOKE_VERSION" ]]; then
            echo "两个镜像的版本不一致：$IMAGE_VERSION / $SPOKE_VERSION" >&2
            exit 1
          fi
          echo "chart=$CHART_VERSION" >>"$GITHUB_OUTPUT"
          echo "app=$IMAGE_VERSION" >>"$GITHUB_OUTPUT"

      # appVersion 指向本次构建的镜像标签；注解 srenautix.io/code-sha 是镜像的构建提交，worker 写进研判清单
      - name: 打包 chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          yq -i ".annotations.\"srenautix.io/code-sha\" = \"${GITHUB_SHA}\"" deploy/helm/srenautix/Chart.yaml
          helm package deploy/helm/srenautix --version "$CHART_VERSION" --app-version "$APP_VERSION" -d dist
          helm show chart "dist/srenautix-${CHART_VERSION}.tgz" | yq -e ".annotations.\"srenautix.io/code-sha\" == \"${GITHUB_SHA}\""

      - name: 推送 chart 并签名
        id: push
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm push "dist/srenautix-${CHART_VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(awk '/^Digest:/ {print $2}' push.log)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "helm push 没有输出 digest" >&2
            exit 1
          fi
          .github/scripts/cosign-sign-attest.sh "ghcr.io/zzhihon/charts/srenautix@${digest}" \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: chart 构建溯源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/zzhihon/charts/srenautix
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: 汇总
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          HUB_DIGEST: ${{ needs.hub.outputs.digest }}
          SPOKE_DIGEST: ${{ needs.spoke.outputs.digest }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          {
            echo "### 发布结果"
            echo
            echo "| 制品 | 引用 |"
            echo "|---|---|"
            echo "| 中心镜像 | \`ghcr.io/zzhihon/srenautix:${APP_VERSION}@${HUB_DIGEST}\` |"
            echo "| 分支镜像 | \`ghcr.io/zzhihon/srenautix-spoke:${APP_VERSION}@${SPOKE_DIGEST}\` |"
            echo "| chart | \`oci://ghcr.io/zzhihon/charts/srenautix\` ${CHART_VERSION} @ \`${CHART_DIGEST}\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  offline-bundle:
    needs: [hub, spoke, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 构建离线包
        env:
          VERSION: ${{ needs.hub.outputs.version }}
        run: deploy/offline/build-bundle.sh "$VERSION" dist/offline
      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/offline/*.tar
          fail_on_unmatched_files: true
