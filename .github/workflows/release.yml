# 发布：main 上的每个提交与 v* tag 都构建并推送两个多架构镜像与 Helm chart（OCI），全部 cosign 签名。
# 标签：镜像 sha-<短 SHA>，tag 上另加 <版本> 与 <主>.<次>；chart 在 main 上为 <Chart.version>-main.<序号>.g<短 SHA>，tag 上为 <版本>。
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      hub: ${{ steps.detect.outputs.hub }}
      spoke: ${{ steps.detect.outputs.spoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检查两个镜像的源码是否已在仓库中
        id: detect
        run: |
          # 中心镜像包含 server/worker/mcp、内置领域包与控制台，三者都在仓库中才构建
          hub=false
          if [[ -f apps/srenautix/package.json && -d packs && -f web/console/package.json ]]; then hub=true; fi
          echo "hub=$hub" >>"$GITHUB_OUTPUT"
          echo "spoke=$([[ -d cmd/srenautix-spoke ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  hub:
    needs: detect
    if: needs.detect.outputs.hub == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      name: srenautix
      dockerfile: deploy/docker/srenautix.Dockerfile

  spoke:
    needs: detect
    if: needs.detect.outputs.spoke == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      name: srenautix-spoke
      dockerfile: deploy/docker/srenautix-spoke.Dockerfile

  chart:
    needs: [hub, spoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      CHART_REPO: oci://ghcr.io/zzhihon/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 计算 chart 版本
        id: version
        env:
          IMAGE_VERSION: ${{ needs.hub.outputs.version }}
          SPOKE_VERSION: ${{ needs.spoke.outputs.version }}
        run: |
          if [[ "$IMAGE_VERSION" != "$SPOKE_VERSION" ]]; then
            echo "两个镜像的版本不一致：$IMAGE_VERSION / $SPOKE_VERSION" >&2
            exit 1
          fi
          base=$(yq '.version' deploy/helm/srenautix/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            chart_version="${GITHUB_REF_NAME#v}"
          else
            chart_version="${base}-main.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
          fi
          echo "chart=$chart_version" >>"$GITHUB_OUTPUT"
          echo "app=$IMAGE_VERSION" >>"$GITHUB_OUTPUT"

      - name: 打包 chart（appVersion 指向本次构建的镜像标签）
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          helm package deploy/helm/srenautix --version "$CHART_VERSION" --app-version "$APP_VERSION" -d dist

      - name: 推送 chart 并签名
        id: push
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm push "dist/srenautix-${CHART_VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(awk '/^Digest:/ {print $2}' push.log)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "helm push 没有输出 digest" >&2
            exit 1
          fi
          ref="ghcr.io/zzhihon/charts/srenautix@${digest}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          # 同一个 digest 已有本工作流的有效签名时不再签名（Rekor 拒绝重复记录）
          if cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" "$ref" >/dev/null 2>&1; then
            echo "$ref 已有有效签名"
          else
            cosign sign --yes "$ref"
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: chart 构建溯源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/zzhihon/charts/srenautix
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: 汇总
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          HUB_DIGEST: ${{ needs.hub.outputs.digest }}
          SPOKE_DIGEST: ${{ needs.spoke.outputs.digest }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          {
            echo "### 发布结果"
            echo
            echo "| 制品 | 引用 |"
            echo "|---|---|"
            echo "| 中心镜像 | \`ghcr.io/zzhihon/srenautix:${APP_VERSION}@${HUB_DIGEST}\` |"
            echo "| 分支镜像 | \`ghcr.io/zzhihon/srenautix-spoke:${APP_VERSION}@${SPOKE_DIGEST}\` |"
            echo "| chart | \`oci://ghcr.io/zzhihon/charts/srenautix\` ${CHART_VERSION} @ \`${CHART_DIGEST}\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  offline-bundle:
    needs: [hub, spoke, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 构建离线包
        env:
          VERSION: ${{ needs.hub.outputs.version }}
        run: deploy/offline/build-bundle.sh "$VERSION" dist/offline
      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/offline/*.tar
          fail_on_unmatched_files: true
