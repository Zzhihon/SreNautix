# 在 Kind 上拉起完整环境（kube-prometheus-stack、Loki、Tempo、本地 Git 服务 gitlocal 与 Argo CD、演示业务与背景噪声、
# 本次提交在本地构建的 SreNautix，见 .github/actions/kind-env），注入级联故障场景：确认预期告警出现；声明了 SRENAUTIX_ROOT
# 的场景再检查事件收敛与根因、证据卡与阶段 B 结论（模型响应来自 llm-replay 的录制）、gitlocal 上的 srenautix/* 修复 PR 与
# issue 关联、main 没有被机器人改动；最后恢复。发布门禁不包含这个工作流。
#
# 每个场景在自己的 Kind 集群中运行（矩阵）。SreNautix 把 30 分钟内（时间相邻与变更窗口，core 的 rca-params 默认值）沿拓扑
# 或同一次变更相连的告警归为一个事件；同一集群中相隔几分钟的场景会被归进上一个场景的事件，只有独立的集群能隔离场景。
# 只需运行一次的检查（环境拉起、不变量 12）在单独的 job 中。
name: kind-e2e

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 以空格分隔的场景名；为空时运行全部
        required: false
        default: ""
  schedule:
    - cron: "17 19 * * *"
  push:
    branches: [main]
    paths:
      - deploy/kind/**
      - deploy/helm/**
      - eval/scenarios/**
      - .github/actions/kind-env/**
      - .github/workflows/kind-e2e.yml

permissions:
  contents: read

# 一次完整运行约一小时；main 上的新提交排队等待，不打断进行中的场景
concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
      known_gaps: ${{ steps.list.outputs.known_gaps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: 场景清单
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          all=$(deploy/kind/scenario.sh list)
          read -ra names <<<"${SCENARIOS:-$(tr '\n' ' ' <<<"$all")}"
          ((${#names[@]} > 0)) || { echo "::error::场景清单为空"; exit 1; }
          for s in "${names[@]}"; do
            grep -qxF "$s" <<<"$all" || { echo "::error::没有场景 $s（可选：$(tr '\n' ' ' <<<"$all")）"; exit 1; }
          done
          echo "scenarios=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"
          # 已知缺口（场景脚本的 KNOWN_GAP）：照常运行，失败时只留下警告，不让整次运行判红
          echo "known_gaps=$(deploy/kind/scenario.sh known-gaps | cut -f1 | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"

  # 环境拉起本身（kind-env 中 up.sh 的各项就绪检查）与不变量 12（自愈 PR 的补偿控制）；
  # 不变量 12 对 Kind 中真实 bare 仓库的 gitlocal-invariants 运行，集群一侧用 envtest
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kind-env
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gateway 测试环境另需对象锁定的 MinIO（审计汇）与 Prometheus（执行后校验）；通过 GITHUB_ENV 导出 SRENAUTIX_TEST_BIN、SRENAUTIX_MINIO_BIN
      - name: 安装测试用的 Prometheus、MinIO 等
        run: .github/scripts/install-test-binaries.sh "$RUNNER_TEMP/testbin"
      - name: 不变量 12：gitops_pr 只推 srenautix/*、核对 refs、从不合并、限速、main watchdog（本地 Git 服务）
        run: |
          # make envtest-assets 的最后一行输出是 envtest 二进制所在目录
          assets=$(make -s envtest-assets | tail -1)
          kubectl --context kind-srenautix -n gitlocal port-forward svc/gitlocal-invariants 13000:3000 >"$RUNNER_TEMP/pf.log" 2>&1 &
          pf=$!
          trap 'kill $pf' EXIT
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:13000/healthz >/dev/null 2>&1 && break; sleep 1; done
          KUBEBUILDER_ASSETS="$assets" SRENAUTIX_TEST_GITHUB_API=http://127.0.0.1:13000 \
            go test -count=1 -timeout 20m -run TestInvariant12 ./test/invariants/

  scenario:
    name: scenario (${{ matrix.scenario }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # 单个场景约 25–35 分钟（环境拉起约 10 分钟）；11 个场景分两批，整轮约 70 分钟，同时占用的 runner 不超过 7 个（含 invariants）
      max-parallel: 6
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kind-env
      - name: 运行场景（含 SreNautix 的发现、分析与自愈 PR）
        id: run
        # 已知缺口的场景失败时不让 job 失败，下一步留下警告；其余场景的断言照常判定
        continue-on-error: ${{ contains(fromJSON(needs.plan.outputs.known_gaps), matrix.scenario) }}
        env:
          SCENARIO: ${{ matrix.scenario }}
          SCENARIO_STATE_DIR: ${{ runner.temp }}/scenarios
          SRENAUTIX_CHECKS: "1"
          HOLD: "120"
        run: deploy/kind/scenario.sh run "$SCENARIO"
      - name: 已知缺口
        if: steps.run.outcome == 'failure' && steps.run.conclusion == 'success'
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          gap=$(deploy/kind/scenario.sh known-gaps | awk -F '\t' -v s="$SCENARIO" '$1 == s { print $2 }')
          echo "::warning title=已知缺口 ${SCENARIO}::场景失败，按已知缺口处理：${gap}"
      - name: 收集诊断信息
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          kubectl --context kind-srenautix get nodes,pods -A -o wide >"$RUNNER_TEMP/diag/pods.txt" 2>&1 || true
          kubectl --context kind-srenautix get events -A --sort-by=.lastTimestamp >"$RUNNER_TEMP/diag/events.txt" 2>&1 || true
          kubectl --context kind-srenautix -n srenautix logs -l app.kubernetes.io/part-of=srenautix --all-containers --tail=500 >"$RUNNER_TEMP/diag/srenautix.log" 2>&1 || true
          kubectl --context kind-srenautix -n srenautix logs deploy/llm-replay --tail=500 >"$RUNNER_TEMP/diag/llm-replay.log" 2>&1 || true
          kubectl --context kind-srenautix -n gitlocal logs deploy/gitlocal --tail=500 >"$RUNNER_TEMP/diag/gitlocal.log" 2>&1 || true
          kubectl --context kind-srenautix get --raw /api/v1/namespaces/gitlocal/services/gitlocal:3000/proxy/_test/state >"$RUNNER_TEMP/diag/gitlocal-state.json" 2>&1 || true
          kubectl --context kind-srenautix -n argocd get applications -o yaml >"$RUNNER_TEMP/diag/argocd-applications.yaml" 2>&1 || true
          # 收集时刻 Prometheus 的全部告警（带完整标签，包括 srenautix_self）与最近 6 小时出现过的告警名、命名空间
          kubectl --context kind-srenautix get --raw /api/v1/namespaces/monitoring/services/kps-prometheus:9090/proxy/api/v1/alerts >"$RUNNER_TEMP/diag/alerts.json" 2>&1 || true
          kubectl --context kind-srenautix get --raw "/api/v1/namespaces/monitoring/services/kps-prometheus:9090/proxy/api/v1/query?query=$(jq -rn '"count by (alertname, namespace, alertstate, srenautix_self) (max_over_time(ALERTS[6h]))"|@uri')" >"$RUNNER_TEMP/diag/alerts-6h.json" 2>&1 || true
          kubectl --context kind-srenautix -n srenautix logs deploy/srenautix-server --tail=2000 >"$RUNNER_TEMP/diag/server.log" 2>&1 || true
          # 自愈 PR 的决策（跳过与失败只记在库里）、研判与事件版本：经 CNPG 实例本地的 psql 读取，只读
          kubectl --context kind-srenautix -n srenautix exec srenautix-pg-1 -c postgres -- psql -d srenautix -X -A -F $'\t' -c "
            SELECT 'attempt', created_at, run_id, incident_id, incident_version, outcome, code, retries, category, key, reason FROM server.remediation_attempts ORDER BY created_at;
            SELECT 'run', started_at, finished_at, run_id, incident_id, incident_version, state, conclusion_level, disposition, root_component FROM server.research_runs ORDER BY started_at;
            SELECT 'incident', updated_at, incident_id, version, state, suppressed, body->'root'->>'component' FROM server.incidents ORDER BY updated_at;" \
            >"$RUNNER_TEMP/diag/remediation.tsv" 2>&1 || true
          # 事件的成员与关联变更、入库告警的实体解析：判断是哪条规则把告警并入事件
          kubectl --context kind-srenautix -n srenautix exec srenautix-pg-1 -c postgres -- psql -d srenautix -X -A -F $'\t' -c "
            SELECT 'member', i.incident_id, i.version, i.root_component, m->>'alert_id', m->>'alertname', m->>'component', m->>'role',
                   m->>'starts_at', m->>'joined_version', m->>'left_version'
              FROM server.incidents i, jsonb_array_elements(i.body->'members') m ORDER BY i.incident_id, (m->>'joined_version')::int;
            SELECT 'change', incident_id, version, c->>'change_id', c->>'time', c->'targets'
              FROM server.incidents, jsonb_array_elements(body->'changes') c;
            SELECT 'alert', alert_id, alertname, status, starts_at, ends_at, entity_resolution, component, entity, labels
              FROM server.alert_state ORDER BY starts_at;" \
            >"$RUNNER_TEMP/diag/incident-members.tsv" 2>&1 || true
          # 每个事件版本的阶段 A 证据卡判定：修复模板按卡片判断是否适用，没有被尝试时看这里
          kubectl --context kind-srenautix -n srenautix exec srenautix-pg-1 -c postgres -- psql -d srenautix -X -A -F $'\t' -c "
            SELECT 'card', s.incident_id, s.incident_version, s.rendered_at, c->>'card_id', c->'entity'->>'kind',
                   c->'entity'->>'name', c->>'verdict', c->'reason'->>'text'
              FROM server.stage_a_reports s, jsonb_array_elements(s.body->'cards') c
             ORDER BY s.incident_id, s.incident_version, c->>'card_id';" \
            >"$RUNNER_TEMP/diag/stage-a-cards.tsv" 2>&1 || true
          cp -R "$RUNNER_TEMP/scenarios" "$RUNNER_TEMP/diag/" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kind-e2e-diagnostics-${{ matrix.scenario }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore
