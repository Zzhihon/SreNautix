# 每个 PR 与 main 上的提交：TS 与 Go 的检查和测试、契约生成检查、依赖漏洞门禁、chart 检查、工作流检查、镜像构建检查。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.1
  HELM_UNITTEST_VERSION: v1.2.1
  HELM_UNITTEST_SHA256: 48e86ecc1467b009630e5954375e5d8494139f73b466df5fe8c04fa45b634939
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # deploy/kind/versions.env 中 KIND_VERSION 对应的 kind-linux-amd64
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # Grafana 插件 e2e 使用的官方发行包（grafana-<版本>.linux-amd64.tar.gz）
  GRAFANA_VERSION: 13.2.4
  GRAFANA_SHA256: c48765988fd88572607e4ea670251af8a8e64ab3e360d0f3cf67a6f3587b92ab
  PROMETHEUS_VERSION: 3.15.0
  PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  OSV_SCANNER_VERSION: v2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      ts: ${{ steps.detect.outputs.ts }}
      go: ${{ steps.detect.outputs.go }}
      hub: ${{ steps.detect.outputs.hub }}
      spoke: ${{ steps.detect.outputs.spoke }}
      console_e2e: ${{ steps.detect.outputs.console_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检查仓库中已有的部分
        id: detect
        run: |
          has() { [[ -e "$1" ]] && echo true || echo false; }
          # 中心镜像包含 server/worker/mcp、内置领域包与控制台，三者都在仓库中才构建
          hub=false
          if [[ -f apps/srenautix/package.json && -d packs && -f web/console/package.json ]]; then hub=true; fi
          {
            echo "ts=$(has pnpm-lock.yaml)"
            echo "go=$(has go.mod)"
            echo "hub=$hub"
            echo "spoke=$(has cmd/srenautix-spoke)"
            echo "console_e2e=$(has web/console/playwright.config.ts)"
          } >>"$GITHUB_OUTPUT"

  ts:
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # integration-sdk 把 PromQL 与 MetricsQL 解析器编译成 wasm，Go 版本取根目录 go.mod 的 toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: 确认依赖安装脚本有白名单
        run: |
          yq -e '.onlyBuiltDependencies | length > 0' pnpm-workspace.yaml
      - name: 安装依赖（冻结锁文件）
        run: pnpm install --frozen-lockfile
      - name: 安装测试用的 Prometheus、Alertmanager、VictoriaMetrics、MinIO、PostgreSQL
        run: .github/scripts/install-test-binaries.sh "$RUNNER_TEMP/testbin"
      # apps/srenautix 的拓扑测试用真实的 kube-apiserver 与 etcd，测试代码在 .envtest/k8s 中查找
      - name: 下载 envtest（kube-apiserver、etcd）
        if: needs.detect.outputs.go == 'true'
        run: make envtest-assets
      # packs-sdk 与 integration-sdk 按 backends.json（固定版本与 sha256）下载测试后端到 .scratch/backends
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('packages/integration-sdk/backends.json') != ''
        with:
          path: .scratch/backends
          key: test-backends-${{ runner.os }}-${{ hashFiles('packages/integration-sdk/backends.json') }}
      - name: lint
        run: pnpm lint
      - name: 契约生成结果与仓库一致
        run: pnpm contract:check
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            echo "以下文件未经 gofmt：" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      # 安装后通过 GITHUB_ENV 导出 SRENAUTIX_TEST_BIN、SRENAUTIX_MINIO_BIN、SRENAUTIX_PG_BIN 给后续步骤
      - name: 安装测试用的 Prometheus、Alertmanager、VictoriaMetrics、MinIO、PostgreSQL
        run: .github/scripts/install-test-binaries.sh "$RUNNER_TEMP/testbin"
      # go-test 依次执行 go vet、生成结果检查与 envtest 测试（见 Makefile）
      - name: go vet 与 envtest 测试
        run: make go-test
      - name: 生成结果与仓库一致
        run: |
          if grep -qE '^generate-check:' Makefile; then
            make generate-check
          else
            echo "Makefile 中还没有 generate-check 目标"
          fi

  vuln:
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod 的 toolchain 指令决定 Go 版本，与发布镜像的构建版本相同（workflows 任务检查）
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - name: govulncheck
        if: needs.detect.outputs.go == 'true'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: osv-scanner（pnpm-lock.yaml、go.mod）
        run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner
          lockfiles=()
          for f in pnpm-lock.yaml go.mod; do
            [[ -f "$f" ]] && lockfiles+=(--lockfile "$f")
          done
          ./osv-scanner scan source "${lockfiles[@]}"

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: 安装 helm-unittest 与 kubeconform（校验 sha256）
        run: |
          plugin_dir="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin_dir" "$HOME/.local/bin"
          ver=${HELM_UNITTEST_VERSION#v}
          curl -fsSLo unittest.tgz "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${ver}.tgz"
          echo "${HELM_UNITTEST_SHA256}  unittest.tgz" | sha256sum --check
          tar -xzf unittest.tgz -C "$plugin_dir"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar -xzf kubeconform.tgz -C "$HOME/.local/bin" kubeconform
          curl -fsSLo prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tgz" | sha256sum --check
          tar -xzf prometheus.tgz -C "$HOME/.local/bin" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          helm unittest --help >/dev/null
      - name: lint、渲染校验与 helm-unittest
        run: deploy/helm/check.sh

  # 控制台与 Grafana 插件的 Playwright e2e（ADR 0073）：真实的 server、一次性 PostgreSQL、envtest、
  # OIDC 身份源与 Grafana 官方发行包；种子数据只经真实接口写入
  e2e:
    needs: detect
    if: needs.detect.outputs.console_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 安装依赖（冻结锁文件）
        run: pnpm install --frozen-lockfile
      - name: 安装测试用的 PostgreSQL 与其他服务二进制
        run: .github/scripts/install-test-binaries.sh "$RUNNER_TEMP/testbin"
      - name: 下载 envtest（kube-apiserver、etcd）
        run: make envtest-assets
      - name: 安装 Chromium 的系统依赖
        run: pnpm --filter @srenautix/console exec playwright install-deps chromium
      - name: 控制台 e2e
        run: pnpm --filter @srenautix/console e2e
      - name: 安装 Grafana（官方发行包，校验 sha256）
        if: hashFiles('plugins/grafana-app/playwright.config.ts') != ''
        run: |
          curl -fsSLo grafana.tgz "https://dl.grafana.com/oss/release/grafana-${GRAFANA_VERSION}.linux-amd64.tar.gz"
          echo "${GRAFANA_SHA256}  grafana.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/grafana"
          tar -xzf grafana.tgz -C "$RUNNER_TEMP/grafana" --strip-components=1
          rm grafana.tgz
          echo "SRENAUTIX_GRAFANA_HOME=$RUNNER_TEMP/grafana" >>"$GITHUB_ENV"
      - name: Grafana 插件 e2e
        if: hashFiles('plugins/grafana-app/playwright.config.ts') != ''
        run: |
          pnpm --filter @srenautix/grafana-app build
          pnpm --filter @srenautix/grafana-app e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: |
            .scratch/console-e2e/results
            .scratch/grafana-e2e/results
          if-no-files-found: ignore

  # 用各角色自己的配置解析代码校验 chart 生成的五份 config.yaml
  role-configs:
    needs: detect
    if: needs.detect.outputs.hub == 'true' && needs.detect.outputs.spoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: 安装依赖（冻结锁文件）
        run: pnpm install --frozen-lockfile
      - name: 各角色解析 chart 生成的配置
        run: deploy/helm/check-role-configs.sh

  # 安装测试：在 Kind 上用 values-standard.yaml 实际安装本次提交构建的两个镜像，要求全部 Pod Ready、gateway 准入自检通过
  install-e2e:
    needs: detect
    if: needs.detect.outputs.hub == 'true' && needs.detect.outputs.spoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 构建中心镜像（linux/amd64，载入本地）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/srenautix.Dockerfile
          platforms: linux/amd64
          load: true
          tags: srenautix.local/srenautix:e2e
          cache-from: type=gha,scope=srenautix
      - name: 构建分支镜像（linux/amd64，载入本地）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/srenautix-spoke.Dockerfile
          platforms: linux/amd64
          load: true
          tags: srenautix.local/srenautix-spoke:e2e
          cache-from: type=gha,scope=srenautix-spoke
      - name: 安装 kind（校验 sha256）
        run: |
          source deploy/kind/versions.env
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $HOME/.local/bin/kind" | sha256sum --check
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: 安装并等待全部 Pod Ready
        env:
          SKIP_BUILD: "1"
        run: deploy/helm/install-e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: install-e2e-diagnostics
          path: .scratch/install-e2e
          if-no-files-found: ignore

  # 在真实的 kube-apiserver 上对每份 values 做 server-side dry-run（准入策略、CEL、RBAC 的完整校验）
  helm-server-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: 创建单节点 Kind 集群（版本见 deploy/kind/versions.env）
        run: |
          source deploy/kind/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          chmod +x kind
          ./kind create cluster --name dry-run --image "$KIND_NODE_IMAGE" --wait 120s
      - name: server-side dry-run
        run: deploy/helm/server-dry-run.sh

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 actionlint 与 shellcheck（校验 sha256）
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check
          tar -xzf actionlint.tgz actionlint
          curl -fsSLo shellcheck.txz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.txz" | sha256sum --check
          tar -xJf shellcheck.txz --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
      - name: actionlint（含工作流内的 shell）
        run: ./actionlint -shellcheck ./shellcheck
      - name: 所有 action 都按提交 SHA 固定
        run: |
          if grep -rnE '^\s*-?\s*uses:\s*[^.][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "上面的 action 没有按 40 位提交 SHA 固定" >&2
            exit 1
          fi
      - name: 镜像的 Go 版本与 go.mod 的 toolchain 一致
        if: hashFiles('go.mod') != ''
        run: |
          want=$(awk '$1 == "toolchain" {sub(/^go/, "", $2); print $2}' go.mod)
          for f in deploy/docker/srenautix-spoke.Dockerfile deploy/docker/srenautix.Dockerfile deploy/docker/gitlocal.Dockerfile; do
            got=$(grep -oE 'golang:[0-9]+\.[0-9]+\.[0-9]+' "$f" | head -1 | cut -d: -f2)
            if [[ -z "$want" || "$want" != "$got" ]]; then
              echo "go.mod 的 toolchain（${want:-缺失}）与 $f 的 golang 镜像（${got}）不一致" >&2
              exit 1
            fi
          done
      - name: Kind 场景与标准答案一致，并满足 EvalTruth
        run: deploy/kind/check-scenarios.sh
      - name: shellcheck（deploy/ 与 .github/scripts/ 下的脚本）
        run: git ls-files 'deploy/**/*.sh' '.github/scripts/*.sh' | xargs ./shellcheck -x

  images:
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: srenautix
            dockerfile: deploy/docker/srenautix.Dockerfile
            present: hub
          - name: srenautix-spoke
            dockerfile: deploy/docker/srenautix-spoke.Dockerfile
            present: spoke
          # Kind 端到端的本地 Git 服务（只用于测试，不发布）
          - name: gitlocal
            dockerfile: deploy/docker/gitlocal.Dockerfile
            present: spoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect.outputs[matrix.present] == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.detect.outputs[matrix.present] == 'true'
      - name: 构建镜像（不推送）
        if: needs.detect.outputs[matrix.present] == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
