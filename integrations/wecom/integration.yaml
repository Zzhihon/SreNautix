api_version: srenautix.io/integration/v1
id: wecom
display_name: 企业微信
category: notify
direction: notify
tier: official_candidate
contract: notify/v1
capabilities:
  - { name: notify.send, stability: beta }
  - { name: notify.edit, stability: alpha }
  - { name: notify.callback_verify, stability: alpha }
  - { name: notify.link, stability: alpha }
tested_versions:
  - { backend: wecom-api, versions: ['cgi-bin'], verification: recorded_fixtures }
config_schema:
  type: object
  additionalProperties: false
  required: [corp_id, agent_id, secret_file, chats]
  properties:
    corp_id: { type: string }
    agent_id: { type: integer }
    secret_file: { type: string, x-srenautix-secret-ref: true }
    callback_token_file: { type: string, x-srenautix-secret-ref: true }
    callback_aes_key_file: { type: string, x-srenautix-secret-ref: true }
    chats: { type: array, minItems: 1, items: { type: string }, description: 群聊 chatid 列表 }
required_scopes:
  - 'wecom:应用消息发送、模板卡片更新'
owner: srenautix-maintainers
