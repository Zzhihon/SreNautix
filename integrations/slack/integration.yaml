api_version: srenautix.io/integration/v1
id: slack
display_name: Slack
category: notify
direction: notify
tier: official_candidate
contract: notify/v1
capabilities:
  - { name: notify.send, stability: beta }
  - { name: notify.edit, stability: beta }
  - { name: notify.callback_verify, stability: beta }
  - { name: notify.link, stability: alpha }
tested_versions:
  - { backend: slack-web-api, versions: ['chat.postMessage', 'chat.update'], verification: recorded_fixtures }
config_schema:
  type: object
  additionalProperties: false
  required: [bot_token_file, signing_secret_file, channels]
  properties:
    bot_token_file: { type: string, x-srenautix-secret-ref: true }
    signing_secret_file: { type: string, x-srenautix-secret-ref: true }
    channels: { type: array, minItems: 1, items: { type: string } }
required_scopes:
  - 'slack:chat:write'
owner: srenautix-maintainers
