# 配置即 server 配置的 notify.telegram 段。
api_version: srenautix.io/integration/v1
id: telegram
display_name: Telegram
category: approve
direction: approve
tier: core
contract: approve/v1
capabilities:
  - { name: notify.send, stability: stable }
  - { name: notify.edit, stability: stable }
  - { name: notify.callback_verify, stability: stable }
  - { name: notify.link, stability: stable }
  - { name: approve.l_tier, stability: beta }
tested_versions:
  - { backend: telegram-bot-api, versions: ['9'], verification: recorded_fixtures }
  - { backend: telegram-bot-api, versions: ['9'], verification: live_smoke }
config_schema:
  type: object
  additionalProperties: false
  required: [bot_token_file, chats]
  properties:
    enabled: { type: boolean, default: false }
    bot_token_file: { type: string, x-srenautix-secret-ref: true }
    api_base: { type: string, format: uri, default: 'https://api.telegram.org' }
    chats:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [id]
        properties:
          id: { type: integer }
          language: { type: string, enum: [zh, en], default: zh }
    updates:
      type: string
      enum: [none, webhook, polling]
      default: none
      description: none 只发送与编辑；webhook 接收推送；polling 长轮询（选主）
    webhook_secret_file: { type: string, x-srenautix-secret-ref: true, description: updates=webhook 时必填 }
    messages_per_minute: { type: integer, minimum: 1, maximum: 30, default: 20 }
    edit_gap: { type: string, default: 3s }
required_scopes:
  - 'telegram:bot 在目标群中可以发送与编辑消息'
owner: srenautix-maintainers
