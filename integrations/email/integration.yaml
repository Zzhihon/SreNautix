# 邮件只用于通知，不承载审批。
api_version: srenautix.io/integration/v1
id: email
display_name: 邮件（SMTP）
category: notify
direction: notify
tier: official_candidate
contract: notify/v1
capabilities:
  - { name: notify.send, stability: beta }
tested_versions:
  - { backend: smtp, versions: ['RFC 5321 + STARTTLS'], verification: testcontainers }
config_schema:
  type: object
  additionalProperties: false
  required: [host, port, from, to]
  properties:
    host: { type: string }
    port: { type: integer }
    tls: { type: string, enum: [starttls, implicit], default: starttls }
    username: { type: string }
    password_file: { type: string, x-srenautix-secret-ref: true }
    from: { type: string }
    to: { type: array, minItems: 1, items: { type: string } }
required_scopes: []
owner: srenautix-maintainers
