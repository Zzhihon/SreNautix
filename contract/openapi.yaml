  /v1/skills/{name}/runs:
    parameters: [{ $ref: '#/components/parameters/SkillName' }]
    get:
      tags: [skills]
      operationId: listSkillRuns
      description: 技能的运行，按 created_at 从新到旧，最多 limit 条
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
