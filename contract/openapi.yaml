          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [suite, routes, runs_per_case]
              properties:
                suite: { type: string }
                routes: { type: array, minItems: 1, items: { type: string } }
                runs_per_case: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: 估算
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cases, calls, input_tokens, cost, currency]
                properties:
                  cases: { type: integer, minimum: 0 }
                  calls: { type: integer, minimum: 0 }
                  input_tokens: { type: integer, minimum: 0 }
                  cost: { type: number, minimum: 0 }
                  currency: { type: string }
  /v1/agent/health:
    get:
      tags: [eval]
      operationId: getAgentHealth
      description: P0 记分卡（DESIGN 附录 A）与运行指标
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - { name: window, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/Duration' } }
      responses:
        '200':
          description: 记分卡
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentHealth' } } }
  /v1/agent/cost:
    get:
      tags: [eval]
      operationId: getAgentCost
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [day, incident, model] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 成本
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [currency, daily_budget, items]
                properties:
                  currency: { type: string }
                  daily_budget: { type: [number, 'null'] }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, label, input_tokens, output_tokens, cost, runs]
                      properties:
                        key: { type: string }
                        label: { type: string }
                        input_tokens: { type: integer, minimum: 0 }
                        output_tokens: { type: integer, minimum: 0 }
                        cost: { type: number, minimum: 0 }
                        runs: { type: integer, minimum: 0 }
  /v1/egress/ledger:
    get:
