                    合规配置下 H 档的通行密钥断言（navigator.credentials.get 的 PublicKeyCredential JSON），
                    挑战来自 POST /v1/auth/webauthn/assertion-options；其余情况为 null
                  oneOf: [{ type: 'null' }, { type: object, additionalProperties: true }]
      responses:
        '200':
          description: 已签发
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [proposal, envelope]
                properties:
                  proposal: { $ref: './schemas/proposal.schema.json' }
                  envelope: { $ref: '#/components/schemas/ApprovalEnvelope' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/proposals/{proposal_id}/reject:
    parameters: [{ $ref: '#/components/parameters/ProposalId' }]
    post:
      tags: [proposals]
      operationId: rejectProposal
      x-srenautix-roles: [approver, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 已拒绝
          content: { application/json: { schema: { $ref: './schemas/proposal.schema.json' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/proposals/{proposal_id}/undo:
    parameters: [{ $ref: '#/components/parameters/ProposalId' }]
    post:
      tags: [proposals]
      operationId: undoProposal
      description: 请求撤销已执行的 reversible 动作；由 gateway 在冲突域内串行执行
      x-srenautix-roles: [approver, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202':
          description: 撤销已排队
          content: { application/json: { schema: { $ref: './schemas/proposal.schema.json' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/approvals/batch:
    post:
      tags: [proposals]
      operationId: batchApprove
      description: 批量审批只允许同类型、同集群、L 档的提议；每个提议独立处理，逐项返回结果
      x-srenautix-roles: [approver, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposal_ids]
              properties:
                proposal_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: './integrations/approve/v1/approve.schema.json#/$defs/ApprovalOutcome' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/events:
    get:
      tags: [events]
      operationId: listEvents
      description: |
        事件流（DESIGN §2.3）。按游标读取 server 与 worker 两张 outbox 合并后的事件。
        `Accept: application/json` 时长轮询：没有新事件时最多等待 wait 秒；`Accept: text/event-stream` 时为 SSE，
        每条事件的 SSE id 为它的游标，断线后用 Last-Event-ID 续传。投递语义是至少一次，消费者按 event_id 幂等处理
      x-srenautix-roles: [viewer, responder, approver, auditor, admin, service-worker]
      x-srenautix-external: false
      parameters:
        - name: after
          in: query
          description: 游标，形如 server:<seq>,worker:<seq>；不填时从当前位置开始
          schema: { type: string, pattern: '^((server|worker):[0-9]+)(,(server|worker):[0-9]+)?$' }
        - {
            name: types,
            in: query,
            style: form,
            explode: false,
            schema: { type: array, items: { $ref: './schemas/events.schema.json#/$defs/EventType' } },
          }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 60, default: 25 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        '200':
          description: 事件批次
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, cursor]
                properties:
                  events: { type: array, items: { $ref: './schemas/events.schema.json' } }
                  cursor: { type: string }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
  /v1/eval/reports:
    get:
      tags: [eval]
      operationId: listEvalReports
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [snapshot, reconstructed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 成绩单（新的在前）
          content:
            application/json:
              schema: { type: array, items: { $ref: './schemas/eval-report.schema.json' } }
  /v1/eval/reports/{report_id}:
    parameters:
      - { name: report_id, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' } }
    get:
      tags: [eval]
      operationId: getEvalReport
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      responses:
        '200':
          description: 成绩单
          content: { application/json: { schema: { $ref: './schemas/eval-report.schema.json' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ingest/{source_id}:
    parameters:
      - { name: source_id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' } }
    post:
      tags: [ingest]
      operationId: ingestAlerts
      description: |
        告警接入（DESIGN §3.1）。每个接入源有自己的 bearer token；请求体按接入源的类型解析：Alertmanager 或 Grafana 的 webhook、
        夜莺事件、通用 JSON（按 JSONPath 映射）。状态库不可用时走降级路径，返回 202
      security: [{ bearer: [] }]
      x-srenautix-roles: [ingest-source]
      x-srenautix-external: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 已接收
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } }
        '202':
          description: 状态库降级，已在内存中处理
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/auth/webauthn/assertion-options:
    post:
      tags: [auth]
      operationId: webauthnAssertionOptions
      description: 合规配置下 H 档审批的通行密钥挑战；挑战绑定提议的 params_hash 与绑定字段，只能用一次
      x-srenautix-roles: [approver, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposal_id]
              properties:
                proposal_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
      responses:
        '200':
          description: PublicKeyCredentialRequestOptionsJSON
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/runs/{run_id}/prompts:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      tags: [research]
      operationId: getRedactedPrompts
      description: 脱敏后的提示词，研判运行明细使用
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      responses:
        '200':
          description: 每次模型调用的脱敏后提示词
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [seq, phase, messages, redaction_hits]
                  properties:
                    seq: { type: integer, minimum: 1 }
                    phase: { type: string }
                    redaction_hits: { type: integer, minimum: 0 }
                    messages:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [role, content]
                        properties:
                          role: { type: string, enum: [system, developer, user, assistant, tool] }
                          content: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /v1/role-bindings:
    get:
      tags: [governance]
      operationId: listRoleBindings
      description: 来自 Git 的角色绑定；revision 是 git-sync 写入的提交 SHA，没有时为全部文件内容的 sha256
      x-srenautix-roles: [admin, auditor]
      x-srenautix-external: false
      responses:
        '200':
          description: 角色绑定
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision, bindings]
                properties:
                  revision: { type: string }
                  bindings:
                    type: array
                    description: RoleBinding 的全部字段，加上它所在的文件
                    items:
                      type: object
                      additionalProperties: false
                      required: [subject, role, scope, file]
                      properties:
                        subject:
                          {
                            $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding/properties/subject',
                          }
                        role:
                          { $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding/properties/role' }
                        scope:
                          {
                            $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding/properties/scope',
                          }
                        max_risk_tier: { type: string, enum: [L, H] }
                        file: { type: string }
  /v1/permissions/explain:
    post:
      tags: [governance]
      operationId: explainPermission
      description: 逐条列出每个角色绑定是否匹配；解释其他主体时需要 users.read
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, permission, target, tier]
              properties:
                subject:
                  oneOf:
                    - { type: 'null' }
                    - type: object
                      additionalProperties: false
                      required: [id, groups]
                      properties:
                        id: { type: string }
                        groups: { type: array, items: { type: string } }
                permission: { $ref: '#/components/schemas/Permission' }
                target: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PermissionTarget' }] }
                tier: { type: [string, 'null'], enum: [L, H, null] }
      responses:
        '200':
          description: 授权解释
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [allowed, subject, permission, target, tier, revision, entries]
                properties:
                  allowed: { type: boolean }
                  subject:
                    type: object
                    additionalProperties: false
                    required: [id, groups]
                    properties:
                      id: { type: string }
                      groups: { type: array, items: { type: string } }
                  permission: { $ref: '#/components/schemas/Permission' }
                  target: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PermissionTarget' }] }
                  tier: { type: [string, 'null'], enum: [L, H, null] }
                  revision: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [binding, file, subject_match, grants_permission, scope_match, tier_ok, reason]
                      properties:
                        binding: { $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding' }
                        file: { type: string }
                        subject_match: { type: boolean }
                        grants_permission: { type: boolean }
                        scope_match: { type: boolean }
                        tier_ok: { type: boolean }
                        reason: { type: string }
        '403': { $ref: '#/components/responses/Error' }
  /v1/users:
    get:
      tags: [governance]
      operationId: listUsers
      x-srenautix-roles: [admin, auditor]
      x-srenautix-external: false
      responses:
        '200':
          description: 登录过的用户（最近登录在前）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [principal_id, display_name, provider, groups, roles, chat_links, first_login_at, last_login_at]
                  properties:
                    principal_id: { type: string }
                    display_name: { type: string }
                    provider: { type: string }
                    groups: { type: array, items: { type: string } }
                    roles:
                      {
                        type: array,
                        items: { $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding' },
                      }
                    chat_links: { type: array, items: { $ref: '#/components/schemas/ChatLink' } }
                    first_login_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
                    last_login_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
  /v1/chat-links:
    get:
      tags: [auth]
      operationId: listChatLinks
      description: 当前用户的聊天账号绑定
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      responses:
        '200':
          description: 绑定
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatLink' } } } }
  /v1/chat-links/{channel}/{channel_user_id}:
    parameters:
      - { name: channel, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Channel' } }
      - { name: channel_user_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [auth]
      operationId: deleteChatLink
      description: 解除绑定；本人或有 settings.write 权限的主体可以操作，写入治理审计
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 已解除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/eval/cases:
    get:
      tags: [eval]
      operationId: listEvalCases
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - { name: suite, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [snapshot, reconstructed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: 用例（含被排除的材料）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EvalCaseSummary' } }
                  next_cursor: { type: [string, 'null'] }
  /v1/eval/trend:
    get:
      tags: [eval]
      operationId: getEvalTrend
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - { name: suite, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [snapshot, reconstructed] } }
      responses:
        '200':
          description: 按版本的成绩趋势
          content:
            application/json:
              schema:
                type: array
                items:
