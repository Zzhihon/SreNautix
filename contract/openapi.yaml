openapi: 3.1.0
info:
  title: SreNautix hub API
  version: 2.66.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    中心（server 角色）的 HTTP API。控制台 BFF、Grafana 插件、聊天渠道桥、MCP 与外部调用方都以本文件为准。
    - 认证：控制台使用服务端会话（cookie `__Host-srenautix_session`，HttpOnly，SameSite=Strict），改变状态的请求必须带
      `X-CSRF-Token` 并校验 Origin；外部调用方使用 `Authorization: Bearer <API token>`，API token 只有提议权限。
    - 授权：每个操作的 `x-srenautix-roles` 列出允许的角色（DESIGN §13），`x-srenautix-external` 标出外部调用方
      （MCP、API token）是否可以调用。外部调用方只能提议，不能审批，也不能修改策略。存在未分类的操作时 CI 失败。
    - 事件引用 `{incident_ref}` 接受 incident_id（UUID）、稳定标签或别名表中的旧标签与旧 id；按别名解析时返回合并后的事件。
    - 时间一律为 RFC 3339 UTC 字符串。参数或请求体不合法返回 400；依赖不可用返回 503。
servers:
  - url: /
security:
  - session: []
  - bearer: []
tags:
  - name: health
  - name: auth
  - name: incidents
  - name: research
  - name: evidence
  - name: feedback
  - name: proposals
  - name: events
  - name: eval
  - name: ingest
  - name: topology
  - name: system
  - name: governance
  - name: optimization
  - name: skills
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      x-srenautix-roles: [anonymous]
      x-srenautix-external: true
      responses:
        '200': { description: 进程存活 }
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      security: []
      x-srenautix-roles: [anonymous]
      x-srenautix-external: true
      responses:
        '200': { description: 迁移完成，可以服务 }
        '503': { $ref: '#/components/responses/Error' }
  /v1/conditions:
    get:
      tags: [health]
      operationId: listConditions
      description: 全部角色发布的状态条件（DESIGN §12.4），驱动状态条
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - { name: cluster_id, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/ClusterId' } }
      responses:
        '200':
          description: 当前条件
          content:
            application/json:
              schema: { type: array, items: { $ref: './schemas/condition.schema.json' } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: loginLocal
      description: 本地管理员登录（只用于首次引导与紧急入口），必须带 TOTP。失败到一定次数会锁定。成功后设置会话 cookie
      security: []
      x-srenautix-roles: [anonymous]
      x-srenautix-external: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                totp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 本地管理员要求 TOTP 时（默认，见 listAuthProviders 的 local_admin.totp_required）必填；关闭时可以省略，提交了也不校验
      responses:
        '200':
          description: 已登录
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /v1/auth/oidc/start:
    get:
      tags: [auth]
      operationId: startOidc
      security: []
      x-srenautix-roles: [anonymous]
      x-srenautix-external: false
      parameters:
        - { name: return_to, in: query, schema: { type: string } }
        - name: max_age
          in: query
          description: 重新认证时传 0，用于 H 档审批（5 分钟内重新认证）
          schema: { type: integer, minimum: 0 }
      responses:
        '302': { description: 跳转到身份提供方 }
  /v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      security: []
      x-srenautix-roles: [anonymous]
      x-srenautix-external: false
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 设置会话后跳回 }
        '400': { $ref: '#/components/responses/Error' }
  /v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      responses:
        '200':
          description: 当前会话
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      description: 登录页显示的登录方式
      security: []
      x-srenautix-roles: [anonymous]
      x-srenautix-external: false
      responses:
        '200':
          description: 登录方式
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [local_admin, oidc, profile]
                properties:
                  local_admin:
                    type: object
                    additionalProperties: false
                    required: [enabled, break_glass, totp_required]
                    properties:
                      enabled: { type: boolean }
                      break_glass: { type: boolean, description: SSO 已验证通过，本地管理员只作为紧急入口 }
                      totp_required:
                        type: boolean
                        description: >-
                          登录是否要求 TOTP（identity.local_admin.totp_required）。为 false 时只凭口令登录，控制台显示"TOTP 已关闭"；
                          H 档审批的重新认证仍要求口令加 TOTP
                  oidc:
                    oneOf:
                      - { type: 'null' }
                      - type: object
                        additionalProperties: false
                        required: [display_name]
                        properties:
                          display_name: { type: string }
                  profile: { $ref: '#/components/schemas/Profile' }
  /v1/auth/reauth:
    post:
      tags: [auth]
      operationId: reauthLocal
      description: 本地管理员的重新认证（口令加 TOTP），更新会话的 auth_time；OIDC 用户改用 `oidc/start?max_age=0`
      x-srenautix-roles: [admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, totp]
              properties:
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 已重新认证
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 已退出 }
  /v1/auth/link-code:
    post:
      tags: [auth]
      operationId: createLinkCode
      description: 生成一次性聊天账号绑定码，在聊天里发送 `/link <code>` 完成绑定（DESIGN §9.2）
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '201':
          description: 绑定码
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, expires_at]
                properties:
                  code: { type: string, pattern: '^[A-Z0-9]{8}$' }
                  expires_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
  /v1/incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      description: |
        事件收件箱，按 first_firing_at 从新到旧。被抑制的事件不隐藏：suppressed=false（默认）时不返回明细，
        只在 suppressed_count 中计数。feedback=pending 表示最近一次完成的研判还没有反馈或反馈已过期。
        blind_spans 给出查询时段内接入静默或观测失明的时段，供收件箱画盲区色带。
        类别与组件的筛选（契约 2.46.0，ADR 0183）在状态库的查询里执行，每个参数都可以重复：category 保留类别
        （Incident.categories）与任一给出的取值相同的事件；exclude_category 去掉类别全部落在给出的取值中的事件，
        带 unclassified 的事件因此不会被去掉；exclude_component 去掉组件（Incident.components，含根因组件）全部落在
        给出的组件中的事件，没有组件的事件不去掉。
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      parameters:
        - { name: cluster_id, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/ClusterId' } }
        - { name: state, in: query, schema: { type: string, enum: [firing, resolved, all], default: firing } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: severity, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/Severity' } }
        - { name: disposition, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/Disposition' } }
        - { name: component, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        - name: category
          in: query
          style: form
          explode: true
          description: 只返回类别与任一取值相同的事件；可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/IncidentCategory' } }
        - name: exclude_category
          in: query
          style: form
          explode: true
          description: 去掉类别全部落在这些取值中的事件；可以重复。unclassified 不能被排除，给出时返回 400
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/AlertCategory' } }
        - name: exclude_component
          in: query
          style: form
          explode: true
          description: 去掉组件全部落在这些组件中的事件；可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        - name: business_domain
          in: query
          style: form
          explode: true
          description: 只返回主业务领域（Incident.business_domain）与任一取值相同的事件；可以重复（契约 2.54.0，ADR 0193）
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' } }
        - name: exclude_business_domain
          in: query
          style: form
          explode: true
          description: 去掉主业务领域落在这些取值中的事件；没有业务领域的事件不去掉。可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' } }
        - name: service
          in: query
          style: form
          explode: true
          description: 只返回服务（Incident.services）与任一取值相同的事件；可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ServiceId' } }
        - { name: feedback, in: query, schema: { type: string, enum: [pending, given, all], default: all } }
        - { name: suppressed, in: query, schema: { type: boolean, default: false } }
        - { name: q, in: query, description: 按标签、根因组件与告警名搜索, schema: { type: string, maxLength: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: 事件摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, suppressed_count, blind_spans, next_cursor, total, total_truncated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/IncidentSummary' } }
                  suppressed_count: { type: integer, minimum: 0 }
                  total:
                    type: integer
                    minimum: 0
                    description: 符合全部筛选条件的事件数，不受 cursor 与 limit 影响（契约 2.57.0）；被抑制的事件只在 suppressed=true 时计入
                  total_truncated:
                    type: boolean
                    description: 状态库一次最多取 2000 个事件；为 true 时 total 只统计了这 2000 个，实际更多
                  blind_spans:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [cluster_id, kind, from, to, reason]
                      properties:
                        cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
                        kind: { type: string, enum: [ingest_silent, observability_blind, state_store_degraded] }
                        from: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
                        to:
                          description: 仍在持续时为 null
                          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
                        reason: { type: string }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/incidents/export:
    get:
      tags: [incidents]
      operationId: exportIncidents
      description: |
        按时间窗批量导出事件（契约 2.49.0，ADR 0186）。导出与时间窗 [from, to] 有重叠的事件（合并掉的事件除外，它们计入
        吸收它们的事件的 merged_count），from 与 to 必填，跨度不超过 31 天。cluster_id、severity、component、category、
        exclude_category、exclude_component、suppressed 的语义与 GET /v1/incidents 相同，在状态库的同一段查询条件里执行；
        授权与可见性也相同：调用方只能看到读取作用域内的事件。
        每个事件带告警名、根因组件与实体、首次与末次触发、累计触发时长、发生次数、合并次数、重开次数、类别、研判结论
        （无法判定时附原因码与原因）、abnormal 与 undeterminable 证据卡的一句摘要、关联的影子 issue，以及事件时间窗
        （限定在导出时间窗内）里的 Kubernetes Warning 摘要（ADR 0185）。每个集群另给出 Warning 查询的状态与疑似同一根因的
        分组，分组只在导出的这一批事件里计算。查询数与事件数无关：状态库按批查询，每个集群的 Warning 查询数固定。
        一次最多 limit 条（默认与上限 5000），还有更多时 truncated 为 true，用 next_cursor 继续；group=series 时另按系列汇总。
        format=ndjson 时逐行输出 IncidentExportRecord；format=md 给人阅读：先列疑似同一根因的分组，再按系列汇总，最后是事件明细。
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - name: to
          in: query
          required: true
          description: 不早于 from，与 from 相隔不超过 31 天
          schema: { type: string, format: date-time }
        - { name: cluster_id, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/ClusterId' } }
        - { name: severity, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/Severity' } }
        - { name: component, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        - name: category
          in: query
          style: form
          explode: true
          description: 只导出类别与任一取值相同的事件；可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/IncidentCategory' } }
        - name: exclude_category
          in: query
          style: form
          explode: true
          description: 去掉类别全部落在这些取值中的事件；可以重复。unclassified 不能被排除，给出时返回 400
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/AlertCategory' } }
        - name: exclude_component
          in: query
          style: form
          explode: true
          description: 去掉组件全部落在这些组件中的事件；可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        - name: business_domain
          in: query
          style: form
          explode: true
          description: 只导出主业务领域（Incident.business_domain）与任一取值相同的事件；可以重复（契约 2.54.0，ADR 0193）
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' } }
        - name: exclude_business_domain
          in: query
          style: form
          explode: true
          description: 去掉主业务领域落在这些取值中的事件；没有业务领域的事件不去掉。可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' } }
        - name: service
          in: query
          style: form
          explode: true
          description: 只导出服务（Incident.services）与任一取值相同的事件；可以重复
          schema: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ServiceId' } }
        - { name: suppressed, in: query, schema: { type: boolean, default: false } }
        - { name: format, in: query, schema: { type: string, enum: [json, ndjson, md], default: json } }
        - { name: group, in: query, schema: { $ref: './schemas/incident-export.schema.json#/$defs/GroupBy' } }
        - name: group_gap
          in: query
          description: 疑似同一根因分组的 gap（同一节点相邻信号并为一段的最大间隔），默认 30m，不超过 24h
          schema: { type: string, pattern: '^\d+(s|m|h)$' }
        - name: group_before
          in: query
          description: 事件可以早于信号时间段开始的时长，默认 30m，不超过 24h
          schema: { type: string, pattern: '^\d+(s|m|h)$' }
        - name: group_after
          in: query
          description: 事件可以晚于信号时间段结束的时长，默认 30m，不超过 24h
          schema: { type: string, pattern: '^\d+(s|m|h)$' }
        - name: group_min_incidents
          in: query
          description: 成组需要的最少事件数，默认 2
          schema: { type: integer, minimum: 1, maximum: 100 }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 } }
      responses:
        '200':
          description: 导出结果
          content:
            application/json: { schema: { $ref: './schemas/incident-export.schema.json' } }
            application/x-ndjson: { schema: { $ref: './schemas/incident-export.schema.json#/$defs/Record' } }
            text/markdown: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/alerts/lookup:
    get:
      tags: [incidents]
      operationId: lookupAlert
      description: |
        按一条告警的完整标签集找到它所属的事件（契约 2.32.0，ADR 0154）。Alertmanager 等外部通知只知道告警的标签，
        不知道事件 id，控制台的 `/alerts?l.<标签名>=<标签值>&…` 页面调用本接口后打开事件。
        中心按接入时同样的规则计算身份标签（去掉 alertgroup、alertstate、__name__ 与 ingest.external_labels）和指纹，
        取这个指纹开始时间最晚的一条告警，经事件成员关系与别名链找到所属事件；合并过的事件给出吸收它的事件，已恢复的事件照常给出。
        找不到时 outcome 说明原因。只读
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      parameters:
        - name: labels
          in: query
          required: true
          style: form
          explode: true
          description: |
            告警的标签，每个标签一个查询参数 `l.<标签名>=<标签值>`（例如 `l.alertname=KubePodCrashLooping&l.namespace=shop`），
            必须有 `l.alertname`；同一个标签出现两次时返回 400。除 `l.` 参数与 cluster_id 以外的参数返回 400
          schema:
            type: object
            propertyNames: { pattern: '^l\..+$' }
            additionalProperties: { type: string }
        - name: cluster_id
          in: query
          description: 只在这个集群的告警中查找；不填时取全部集群中开始时间最晚的一条
          schema: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
      responses:
        '200':
          description: 查找结果
          content: { application/json: { schema: { $ref: '#/components/schemas/AlertLookup' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/incidents/{incident_ref}:
    parameters: [{ $ref: '#/components/parameters/IncidentRef' }]
    get:
      tags: [incidents]
      operationId: getIncident
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      parameters:
        - name: version
          in: query
          description: 取指定版本；不填为最新版本
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 事件全文
