  /v1/proposals:
    get:
      tags: [proposals]
      operationId: listProposals
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      parameters:
        - { name: incident_id, in: query, schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' } }
        - { name: state, in: query, schema: { $ref: './schemas/proposal.schema.json#/$defs/State' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: 提议（新的在前）
          content:
            application/json:
              schema: { type: array, items: { $ref: './schemas/proposal.schema.json' } }
    post:
      tags: [proposals]
      operationId: createProposal
      description: |
        提议中转。source 由认证上下文决定：控制台会话为 human，API token 与 MCP 为 external，worker 的服务身份为 research。
        相同幂等键的未结束提议存在时返回 200 与已有提议；绑定字段与事件当前状态不一致时返回 409
      x-srenautix-roles: [responder, approver, admin, service-worker]
      x-srenautix-external: true
      parameters: [{ $ref: '#/components/parameters/CsrfOptional' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/proposal.schema.json#/$defs/ProposalCreate' }
      responses:
        '200':
          description: 幂等命中，返回已有提议
          content: { application/json: { schema: { $ref: './schemas/proposal.schema.json' } } }
        '201':
          description: 已创建。策略拒绝时同样返回 201，state=rejected_by_policy
          content: { application/json: { schema: { $ref: './schemas/proposal.schema.json' } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/proposals/{proposal_id}:
    parameters: [{ $ref: '#/components/parameters/ProposalId' }]
    get:
      tags: [proposals]
      operationId: getProposal
      description: 提议全文，加上审批页按顺序展示的机器推导字段；预检由服务端在本次请求时重新执行
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      responses:
        '200':
          description: 提议详情
          content: { application/json: { schema: { $ref: '#/components/schemas/ProposalDetail' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/catalog/actions:
    get:
      tags: [proposals]
      operationId: listCatalogActions
      description: 生效的动作目录（结构以 contract/gateway/ 的动作目录 schema 为准），以及每个动作在各集群的启用状态
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: true
      responses:
        '200':
          description: 动作目录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [catalog, enabled]
                properties:
                  catalog: { $ref: './gateway/v1/action-catalog.schema.json' }
                  enabled:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [cluster_id, action, namespaces, auto]
                      properties:
                        cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
                        action: { type: string }
                        namespaces: { type: array, items: { type: string } }
                        auto: { type: boolean }
  /v1/clusters:
    get:
      tags: [health]
