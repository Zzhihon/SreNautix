            schema: { $ref: './schemas/common.schema.json#/$defs/ClusterId' },
          }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 不写时为现在, schema: { type: string, format: date-time } }
      responses:
