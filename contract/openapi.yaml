                    oneOf: [{ type: 'null' }, { $ref: './schemas/skill-run.schema.json#/$defs/SkillFinding' }]
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-srenautix_session
    bearer:
      type: http
      scheme: bearer
      description: |
        两类 token：
        - API token（外部调用方）：只能调用 x-srenautix-external=true 的操作，写操作只有提议。
        - Grafana 插件 token：登记在 server 的调用方文件（callers.tokens_file，kind: grafana）中，不是控制台创建的 API token。
          插件后端代理只读接口与 createFeedback，必须带 X-SreNautix-On-Behalf-Of（Grafana 用户的邮箱）；server 按 OIDC ID Token
          的 email 声明（不区分大小写）把它映射到登录过控制台的用户，按该用户的角色绑定授权，但只放行 GET 与 createFeedback，
          反馈的 channel 记为 grafana。没有邮箱、映射不到或映射到多个用户时返回 403。
  parameters:
    OnBehalfOf:
      name: X-SreNautix-On-Behalf-Of
      in: header
      required: false
      description: 只用于 Grafana 插件 token：Grafana 用户的邮箱
      schema: { type: string, format: email }
    IncidentRef:
      name: incident_ref
      in: path
      required: true
      description: incident_id、稳定标签或别名；标签放进路径时按 RFC 3986 编码
      schema: { type: string, minLength: 1 }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
    GoalId:
      name: goal_id
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
    SkillName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
    RecommendationId:
      name: recommendation_id
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    CsrfOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: 会话认证时必填；Bearer 认证时不需要
      schema: { type: string }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: './schemas/common.schema.json#/$defs/Error' }
  schemas:
    Profile:
      type: string
      description: 安装配置（DESIGN §1.3）
      enum: [observe, standard, compliance]
    Session:
      type: object
      additionalProperties: false
      required: [principal, roles, provider, profile, local_admin, auth_time, expires_at, csrf_token, break_glass]
      properties:
        principal: { $ref: './schemas/common.schema.json#/$defs/Principal' }
        roles:
          type: array
          description: 角色绑定与作用域
          items: { $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding' }
        provider: { type: string }
        profile: { $ref: '#/components/schemas/Profile' }
        local_admin: { type: boolean }
        auth_time:
          description: 最近一次认证或重新认证的时间；H 档审批要求在 5 分钟内
          $ref: './schemas/common.schema.json#/$defs/Timestamp'
        expires_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        csrf_token: { type: string }
        break_glass:
          type: boolean
          description: 本地管理员作为紧急入口登录；页面显示横幅
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, kind, text, ref, untrusted, code, level]
      properties:
        at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        kind:
          type: string
          enum:
            [
              alert_firing,
              alert_resolved,
              change,
              card_abnormal,
              incident_merged,
              incident_split,
              stage_a,
              stage_a_missing,
              research_concluded,
              research_ended,
              remediation_attempt,
              notify,
              issue,
              incident_state,
              proposal,
              execution,
              feedback,
              claim,
            ]
          description: |
            claim：认领与放下（ADR 0195），text 写认领人或"放下"，ref 为认领人的主体 id；
            remediation_attempt：自愈 PR 对一次研判的处理结果（ADR 0170），text 写模板、结果与原因，ref 为研判的 run_id；
            research_concluded：研判结束并给出结论，code 为检验循环的停止原因；
            research_ended：研判没有结论（失败或只出阶段 A，code 为失败类型）、入队时跳过、租约过期、被取代或不进入阶段 B，ref 为 run_id（不进入阶段 B 时为空）；
            stage_a_missing：阶段 A 执行失败（stage_a_failed，text 带错误摘要）与补跑后仍没有报告（stage_a_missing）；
            notify：消息送达、编辑次数用完后的最后一次编辑、放弃投递与不推送的决定，ref 为渠道与渠道目标（不推送时为空）；
            issue：事件 issue 开出、跳过与失败；
            incident_state：事件恢复、重开、被抑制（text 带抑制的原因）与写入失败；
            feedback：人工反馈与隐式反馈，code 为反馈的原因码（契约 2.40.0，ADR 0174），没有原因码时为 null
        code:
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]*$'
          description: 原因码，取原因码登记表 contract/reason-codes.json 中所属阶段的值（契约 2.39.0，ADR 0172）；阶段由 kind 决定（stage_a_missing → stage_a，research_* → research，remediation_attempt → remediation，notify、issue、feedback → 同名阶段，incident_state → incident）。告警、变更、卡与提议等没有原因码的条目为 null，自愈 PR 提出提议（proposed）时为 null
        level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/reason-codes.schema.json#/$defs/Level' }]
          description: 原因码在登记表中的级别；code 为 null 时为 null
        text: { type: string }
        ref: { type: [string, 'null'], description: 关联对象的 id（alert_id、change_id、run_id、proposal_id 等） }
        untrusted: { type: boolean, description: text 含告警、日志或变更来源的原文，只作为文本显示 }
        change_link:
          $ref: './schemas/incident.schema.json#/$defs/ChangeLink'
          description: kind 为 change 时：这个变更与事件的关联分级与依据（ADR 0169）；事件没有 change_links 时省略
    AlertLookup:
      type: object
      additionalProperties: false
      description: 按标签集查找告警所属事件的结果（契约 2.32.0，ADR 0154）
      required: [outcome, fingerprint, identity_labels, excluded_labels, alert, incident]
      properties:
        outcome:
          type: string
          enum: [incident, not_received, not_grouped, not_visible, self_alert, ignored]
          description: |
            incident：找到所属事件（incident 不为空）；
            not_received：中心没有收到过这个身份标签集的告警；
            not_grouped：收到了告警（alert 不为空），事件引擎还没有把它归入任何事件；
            not_visible：告警或它所属的事件不在调用方的读取范围内，alert 与 incident 都为空；
            self_alert：标签里有 ingest.self_label，是 SreNautix 自身的元告警，接入时丢弃；
            ignored：Watchdog（ingest.watchdog_alertname）、InfoInhibitor 或 severity=none，接入时丢弃，不进入事件
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: 按身份标签计算的告警指纹（与 alert_state.fingerprint 相同）
        identity_labels: { $ref: './schemas/common.schema.json#/$defs/Labels' }
        excluded_labels:
          type: array
          description: 收到的标签中不计入身份的标签名（alertgroup、alertstate、__name__ 与 external labels），按名称排序
          items: { type: string }
        alert:
          description: 这个指纹开始时间最晚的一条告警；outcome 为 incident 或 not_grouped 时有值
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [alert_id, cluster_id, status, starts_at, ends_at, received_at]
              properties:
                alert_id: { type: string }
                cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
                status: { type: string, enum: [firing, resolved] }
                starts_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
                ends_at:
                  oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
                received_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        incident:
          description: 所属事件；合并过的事件为吸收它的事件。outcome 为 incident 时有值
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [incident_id, label, state]
              properties:
                incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
                label: { type: string }
                state: { type: string, enum: [firing, resolved] }
    Subgraph:
      type: object
      additionalProperties: false
      required: [topology_version, root, nodes, edges]
      properties:
        topology_version: { type: integer, minimum: 0 }
        root:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [component, kind, namespace, name, role, alerts, hops]
            properties:
              component: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              kind: { type: string }
              namespace: { type: [string, 'null'] }
              name: { type: string }
              role: { type: string, enum: [root, candidate, member, neighbor] }
              alerts: { type: array, items: { type: string }, description: 该组件上的成员告警 alert_id }
              hops: { type: integer, minimum: 0, maximum: 2 }
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from, to, relation, provenance, confidence, scope]
            properties:
              from: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              to: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              relation: { type: string }
              provenance: { $ref: './schemas/topology-event.schema.json#/$defs/Provenance' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              scope: { type: string, enum: [instance, service] }
    ClusterMap:
      type: object
      additionalProperties: false
      required: [topology_version, at, domains, components, edges, nodes, hubs, omitted, incidents]
      properties:
        topology_version: { type: integer, minimum: 0 }
        at: { type: string, format: date-time }
        domains:
          type: array
          description: 地图上有组件的业务领域与服务，按声明顺序
          items:
            type: object
            additionalProperties: false
            required: [id, title, tier, services]
            properties:
              id: { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' }
              title: { $ref: './schemas/evidence-card.schema.json#/$defs/LocalizedText' }
              tier: { $ref: './schemas/common.schema.json#/$defs/BusinessTier' }
              services:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title]
                  properties:
                    id: { $ref: './schemas/common.schema.json#/$defs/ServiceId' }
                    title: { $ref: './schemas/evidence-card.schema.json#/$defs/LocalizedText' }
        components:
          type: array
          description: 有 Pod 的顶层对象与路由入口（ADR 0199 §1），按键排序
          items:
            type: object
            additionalProperties: false
            required: [key, kind, namespace, name, component_type, service, service_source, members, attachments, nodes]
            properties:
              key: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              kind: { type: string }
              namespace: { type: [string, 'null'] }
              name: { type: string }
              component_type: { type: [string, 'null'] }
              service:
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ServiceId' }]
              service_source:
                type: string
                enum: [component, member, namespace, default]
                description: component 组件自己命中服务成员；member 它的某个成员（例如 Pod）命中；namespace 命名空间默认服务；default 没有归属
              members:
                type: object
                additionalProperties: { type: integer, minimum: 1 }
                description: 沿成员关系归入组件的对象按类型计数，不含组件自己
              attachments:
                type: object
                additionalProperties: { type: integer, minimum: 1 }
                description: 组件引用、挂载而不画在地图上的对象（ConfigMap、Secret、PersistentVolumeClaim 等）按类型计数
              nodes:
                type: array
                items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
                description: 成员 Pod 运行的节点
        edges:
          type: array
          description: 组件之间的依赖，from 依赖 to；经 Service 的边接到 Service 选中的组件，同一对组件只有一条
          items:
            type: object
            additionalProperties: false
            required: [from, to, relations, count, provenance, confidence]
            properties:
              from: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              to: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              relations: { type: array, items: { type: string }, minItems: 1 }
              count: { type: integer, minimum: 1, description: 合并的对象级边数 }
              provenance: { $ref: './schemas/topology-event.schema.json#/$defs/Provenance' }
              confidence:
                { type: number, minimum: 0, maximum: 1, description: 合并的边中最高的置信度，provenance 是这条边的来源 }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, name, components, pods]
            properties:
              key: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              name: { type: string }
              components: { type: integer, minimum: 0 }
              pods: { type: integer, minimum: 0 }
        hubs:
          type: array
          description: 集群枢纽（CoreDNS、CNI 等），全部组件都依赖，不画边
          items:
            type: object
            additionalProperties: false
            required: [key, kind, namespace, name, dependents]
            properties:
              key: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              kind: { type: string }
              namespace: { type: [string, 'null'] }
              name: { type: string }
              dependents: { type: integer, minimum: 0, description: 直接依赖它的地图组件数 }
        omitted:
          type: integer
          minimum: 0
          description: 不画在地图上、也没有被组件引用的顶层对象数（RBAC、CRD、策略、GitOps 对象等）
        incidents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [incident_id, label, severity, headline, first_firing_at, root, component, placement, service]
            properties:
              incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
              label: { $ref: './schemas/incident.schema.json#/$defs/IncidentLabel' }
              severity: { $ref: './schemas/common.schema.json#/$defs/Severity' }
              headline:
                oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/IncidentHeadline' }]
              first_firing_at: { type: string, format: date-time }
              root:
                description: 事件的根因组件键
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
              component:
                description: 事件在地图上的位置：组件的键，placement 为 node 时是节点条上的节点键；放不到地图上时为 null
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
              placement:
                description: >-
                  事件怎样放到地图上（契约 2.64.0，ADR 0203）：root 根因或它的顶层对象是组件；named 根因是领域包的伪组件，按名称放到同名组件；
                  protects 根因是 PodDisruptionBudget，放到它保护的组件；node 根因是节点，放到节点条。component 为 null 时为 null。
                  只有 root 与 named 的事件向依赖它的组件传播“受影响”：PDB 阻塞驱逐与节点问题不说明组件本身出了问题
                oneOf: [{ type: 'null' }, { type: string, enum: [root, named, protects, node] }]
              service:
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ServiceId' }]
    ClusterMapTimeline:
      type: object
      additionalProperties: false
      required: [from, to, truncated, incidents]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        truncated: { type: boolean, description: 事件超过 2000 个，只返回最早触发的 2000 个 }
        incidents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [incident_id, label, severity, first_firing_at, ended_at, service]
            properties:
              incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
              label: { $ref: './schemas/incident.schema.json#/$defs/IncidentLabel' }
              severity: { $ref: './schemas/common.schema.json#/$defs/Severity' }
              first_firing_at: { type: string, format: date-time }
              ended_at:
                description: 恢复的时刻；仍在触发时为 null
                oneOf: [{ type: 'null' }, { type: string, format: date-time }]
              service:
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ServiceId' }]
    ProposalDetail:
      type: object
      additionalProperties: false
      required:
        [
          proposal,
          target_state,
          prechecks,
          prechecked_at,
          blast_radius,
          conflict_domain,
          queue_position,
          verify,
          undo,
          policy_rule,
          model_rationale,
        ]
      properties:
        proposal: { $ref: './schemas/proposal.schema.json' }
        target_state:
          type: object
          additionalProperties: false
          required: [exists, uid, resource_version, summary]
          properties:
            exists: { type: boolean }
            uid: { type: [string, 'null'] }
            resource_version: { type: [string, 'null'] }
            summary: { type: string, description: 例如副本数、就绪数、cordon 状态 }
        prechecks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, passed, detail]
            properties:
              name: { type: string }
              passed: { type: boolean }
              detail: { type: string }
        prechecked_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        blast_radius:
          type: object
          additionalProperties: false
          required: [summary, objects, within_limit]
          properties:
            summary: { type: string }
            objects: { type: array, items: { type: string } }
            within_limit: { type: boolean }
        conflict_domain: { type: string }
        queue_position: { type: [integer, 'null'], minimum: 1 }
        verify:
          type: object
          additionalProperties: false
          required: [condition, window]
          properties:
            condition: { type: string }
            window: { $ref: './schemas/common.schema.json#/$defs/Duration' }
        undo:
          type: object
          additionalProperties: false
          required: [kind, description]
          properties:
            kind: { type: string, enum: [auto_restore, controller_rebuild, compensation, none] }
            description: { type: string }
        policy_rule: { type: string, description: 决定审批档位的策略规则 }
        model_rationale:
          type: [string, 'null']
          description: 模型给出的理由，标注"模型生成，未经验证"；规则或人工提议时为 null
    Cluster:
      type: object
      additionalProperties: false
      required: [cluster_id, display_name, reader, gateway, freeze, informer_synced_at, proposal_only, conditions]
      properties:
        cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
        display_name: { type: string }
        reader: { $ref: '#/components/schemas/SpokeStatus' }
        gateway:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SpokeStatus' }]
        freeze:
          type: object
          additionalProperties: false
          required: [frozen, observed_at]
          properties:
            frozen: { type: boolean }
            observed_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        informer_synced_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        proposal_only:
          type: boolean
          description: 准入自检未通过、gateway 未部署或冻结时为 true；所有页面显示红色的"仅提议"
        conditions: { type: array, items: { $ref: './schemas/condition.schema.json' } }
    SpokeStatus:
      type: object
      additionalProperties: false
      required: [connected, version, last_seen_at, admission_selfcheck]
      properties:
        connected: { type: boolean }
        version: { type: [string, 'null'] }
        last_seen_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        admission_selfcheck:
          type: [string, 'null']
          description: 只对 gateway 有意义
          enum: [passed, failed, unknown, null]
    IncidentClaim:
      description: 事件的处理人（ADR 0195），定义在 incident.schema.json
      $ref: './schemas/incident.schema.json#/$defs/Claim'
    BusinessDomainStatus:
      type: object
      additionalProperties: false
      required: [id, title, tier, services]
      properties:
        id: { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' }
        title: { $ref: './schemas/evidence-card.schema.json#/$defs/LocalizedText' }
        tier: { $ref: './schemas/common.schema.json#/$defs/BusinessTier' }
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, title, firing]
            properties:
              id: { $ref: './schemas/common.schema.json#/$defs/ServiceId' }
              title: { $ref: './schemas/evidence-card.schema.json#/$defs/LocalizedText' }
              firing: { type: integer, minimum: 0 }
    IncidentSummary:
      type: object
      additionalProperties: false
      required:
        - incident_id
        - cluster_id
        - label
        - incident_version
        - state
        - severity
        - root_component
        - ambiguous
        - first_firing_at
        - ended_at
        - disposition
        - conclusion_level
        - research_fresh_at
        - pending_approvals
        - feedback
        - merged_from_count
        - split_from
        - suppressed
        - observability_blind
        - updated_at
        - component_names
        - research_root
        - categories
        - primary_category
        - headline
        - services
        - primary_service
        - primary_service_source
        - business_domain
        - business_impact
        - claim
      properties:
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
        label: { $ref: './schemas/incident.schema.json#/$defs/IncidentLabel' }
        incident_version: { type: integer, minimum: 1 }
        headline:
          description: 这个事件出了什么问题、什么时候开始（契约 2.52.0，ADR 0190）；事件没有仍在其中的成员告警时为 null
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/IncidentHeadline' }]
        state: { type: string, enum: [firing, resolved, merged] }
        severity: { $ref: './schemas/common.schema.json#/$defs/Severity' }
        categories:
          description: 事件的类别（Incident.categories，契约 2.46.0）
          type: array
          uniqueItems: true
          items: { $ref: './schemas/common.schema.json#/$defs/IncidentCategory' }
        primary_category:
          description: 事件的主类别（Incident.primary_category，契约 2.46.0）
          $ref: './schemas/common.schema.json#/$defs/IncidentCategory'
        services:
          description: 事件的服务（Incident.services，契约 2.54.0，ADR 0193）；名称见 GET /v1/business-domains
          type: array
          uniqueItems: true
          items: { $ref: './schemas/common.schema.json#/$defs/ServiceId' }
        primary_service:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ServiceId' }]
        primary_service_source:
          description: 主服务的来源；namespace 表示按默认命名空间推定，界面标注推定
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ServiceSource' }]
        business_domain:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/BusinessDomainId' }]
        claim:
          description: 事件的处理人（契约 2.59.0，ADR 0195）；没有人认领时为 null
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/IncidentClaim' }]
        business_impact:
          description: |
            仍在事件中的成员告警里属于业务影响告警（notify.business_impact_alerts，ADR 0166）的告警名，去重排序（契约 2.58.0）；
            没有时为空数组。控制台据此标出"影响业务"，与消息使用同一组定义
          type: array
          items: { type: string }
        root_component:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        ambiguous: { type: boolean }
        first_firing_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        ended_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        disposition:
          description: 最近一次研判的处置判断；只有阶段 A 时取阶段 A 的
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        conclusion_level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ConclusionLevel' }]
        research_fresh_at:
          description: 最近一次研判或阶段 A 报告的时间
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        pending_approvals: { type: integer, minimum: 0 }
        feedback:
          description: 最新一条反馈；没有时为 null
          oneOf: [{ type: 'null' }, { $ref: './schemas/feedback.schema.json' }]
        merged_from_count: { type: integer, minimum: 0 }
        split_from:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Uuid' }]
        suppressed: { type: boolean }
        observability_blind: { type: boolean }
        updated_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        component_names:
          description: 根因组件的可读名称（ADR 0101）；没有名称时为空对象
          $ref: './schemas/common.schema.json#/$defs/ComponentNames'
        research_root:
          description: 最近一次完成、给出了根因的研判的根因，及它与事件根因是否不一致（ADR 0104 §14）；没有这样的研判时为 null
          oneOf: [{ type: 'null' }, { $ref: './schemas/incident.schema.json#/$defs/ResearchRoot' }]
    IncidentHeadline:
      description: 事件的问题陈述（契约 2.52.0，ADR 0190），定义在 incident.schema.json
      $ref: './schemas/incident.schema.json#/$defs/Headline'
    ResearchState:
      type: string
      description: |
        queued 已入队；hypothesize / discriminate / conclude 阶段 B 的三步；completed 完成；
        stage_a_only 跳过阶段 B（熔断、预算、风暴、故障域）；failed 失败；superseded 被同一事件更新的触发取代
      enum: [queued, hypothesize, discriminate, conclude, completed, stage_a_only, failed, superseded]
    AskRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: 不可信文本；只回显与计长度，不生成新答案、不进提示词、不变成动作参数、不落审计
    AskAccepted:
      type: object
      additionalProperties: false
      required: [run_id, merged, limited]
      properties:
        run_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        merged: { type: boolean, description: 与同一 (incident_id, incident_version, reason) 的已有触发合并 }
        limited: { const: true }
    AskResponse:
      type: object
      additionalProperties: false
      required:
        [
          incident_id,
          incident_ref,
          incident_version,
          question,
          answered_at,
          stage_a,
          research,
          candidate_actions,
          limited,
        ]
      properties:
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_ref: { type: string, description: 用户传入的 ref 原样 }
        incident_version: { type: integer, minimum: 1 }
        question: { type: string, description: 原样回显，问题文本当不可信数据 }
        answered_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        stage_a:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [report_id, disposition, disposition_reason, cards, candidates, runbooks, rendered_at]
              properties:
                report_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
                disposition: { type: string }
                disposition_reason: { type: string }
                # 契约已有独立 schema 文件，按完整结构引用；不手写第二套形状
                cards: { type: array, items: { $ref: './schemas/evidence-result.schema.json' } }
                candidates:
                  type: array
                  items: { $ref: './schemas/incident.schema.json#/$defs/RootCandidate' }
                runbooks: { type: array, items: { type: string } }
                rendered_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        research:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [run_id, state, disposition, conclusion_level, root_component, summary, started_at, finished_at]
              properties:
                run_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
                state: { type: string, description: 含 queued 等未结束状态 }
                disposition: { type: [string, 'null'] }
                conclusion_level: { type: [string, 'null'] }
                root_component: { type: [string, 'null'] }
                summary: { type: [string, 'null'] }
                started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
                finished_at:
                  oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        candidate_actions:
          type: array
          description: 从已存在提议读到的候选动作；只返回 id 与描述，不创建提议、不执行
          items:
            type: object
            additionalProperties: false
            required: [action_id, title, reason]
            properties:
              action_id: { type: string }
              title: { type: string }
              reason: { type: string }
        limited: { const: true }
    ResearchRunSummary:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          incident_id,
          incident_version,
          reason,
          state,
          disposition,
          conclusion_level,
          root_component,
          summary,
          started_at,
          finished_at,
        ]
      properties:
        run_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_version: { type: integer, minimum: 1 }
        reason: { $ref: './schemas/events.schema.json#/$defs/ResearchReason' }
        state: { $ref: '#/components/schemas/ResearchState' }
        disposition:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        conclusion_level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ConclusionLevel' }]
        root_component:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        summary: { type: [string, 'null'] }
        started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        finished_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
    ResearchRun:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          incident_id,
          incident_version,
          reason,
          state,
          disposition,
          conclusion_level,
          root_component,
          summary,
          started_at,
          finished_at,
          stop_reason,
          steps,
          evidence,
          output,
          llm_calls,
          tool_calls,
          budget,
          error,
        ]
      properties:
        run_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_version: { type: integer, minimum: 1 }
        reason: { $ref: './schemas/events.schema.json#/$defs/ResearchReason' }
        state: { $ref: '#/components/schemas/ResearchState' }
        disposition:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        conclusion_level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ConclusionLevel' }]
        root_component:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        summary: { type: [string, 'null'] }
        started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        finished_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        stop_reason:
          type: [string, 'null']
          enum: [leader_supported, no_change, step_limit, deadline, budget, model_unavailable, null]
        steps:
          type: array
          description: 状态机每一步的起止时间，供运行明细的瀑布图使用
          items:
            type: object
            additionalProperties: false
            required: [state, started_at, finished_at]
            properties:
              state: { $ref: '#/components/schemas/ResearchState' }
              started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
              finished_at:
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        evidence:
          type: array
          description: 本次研判的全部证据卡结果（含区分性检查产生的卡）
          items: { $ref: './schemas/evidence-result.schema.json' }
        output:
          oneOf: [{ type: 'null' }, { $ref: './schemas/research-output.schema.json' }]
        llm_calls: { type: array, items: { $ref: '#/components/schemas/LlmCall' } }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/ToolCall' } }
        budget:
          type: object
          additionalProperties: false
          required: [estimated_input_tokens, input_tokens, output_tokens, cost, currency]
          properties:
            estimated_input_tokens: { type: integer, minimum: 0 }
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cost: { type: number, minimum: 0 }
            currency: { type: string }
        error:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [kind, message]
              properties:
                kind: { type: string }
                message: { type: string }
    LlmCall:
      type: object
      additionalProperties: false
      required:
        [seq, phase, route_id, model, prompt_hash, outcome, repair_step, usage, cost, duration_ms, redaction_hits, at]
      properties:
        seq: { type: integer, minimum: 1 }
        phase: { type: string, enum: [hypothesize, conclude, compress, still_consistent, repair] }
        route_id: { type: string }
        model: { type: string }
        prompt_hash: { $ref: './schemas/common.schema.json#/$defs/Sha256' }
        outcome: { type: string, enum: [succeeded, retried, switched, failed] }
        repair_step:
          type: [string, 'null']
          description: 修复阶梯中最终成功或失败的一级
          enum: [parse, jsonrepair, validate, field_salvage, reask, next_route, deterministic_only, null]
        usage: { $ref: './integrations/model/v1/dialect-profile.schema.json#/$defs/Usage' }
        cost: { type: number, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        redaction_hits: { type: integer, minimum: 0 }
        at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
    ToolCall:
      type: object
      additionalProperties: false
      required:
        [seq, tool, arguments, window, limit_applied, result_size, truncated, duration_ms, error, result_ref, at]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { $ref: './schemas/common.schema.json#/$defs/Timestamp', description: 开始时间 }
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
        window:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/TimeWindow' }]
        limit_applied: { type: [integer, 'null'] }
        result_size: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        duration_ms: { type: integer, minimum: 0 }
        error: { type: [string, 'null'] }
        result_ref:
          description: 工具结果判定成的卡
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/EvidenceRef' }]
    ApprovalEnvelope:
      $ref: './gateway/v1/approval-envelope.schema.json'
    IngestResult:
      type: object
      additionalProperties: false
      required: [accepted, dropped, degraded]
      properties:
        accepted: { type: integer, minimum: 0 }
        dropped:
          { type: integer, minimum: 0, description: 被丢弃的告警数（Watchdog、severity=none、SreNautix 自身告警等） }
        degraded: { type: boolean }
    ChatLink:
      type: object
      additionalProperties: false
      required: [channel, channel_user_id, method, linked_at]
      properties:
        channel: { $ref: './schemas/common.schema.json#/$defs/Channel' }
        channel_user_id: { type: string }
        method:
          { type: string, enum: [code, identity], description: code 为 /link 绑定码；identity 为同一身份源自动绑定 }
        linked_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
    Permission:
      type: string
      description: 角色绑定授予的权限名（DESIGN §13）；server 只接受这 17 个取值，其他值返回 400
      enum:
        [
          read,
          feedback,
          claim,
          propose,
          research.request,
          evidence.rerun,
          approve,
          reject,
          undo,
          audit.read,
          prompt.raw,
          users.read,
          settings.write,
          suppression.write,
          pause.write,
          eval.write,
          api_tokens.write,
        ]
    PermissionTarget:
      type: object
      additionalProperties: false
      required: [cluster, namespace, labels]
      properties:
        cluster: { type: string }
        namespace: { type: [string, 'null'] }
        labels: { $ref: './schemas/common.schema.json#/$defs/Labels' }
    EvalCandidate:
      type: object
      description: |
        评测候选（ADR 0175）：反馈、关闭的自愈 PR、以 not planned 关闭的事件 issue 与控制台"加入评测"生成，
        同一事件同一来源只有一个。管理员确认（选定类型、根因、处置）或放弃；确认的候选由命令行导出为标注
      additionalProperties: false
      required:
        [
          candidate_id,
          cluster_id,
          incident_id,
          incident_label,
          incident_version,
          research_run_id,
          source,
          source_ref,
          reason_code,
          reason,
          suggested_type,
          suite,
          state,
          label,
          decided_by,
          decided_at,
          drop_reason,
          created_at,
        ]
      properties:
        candidate_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        cluster_id: { type: string }
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_label: { type: string }
        incident_version: { type: integer, minimum: 1 }
        research_run_id: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Uuid' }] }
        source:
          type: string
          enum: [feedback, pr_closed, issue_not_planned, console]
          description: feedback 为带原因码的反馈；pr_closed 为关闭且没有合并的自愈 PR；issue_not_planned 为以 not planned 关闭的事件 issue；console 为控制台的"加入评测"
        source_ref:
          type: string
          description: 来源的引用：feedback 为 feedback_id，pr_closed 与 issue_not_planned 为 PR 或 issue 的链接，console 为研判的 run_id
        reason_code:
          oneOf: [{ type: 'null' }, { $ref: './schemas/feedback.schema.json#/$defs/ReasonCode' }]
        reason: { type: [string, 'null'], description: 反馈的原因或 PR 关闭之前的最后一条评论 }
        suggested_type:
          type: [string, 'null']
          enum: [incident, benign, abstain, null]
          description: 建议的标注类型；为 null 时留给人确认（修复方向错误、关闭的 PR 与 not planned 的 issue 既可能是良性告警，也可能是真实事件的错误处理）
        suite: { type: [string, 'null'], description: 控制台"加入评测"时填写的用例集 }
        state: { type: string, enum: [pending, confirmed, dropped] }
        label:
          description: 确认时选定的标准答案；没有确认时为 null
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/EvalCandidateConfirm' }]
        decided_by: { type: [string, 'null'] }
        decided_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        drop_reason: { type: [string, 'null'] }
        created_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
    EvalCandidateConfirm:
      type: object
      additionalProperties: false
      required: [type, roots, disposition, mechanism]
      properties:
        type: { type: string, enum: [incident, benign, abstain] }
        roots:
          type: array
          maxItems: 20
          description: 可接受的根因组件键；incident 必须至少一个，benign 与 abstain 为空
          items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
        disposition:
          description: 正确的处置判断；benign 为 ignore，abstain 为 null
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        mechanism: { type: [string, 'null'], maxLength: 600 }
    EvalCaseSummary:
      type: object
      additionalProperties: false
      required:
        [
          case_id,
          suite,
          type,
          incident_id,
          label,
          created_at,
          truth,
          pack_timing,
          excluded,
          snapshot_status,
          last_results,
        ]
      properties:
        case_id: { type: string }
        suite: { type: string }
        type: { type: string, enum: [incident, feedback, benign, abstain, scenario] }
        incident_id: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Uuid' }] }
        label: { type: string }
        created_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        truth:
          type: object
          additionalProperties: false
          required: [root_components, granularity, disposition]
          properties:
            root_components: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
            granularity: { type: [string, 'null'], enum: [pod, workload, component, node, null] }
            disposition: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }] }
        pack_timing: { type: string, enum: [pack_before_incident, pack_after_incident] }
        excluded:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, ref, reason]
            properties:
              kind:
                {
                  type: string,
                  enum: [incident_report, feedback, same_root_conclusion, pack_knowledge, retrieved_case],
                }
              ref: { type: string }
              reason: { type: string }
        snapshot_status: { type: string, enum: [queued, frozen] }
        last_results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [route_id, passes, runs, top1_hit]
            properties:
              route_id: { type: string }
              passes: { type: integer, minimum: 0 }
              runs: { type: integer, minimum: 0 }
              top1_hit: { type: [boolean, 'null'] }
    AgentHealth:
      type: object
      additionalProperties: false
      required: [since, consecutive_days_met, required_days, scorecard, runtime]
      properties:
        since: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        consecutive_days_met: { type: integer, minimum: 0 }
        required_days: { type: integer, minimum: 1 }
        scorecard:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric, value, threshold, comparator, met, numerator, denominator, diagnostic]
            properties:
              metric:
                type: string
                enum:
                  [
                    untested_competitor_ratio,
                    research_runs_p95,
                    feedback_per_week,
                    replay_top1,
                    benign_false_positive,
                    real_closed_loops,
                    out_of_catalog_writes,
                    portability_top1,
                    zero_tool_ratio,
                  ]
              value: { type: [number, 'null'] }
              threshold: { type: number }
              comparator: { type: string, enum: [lt, le, ge, eq] }
              met: { type: [boolean, 'null'] }
              numerator: { type: [number, 'null'] }
              denominator: { type: [number, 'null'] }
              diagnostic: { type: boolean, description: 只作为诊断指标公开，不计入达标 }
        runtime:
          type: object
          additionalProperties: false
          required: [zero_tool_ratio, untested_competitor_ratio, rerun_p95, budget_cutoff_ratio, fallback_ratio]
          properties:
            zero_tool_ratio: { type: [number, 'null'] }
            untested_competitor_ratio: { type: [number, 'null'] }
            rerun_p95: { type: [number, 'null'] }
            budget_cutoff_ratio: { type: [number, 'null'] }
            fallback_ratio: { type: [number, 'null'] }
    TopologyOverrideProposal:
      description: 拓扑覆盖规则的 gitops_pr 提议（PR 在提议批准后由 gateway 开出，地址见提议的执行与事件 issue）
      type: object
      additionalProperties: false
      required: [proposal_id, state, branch, base_sha, incident_id, approval_url, issue_url]
      properties:
        proposal_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        state: { $ref: './schemas/proposal.schema.json#/$defs/State' }
        branch: { type: string, pattern: '^srenautix/' }
        base_sha: { type: string, description: 补丁基于的 base 分支提交（gateway 的 base_head 预检核对它） }
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        approval_url: { type: string, description: 控制台的审批页 }
        issue_url:
          type: [string, 'null']
          description: 关联的事件 issue；没有开启事件 issue，或 issue 暂时没能开出时为 null
    TopologyCoverage:
      type: object
      additionalProperties: false
      required: [topology_version, components, unmapped_alerts, components_without_chains, suggestions]
      properties:
        topology_version: { type: integer, minimum: 0 }
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [component, type, discovered_by, chains, mapped_alerts]
            properties:
              component: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              type: { type: [string, 'null'] }
              discovered_by: { type: string, enum: [informer, ksm_history, pack, user, runtime] }
              chains: { type: array, items: { type: string } }
              mapped_alerts: { type: array, items: { type: string } }
        unmapped_alerts:
          type: array
          description: 14 天内出现过、没有映射到组件的告警名
          items:
            type: object
            additionalProperties: false
            required: [alertname, count_14d, suggested_role, confidence, suggested_component, expr]
            properties:
              alertname: { type: string }
              count_14d: { type: integer, minimum: 0 }
              suggested_role: { $ref: './schemas/common.schema.json#/$defs/AlertRole' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              suggested_component:
                { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }] }
              expr: { type: [string, 'null'] }
        components_without_chains: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        suggestions: { type: array, items: { type: string } }
    IntegrationInstance:
      type: object
      additionalProperties: false
      required:
        [
          instance_id,
          manifest,
          git_source,
          secret_refs,
          last_success_at,
          error_ratio_1h,
          used_by,
          capabilities,
          over_privileged,
        ]
      properties:
        instance_id: { type: string }
        manifest: { $ref: './schemas/integration-manifest.schema.json' }
        git_source:
          type: object
          additionalProperties: false
          required: [repo, path, sha]
          properties:
            repo: { type: string }
            path: { type: string }
            sha: { type: string }
        secret_refs: { type: array, items: { type: string }, description: 只有挂载文件的引用，永远不含密钥内容 }
        last_success_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        error_ratio_1h: { type: [number, 'null'] }
        used_by:
          type: object
          additionalProperties: false
          required: [chains, actions]
          properties:
            chains: { type: array, items: { type: string } }
            actions: { type: array, items: { type: string } }
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, maturity, verified, verified_at, error]
            properties:
              name: { type: string }
              maturity: { type: string, enum: [alpha, beta, stable] }
              verified: { type: boolean }
              verified_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
              error: { type: [string, 'null'] }
        over_privileged: { type: boolean, description: 凭证超出 requiredScopes，集成降级为 warn 或只提议 }
    PackStatus:
      type: object
      additionalProperties: false
      required:
        [
          name,
          version,
          source,
          ref,
          digest,
          maturity,
          layer,
          loaded,
          load_error,
          disabled_capabilities,
          ci,
          user_layer_lines,
        ]
      properties:
        name: { type: string }
        version: { type: string }
        source: { type: string, enum: [git, oci, builtin] }
        ref: { type: string }
        digest: { $ref: './schemas/common.schema.json#/$defs/Sha256' }
        maturity: { type: string, enum: [stable, beta, draft] }
        layer: { type: string, enum: [builtin, user] }
        loaded: { type: boolean }
        load_error: { type: [string, 'null'] }
        disabled_capabilities: { type: array, items: { type: string } }
        ci:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [passed, report_url]
              properties:
                passed: { type: boolean }
                report_url: { type: [string, 'null'] }
        user_layer_lines: { type: [integer, 'null'] }
    Drift:
      type: object
      additionalProperties: false
      required: [in_sync, live_sha, detail]
      properties:
        in_sync: { type: boolean }
        live_sha: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
    PauseState:
      type: object
      additionalProperties: false
      required: [paused, reason, by, since, expires_at, held_count]
      properties:
        paused: { type: boolean }
        reason: { type: [string, 'null'] }
        by: { type: [string, 'null'] }
        since: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        expires_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        held_count: { type: integer, minimum: 0 }
    ModelRouteStatus:
      type: object
      additionalProperties: false
      required:
        [
          route_id,
          model,
          dialect_profile,
          base_url_host,
          in_domain,
          failure_domain,
          breaker,
          breaker_reason,
          health,
          structured_failure_ratio,
          price,
          limits,
          egress_categories,
          provider_retention,
          provider_fingerprint,
        ]
      properties:
        route_id: { type: string }
        model: { type: string }
        dialect_profile: { type: string }
        base_url_host: { type: string }
        in_domain: { type: boolean }
        failure_domain: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        breaker: { type: string, enum: [closed, open, half_open] }
        breaker_reason: { type: [string, 'null'], enum: [failures, latency, failure_domain, null] }
        health:
          type: object
          additionalProperties: false
          required: [p50_ms, error_ratio_1h]
          properties:
            p50_ms: { type: [number, 'null'] }
            error_ratio_1h: { type: [number, 'null'] }
        structured_failure_ratio: { type: [number, 'null'] }
        price:
          type: object
          additionalProperties: false
          required: [input_per_mtok, output_per_mtok, currency]
          properties:
            input_per_mtok: { type: number, minimum: 0 }
            output_per_mtok: { type: number, minimum: 0 }
            currency: { type: string }
        limits:
          type: object
          additionalProperties: false
          required: [per_incident_cost, daily_cost]
          properties:
            per_incident_cost: { type: [number, 'null'] }
            daily_cost: { type: [number, 'null'] }
        egress_categories: { type: array, items: { type: string } }
        provider_retention: { type: [string, 'null'] }
        provider_fingerprint: { type: [string, 'null'] }
    Settings:
      type: object
      additionalProperties: false
      required: [channels, retention, locale, time_zone, subscriptions]
      properties:
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, target, enabled, rate_per_min]
            properties:
              id: { type: string }
              kind: { $ref: './schemas/common.schema.json#/$defs/Channel' }
              target: { type: string }
              enabled: { type: boolean }
              rate_per_min: { type: number, minimum: 0 }
        retention:
          type: object
          additionalProperties: false
          required: [incidents_days, research_days, raw_prompt_days]
          properties:
            incidents_days: { type: integer, minimum: 1 }
            research_days: { type: integer, minimum: 1 }
            raw_prompt_days: { type: integer, minimum: 0 }
        locale: { type: string, enum: [zh-CN, en] }
        time_zone: { type: string }
        subscriptions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, filter, channel_id]
            properties:
              id: { type: string }
              filter:
                type: object
                additionalProperties: false
                required: [cluster_id, severity, component]
                properties:
                  cluster_id: { type: [string, 'null'] }
                  severity: { type: [string, 'null'], enum: [critical, warning, info, null] }
                  component: { type: [string, 'null'] }
              channel_id: { type: string }
    ApiToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, created_by, created_at, last_used_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [propose] } }
        created_by: { type: string }
        created_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        last_used_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        expires_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
