  /v1/topology/overrides/pr:
    post:
      tags: [topology]
      operationId: createTopologyOverridePr
      description: |
        为未映射的告警计划拓扑覆盖规则的 PR，提交为 gitops_pr 提议（ADR 0025、0108）：server 只读地取 base 分支上的覆盖文件、
        生成补丁；PR 由 gateway 在提议批准后经 gitops_pr 开出（只推送到 srenautix/* 分支，从不合并）。
        提议绑定事件：给出 incident_id 时用它，否则取包含这条告警的最近一个事件，没有时 409（error no_incident）。
        发起人能审批时（控制台会话、L 档、不是合规配置下的自批）直接批准，否则留待审批。
        同一条规则重复发起时返回已有的提议（200）。开启了事件 issue 时 PR 描述写 `Refs #<issue>`，PR 开出后 issue 里回链
      x-srenautix-roles: [admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cluster_id, alertname, component, role]
              properties:
                cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
                alertname: { type: string }
                component: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
                role: { $ref: './schemas/common.schema.json#/$defs/AlertRole' }
                incident_id:
                  $ref: './schemas/common.schema.json#/$defs/Uuid'
                  description: 提议绑定的事件；省略时取包含这条告警的最近一个事件
      responses:
        '201':
          description: 已提交 gitops_pr 提议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyOverrideProposal' }
        '200':
          description: 同一条规则的提议已经存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyOverrideProposal' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/topology/neighborhood:
    get:
