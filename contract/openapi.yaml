        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-srenautix_session
    bearer:
      type: http
      scheme: bearer
      description: |
        两类 token：
        - API token（外部调用方）：只能调用 x-srenautix-external=true 的操作，写操作只有提议。
        - Grafana 插件 token：登记在 server 的调用方文件（callers.tokens_file，kind: grafana）中，不是控制台创建的 API token。
          插件后端代理只读接口与 createFeedback，必须带 X-SreNautix-On-Behalf-Of（Grafana 用户的邮箱）；server 按 OIDC ID Token
          的 email 声明（不区分大小写）把它映射到登录过控制台的用户，按该用户的角色绑定授权，但只放行 GET 与 createFeedback，
          反馈的 channel 记为 grafana。没有邮箱、映射不到或映射到多个用户时返回 403。
  parameters:
    OnBehalfOf:
      name: X-SreNautix-On-Behalf-Of
      in: header
      required: false
      description: 只用于 Grafana 插件 token：Grafana 用户的邮箱
      schema: { type: string, format: email }
    IncidentRef:
      name: incident_ref
      in: path
      required: true
      description: incident_id、稳定标签或别名；标签放进路径时按 RFC 3986 编码
      schema: { type: string, minLength: 1 }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    CsrfOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: 会话认证时必填；Bearer 认证时不需要
      schema: { type: string }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: './schemas/common.schema.json#/$defs/Error' }
  schemas:
    Profile:
      type: string
      description: 安装配置（DESIGN §1.3）
      enum: [observe, standard, compliance]
    Session:
      type: object
      additionalProperties: false
      required: [principal, roles, provider, profile, local_admin, auth_time, expires_at, csrf_token, break_glass]
      properties:
        principal: { $ref: './schemas/common.schema.json#/$defs/Principal' }
        roles:
          type: array
          description: 角色绑定与作用域
          items: { $ref: './integrations/identity/v1/identity.schema.json#/$defs/RoleBinding' }
        provider: { type: string }
        profile: { $ref: '#/components/schemas/Profile' }
        local_admin: { type: boolean }
        auth_time:
          description: 最近一次认证或重新认证的时间；H 档审批要求在 5 分钟内
          $ref: './schemas/common.schema.json#/$defs/Timestamp'
        expires_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        csrf_token: { type: string }
        break_glass:
          type: boolean
          description: 本地管理员作为紧急入口登录；页面显示横幅
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, kind, text, ref, untrusted]
      properties:
        at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        kind:
          type: string
          enum:
            [
              alert_firing,
              alert_resolved,
              change,
              card_abnormal,
              incident_merged,
              incident_split,
              stage_a,
              research_concluded,
              proposal,
              execution,
              feedback,
            ]
        text: { type: string }
        ref: { type: [string, 'null'], description: 关联对象的 id（alert_id、change_id、run_id、proposal_id 等） }
        untrusted: { type: boolean, description: text 含告警、日志或变更来源的原文，只作为文本显示 }
    Subgraph:
      type: object
      additionalProperties: false
      required: [topology_version, root, nodes, edges]
      properties:
        topology_version: { type: integer, minimum: 0 }
        root:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [component, kind, namespace, name, role, alerts, hops]
            properties:
              component: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              kind: { type: string }
              namespace: { type: [string, 'null'] }
              name: { type: string }
              role: { type: string, enum: [root, candidate, member, neighbor] }
              alerts: { type: array, items: { type: string }, description: 该组件上的成员告警 alert_id }
              hops: { type: integer, minimum: 0, maximum: 2 }
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from, to, relation, provenance, confidence, scope]
            properties:
              from: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              to: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              relation: { type: string }
              provenance: { $ref: './schemas/topology-event.schema.json#/$defs/Provenance' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              scope: { type: string, enum: [instance, service] }
    ProposalDetail:
      type: object
      additionalProperties: false
      required:
        [
          proposal,
          target_state,
          prechecks,
          prechecked_at,
          blast_radius,
          conflict_domain,
          queue_position,
          verify,
          undo,
          policy_rule,
          model_rationale,
        ]
      properties:
        proposal: { $ref: './schemas/proposal.schema.json' }
        target_state:
          type: object
          additionalProperties: false
          required: [exists, uid, resource_version, summary]
          properties:
            exists: { type: boolean }
            uid: { type: [string, 'null'] }
            resource_version: { type: [string, 'null'] }
            summary: { type: string, description: 例如副本数、就绪数、cordon 状态 }
        prechecks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, passed, detail]
            properties:
              name: { type: string }
              passed: { type: boolean }
              detail: { type: string }
        prechecked_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        blast_radius:
          type: object
          additionalProperties: false
          required: [summary, objects, within_limit]
          properties:
            summary: { type: string }
            objects: { type: array, items: { type: string } }
            within_limit: { type: boolean }
        conflict_domain: { type: string }
        queue_position: { type: [integer, 'null'], minimum: 1 }
        verify:
          type: object
          additionalProperties: false
          required: [condition, window]
          properties:
            condition: { type: string }
            window: { $ref: './schemas/common.schema.json#/$defs/Duration' }
        undo:
          type: object
          additionalProperties: false
          required: [kind, description]
          properties:
            kind: { type: string, enum: [auto_restore, controller_rebuild, compensation, none] }
            description: { type: string }
        policy_rule: { type: string, description: 决定审批档位的策略规则 }
        model_rationale:
          type: [string, 'null']
          description: 模型给出的理由，标注"模型生成，未经验证"；规则或人工提议时为 null
    Cluster:
      type: object
      additionalProperties: false
      required: [cluster_id, display_name, reader, gateway, freeze, informer_synced_at, proposal_only, conditions]
      properties:
        cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
        display_name: { type: string }
        reader: { $ref: '#/components/schemas/SpokeStatus' }
        gateway:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SpokeStatus' }]
        freeze:
          type: object
          additionalProperties: false
          required: [frozen, observed_at]
          properties:
            frozen: { type: boolean }
            observed_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        informer_synced_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        proposal_only:
          type: boolean
          description: 准入自检未通过、gateway 未部署或冻结时为 true；所有页面显示红色的"仅提议"
        conditions: { type: array, items: { $ref: './schemas/condition.schema.json' } }
    SpokeStatus:
      type: object
      additionalProperties: false
      required: [connected, version, last_seen_at, admission_selfcheck]
      properties:
        connected: { type: boolean }
        version: { type: [string, 'null'] }
        last_seen_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        admission_selfcheck:
          type: [string, 'null']
          description: 只对 gateway 有意义
          enum: [passed, failed, unknown, null]
    IncidentSummary:
      type: object
      additionalProperties: false
      required:
        - incident_id
        - cluster_id
        - label
        - incident_version
        - state
        - severity
        - root_component
        - ambiguous
        - first_firing_at
        - ended_at
        - disposition
        - conclusion_level
        - research_fresh_at
        - pending_approvals
        - feedback
        - merged_from_count
        - split_from
        - suppressed
        - observability_blind
        - updated_at
      properties:
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        cluster_id: { $ref: './schemas/common.schema.json#/$defs/ClusterId' }
        label: { $ref: './schemas/incident.schema.json#/$defs/IncidentLabel' }
        incident_version: { type: integer, minimum: 1 }
        state: { type: string, enum: [firing, resolved, merged] }
        severity: { $ref: './schemas/common.schema.json#/$defs/Severity' }
        root_component:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        ambiguous: { type: boolean }
        first_firing_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        ended_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        disposition:
          description: 最近一次研判的处置判断；只有阶段 A 时取阶段 A 的
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        conclusion_level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ConclusionLevel' }]
        research_fresh_at:
          description: 最近一次研判或阶段 A 报告的时间
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        pending_approvals: { type: integer, minimum: 0 }
        feedback:
          description: 最新一条反馈；没有时为 null
          oneOf: [{ type: 'null' }, { $ref: './schemas/feedback.schema.json' }]
        merged_from_count: { type: integer, minimum: 0 }
        split_from:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Uuid' }]
        suppressed: { type: boolean }
        observability_blind: { type: boolean }
        updated_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
    ResearchState:
      type: string
      description: |
        queued 已入队；hypothesize / discriminate / conclude 阶段 B 的三步；completed 完成；
        stage_a_only 跳过阶段 B（熔断、预算、风暴、故障域）；failed 失败；superseded 被同一事件更新的触发取代
      enum: [queued, hypothesize, discriminate, conclude, completed, stage_a_only, failed, superseded]
    ResearchRunSummary:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          incident_id,
          incident_version,
          reason,
          state,
          disposition,
          conclusion_level,
          root_component,
          summary,
          started_at,
          finished_at,
        ]
      properties:
        run_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_version: { type: integer, minimum: 1 }
        reason: { $ref: './schemas/events.schema.json#/$defs/ResearchReason' }
        state: { $ref: '#/components/schemas/ResearchState' }
        disposition:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        conclusion_level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ConclusionLevel' }]
        root_component:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        summary: { type: [string, 'null'] }
        started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        finished_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
    ResearchRun:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          incident_id,
          incident_version,
          reason,
          state,
          disposition,
          conclusion_level,
          root_component,
          summary,
          started_at,
          finished_at,
          stop_reason,
          steps,
          evidence,
          output,
          llm_calls,
          tool_calls,
          budget,
          error,
        ]
      properties:
        run_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_id: { $ref: './schemas/common.schema.json#/$defs/Uuid' }
        incident_version: { type: integer, minimum: 1 }
        reason: { $ref: './schemas/events.schema.json#/$defs/ResearchReason' }
        state: { $ref: '#/components/schemas/ResearchState' }
        disposition:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }]
        conclusion_level:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ConclusionLevel' }]
        root_component:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }]
        summary: { type: [string, 'null'] }
        started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        finished_at:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        stop_reason:
          type: [string, 'null']
          enum: [leader_supported, no_change, step_limit, deadline, budget, model_unavailable, null]
        steps:
          type: array
          description: 状态机每一步的起止时间，供运行明细的瀑布图使用
          items:
            type: object
            additionalProperties: false
            required: [state, started_at, finished_at]
            properties:
              state: { $ref: '#/components/schemas/ResearchState' }
              started_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
              finished_at:
                oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }]
        evidence:
          type: array
          description: 本次研判的全部证据卡结果（含区分性检查产生的卡）
          items: { $ref: './schemas/evidence-result.schema.json' }
        output:
          oneOf: [{ type: 'null' }, { $ref: './schemas/research-output.schema.json' }]
        llm_calls: { type: array, items: { $ref: '#/components/schemas/LlmCall' } }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/ToolCall' } }
        budget:
          type: object
          additionalProperties: false
          required: [estimated_input_tokens, input_tokens, output_tokens, cost, currency]
          properties:
            estimated_input_tokens: { type: integer, minimum: 0 }
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cost: { type: number, minimum: 0 }
            currency: { type: string }
        error:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [kind, message]
              properties:
                kind: { type: string }
                message: { type: string }
    LlmCall:
      type: object
      additionalProperties: false
      required:
        [seq, phase, route_id, model, prompt_hash, outcome, repair_step, usage, cost, duration_ms, redaction_hits, at]
      properties:
        seq: { type: integer, minimum: 1 }
        phase: { type: string, enum: [hypothesize, conclude, compress, still_consistent, repair] }
        route_id: { type: string }
        model: { type: string }
        prompt_hash: { $ref: './schemas/common.schema.json#/$defs/Sha256' }
        outcome: { type: string, enum: [succeeded, retried, switched, failed] }
        repair_step:
          type: [string, 'null']
          description: 修复阶梯中最终成功或失败的一级
          enum: [parse, jsonrepair, validate, field_salvage, reask, next_route, deterministic_only, null]
        usage: { $ref: './integrations/model/v1/dialect-profile.schema.json#/$defs/Usage' }
        cost: { type: number, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        redaction_hits: { type: integer, minimum: 0 }
        at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
    ToolCall:
      type: object
      additionalProperties: false
      required:
        [seq, tool, arguments, window, limit_applied, result_size, truncated, duration_ms, error, result_ref, at]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { $ref: './schemas/common.schema.json#/$defs/Timestamp', description: 开始时间 }
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
        window:
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/TimeWindow' }]
        limit_applied: { type: [integer, 'null'] }
        result_size: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        duration_ms: { type: integer, minimum: 0 }
        error: { type: [string, 'null'] }
        result_ref:
          description: 工具结果判定成的卡
          oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/EvidenceRef' }]
    ApprovalEnvelope:
      $ref: './gateway/v1/approval-envelope.schema.json'
    IngestResult:
      type: object
      additionalProperties: false
      required: [accepted, dropped, degraded]
      properties:
        accepted: { type: integer, minimum: 0 }
        dropped:
          { type: integer, minimum: 0, description: 被丢弃的告警数（Watchdog、severity=none、SreNautix 自身告警等） }
        degraded: { type: boolean }
    ChatLink:
      type: object
      additionalProperties: false
      required: [channel, channel_user_id, method, linked_at]
      properties:
        channel: { $ref: './schemas/common.schema.json#/$defs/Channel' }
        channel_user_id: { type: string }
        method:
          { type: string, enum: [code, identity], description: code 为 /link 绑定码；identity 为同一身份源自动绑定 }
        linked_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
    Permission:
      type: string
      description: 角色绑定授予的权限名（DESIGN §13）；server 只接受这 16 个取值，其他值返回 400
      enum:
        [
          read,
          feedback,
          propose,
          research.request,
          evidence.rerun,
          approve,
          reject,
          undo,
          audit.read,
          prompt.raw,
          users.read,
          settings.write,
          suppression.write,
          pause.write,
          eval.write,
          api_tokens.write,
        ]
    PermissionTarget:
      type: object
      additionalProperties: false
      required: [cluster, namespace, labels]
      properties:
        cluster: { type: string }
        namespace: { type: [string, 'null'] }
        labels: { $ref: './schemas/common.schema.json#/$defs/Labels' }
    EvalCase:
      type: object
      additionalProperties: false
      required:
        [
          case_id,
          suite,
          type,
          incident_id,
          label,
          created_at,
          truth,
          pack_timing,
          excluded,
          snapshot_status,
          last_results,
        ]
      properties:
        case_id: { type: string }
        suite: { type: string }
        type: { type: string, enum: [incident, feedback, benign, abstain, scenario] }
        incident_id: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Uuid' }] }
        label: { type: string }
        created_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        truth:
          type: object
          additionalProperties: false
          required: [root_components, granularity, disposition]
          properties:
            root_components: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
            granularity: { type: [string, 'null'], enum: [pod, workload, component, node, null] }
            disposition: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Disposition' }] }
        pack_timing: { type: string, enum: [pack_before_incident, pack_after_incident] }
        excluded:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, ref, reason]
            properties:
              kind:
                {
                  type: string,
                  enum: [incident_report, feedback, same_root_conclusion, pack_knowledge, retrieved_case],
                }
              ref: { type: string }
              reason: { type: string }
        snapshot_status: { type: string, enum: [queued, frozen] }
        last_results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [route_id, passes, runs, top1_hit]
            properties:
              route_id: { type: string }
              passes: { type: integer, minimum: 0 }
              runs: { type: integer, minimum: 0 }
              top1_hit: { type: [boolean, 'null'] }
    AgentHealth:
      type: object
      additionalProperties: false
      required: [since, consecutive_days_met, required_days, scorecard, runtime]
      properties:
        since: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        consecutive_days_met: { type: integer, minimum: 0 }
        required_days: { type: integer, minimum: 1 }
        scorecard:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric, value, threshold, comparator, met, numerator, denominator, diagnostic]
            properties:
              metric:
                type: string
                enum:
                  [
                    untested_competitor_ratio,
                    research_runs_p95,
                    feedback_per_week,
                    replay_top1,
                    benign_false_positive,
                    real_closed_loops,
                    out_of_catalog_writes,
                    portability_top1,
                    zero_tool_ratio,
                  ]
              value: { type: [number, 'null'] }
              threshold: { type: number }
              comparator: { type: string, enum: [lt, le, ge, eq] }
              met: { type: [boolean, 'null'] }
              numerator: { type: [number, 'null'] }
              denominator: { type: [number, 'null'] }
              diagnostic: { type: boolean, description: 只作为诊断指标公开，不计入达标 }
        runtime:
          type: object
          additionalProperties: false
          required: [zero_tool_ratio, untested_competitor_ratio, rerun_p95, budget_cutoff_ratio, fallback_ratio]
          properties:
            zero_tool_ratio: { type: [number, 'null'] }
            untested_competitor_ratio: { type: [number, 'null'] }
            rerun_p95: { type: [number, 'null'] }
            budget_cutoff_ratio: { type: [number, 'null'] }
            fallback_ratio: { type: [number, 'null'] }
    TopologyCoverage:
      type: object
      additionalProperties: false
      required: [topology_version, components, unmapped_alerts, components_without_chains, suggestions]
      properties:
        topology_version: { type: integer, minimum: 0 }
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [component, type, discovered_by, chains, mapped_alerts]
            properties:
              component: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }
              type: { type: [string, 'null'] }
              discovered_by: { type: string, enum: [informer, ksm_history, pack, user, runtime] }
              chains: { type: array, items: { type: string } }
              mapped_alerts: { type: array, items: { type: string } }
        unmapped_alerts:
          type: array
          description: 14 天内出现过、没有映射到组件的告警名
          items:
            type: object
            additionalProperties: false
            required: [alertname, count_14d, suggested_role, confidence, suggested_component, expr]
            properties:
              alertname: { type: string }
              count_14d: { type: integer, minimum: 0 }
              suggested_role: { $ref: './schemas/common.schema.json#/$defs/AlertRole' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              suggested_component:
                { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/ComponentKey' }] }
              expr: { type: [string, 'null'] }
        components_without_chains: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        suggestions: { type: array, items: { type: string } }
    IntegrationInstance:
      type: object
      additionalProperties: false
      required:
        [
          instance_id,
          manifest,
          git_source,
          secret_refs,
          last_success_at,
          error_ratio_1h,
          used_by,
          capabilities,
          over_privileged,
        ]
      properties:
        instance_id: { type: string }
        manifest: { $ref: './schemas/integration-manifest.schema.json' }
        git_source:
          type: object
          additionalProperties: false
          required: [repo, path, sha]
          properties:
            repo: { type: string }
            path: { type: string }
            sha: { type: string }
        secret_refs: { type: array, items: { type: string }, description: 只有挂载文件的引用，永远不含密钥内容 }
        last_success_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        error_ratio_1h: { type: [number, 'null'] }
        used_by:
          type: object
          additionalProperties: false
          required: [chains, actions]
          properties:
            chains: { type: array, items: { type: string } }
            actions: { type: array, items: { type: string } }
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, maturity, verified, verified_at, error]
            properties:
              name: { type: string }
              maturity: { type: string, enum: [alpha, beta, stable] }
              verified: { type: boolean }
              verified_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
              error: { type: [string, 'null'] }
        over_privileged: { type: boolean, description: 凭证超出 requiredScopes，集成降级为 warn 或只提议 }
    PackStatus:
      type: object
      additionalProperties: false
      required:
        [
          name,
          version,
          source,
          ref,
          digest,
          maturity,
          layer,
          loaded,
          load_error,
          disabled_capabilities,
          ci,
          user_layer_lines,
        ]
      properties:
        name: { type: string }
        version: { type: string }
        source: { type: string, enum: [git, oci, builtin] }
        ref: { type: string }
        digest: { $ref: './schemas/common.schema.json#/$defs/Sha256' }
        maturity: { type: string, enum: [stable, beta, draft] }
        layer: { type: string, enum: [builtin, user] }
        loaded: { type: boolean }
        load_error: { type: [string, 'null'] }
        disabled_capabilities: { type: array, items: { type: string } }
        ci:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [passed, report_url]
              properties:
                passed: { type: boolean }
                report_url: { type: [string, 'null'] }
        user_layer_lines: { type: [integer, 'null'] }
    Drift:
      type: object
      additionalProperties: false
      required: [in_sync, live_sha, detail]
      properties:
        in_sync: { type: boolean }
        live_sha: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
    PauseState:
      type: object
      additionalProperties: false
      required: [paused, reason, by, since, expires_at, held_count]
      properties:
        paused: { type: boolean }
        reason: { type: [string, 'null'] }
        by: { type: [string, 'null'] }
        since: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        expires_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        held_count: { type: integer, minimum: 0 }
    ModelRouteStatus:
      type: object
      additionalProperties: false
      required:
        [
          route_id,
          model,
          dialect_profile,
          base_url_host,
          in_domain,
          failure_domain,
          breaker,
          breaker_reason,
          health,
          structured_failure_ratio,
          price,
          limits,
          egress_categories,
          provider_retention,
          provider_fingerprint,
        ]
      properties:
        route_id: { type: string }
        model: { type: string }
        dialect_profile: { type: string }
        base_url_host: { type: string }
        in_domain: { type: boolean }
        failure_domain: { type: array, items: { $ref: './schemas/common.schema.json#/$defs/ComponentKey' } }
        breaker: { type: string, enum: [closed, open, half_open] }
        breaker_reason: { type: [string, 'null'], enum: [failures, latency, failure_domain, null] }
        health:
          type: object
          additionalProperties: false
          required: [p50_ms, error_ratio_1h]
          properties:
            p50_ms: { type: [number, 'null'] }
            error_ratio_1h: { type: [number, 'null'] }
        structured_failure_ratio: { type: [number, 'null'] }
        price:
          type: object
          additionalProperties: false
          required: [input_per_mtok, output_per_mtok, currency]
          properties:
            input_per_mtok: { type: number, minimum: 0 }
            output_per_mtok: { type: number, minimum: 0 }
            currency: { type: string }
        limits:
          type: object
          additionalProperties: false
          required: [per_incident_cost, daily_cost]
          properties:
            per_incident_cost: { type: [number, 'null'] }
            daily_cost: { type: [number, 'null'] }
        egress_categories: { type: array, items: { type: string } }
        provider_retention: { type: [string, 'null'] }
        provider_fingerprint: { type: [string, 'null'] }
    Settings:
      type: object
      additionalProperties: false
      required: [channels, retention, locale, time_zone, subscriptions]
      properties:
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, target, enabled, rate_per_min]
            properties:
              id: { type: string }
              kind: { $ref: './schemas/common.schema.json#/$defs/Channel' }
              target: { type: string }
              enabled: { type: boolean }
              rate_per_min: { type: number, minimum: 0 }
        retention:
          type: object
          additionalProperties: false
          required: [incidents_days, research_days, raw_prompt_days]
          properties:
            incidents_days: { type: integer, minimum: 1 }
            research_days: { type: integer, minimum: 1 }
            raw_prompt_days: { type: integer, minimum: 0 }
        locale: { type: string, enum: [zh-CN, en] }
        time_zone: { type: string }
        subscriptions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, filter, channel_id]
            properties:
              id: { type: string }
              filter:
                type: object
                additionalProperties: false
                required: [cluster_id, severity, component]
                properties:
                  cluster_id: { type: [string, 'null'] }
                  severity: { type: [string, 'null'], enum: [critical, warning, info, null] }
                  component: { type: [string, 'null'] }
              channel_id: { type: string }
    ApiToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, created_by, created_at, last_used_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [propose] } }
        created_by: { type: string }
        created_at: { $ref: './schemas/common.schema.json#/$defs/Timestamp' }
        last_used_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
        expires_at: { oneOf: [{ type: 'null' }, { $ref: './schemas/common.schema.json#/$defs/Timestamp' }] }
