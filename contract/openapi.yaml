    get:
      tags: [topology]
      operationId: getClusterMapTimeline
      description: |
        地图回放的时间轴（契约 2.66.0，ADR 0205）：[from, to) 之间触发过的事件与它们的触发区间，作用域与过滤和 getClusterMap 相同
        （没有合并、没有被抑制、调用方读取作用域内）。某一刻的地图用 getClusterMap 的 at 取；区间不超过 7 天，最多 2000 个事件，按首次触发排序
      x-srenautix-roles: [viewer, responder, approver, auditor, admin]
      x-srenautix-external: false
      parameters:
        - {
            name: cluster_id,
            in: query,
