                          top1: { $ref: './schemas/eval-report.schema.json#/$defs/Ratio' }
                    gate_passed: { type: [boolean, 'null'] }
  /v1/eval/candidates:
    get:
      tags: [eval]
      operationId: listEvalCandidates
      description: 评测候选（ADR 0175），新的在前。state 为 all 时列出全部状态
      x-srenautix-roles: [admin]
      x-srenautix-external: false
      parameters:
        - {
            name: state,
            in: query,
            schema: { type: string, enum: [pending, confirmed, dropped, all], default: pending },
          }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: 候选
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EvalCandidate' } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/eval/candidates/{candidate_id}/confirm:
    parameters:
      - { name: candidate_id, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' } }
    post:
      tags: [eval]
      operationId: confirmEvalCandidate
      description: |
        确认一个待定的候选：选定标注类型、根因与处置。incident 必须给出根因；benign 的根因为空、处置为 ignore；
        abstain 的根因为空、处置为 null。确认后的候选由 `srenautix eval candidates export` 导出为标注
      x-srenautix-roles: [admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalCandidateConfirm' }
      responses:
        '200':
          description: 已确认
          content: { application/json: { schema: { $ref: '#/components/schemas/EvalCandidate' } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/eval/candidates/{candidate_id}/drop:
    parameters:
      - { name: candidate_id, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Uuid' } }
    post:
      tags: [eval]
      operationId: dropEvalCandidate
      description: 放弃一个待定的候选，不进入标注
      x-srenautix-roles: [admin]
      x-srenautix-external: false
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: 已放弃
          content: { application/json: { schema: { $ref: '#/components/schemas/EvalCandidate' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/eval/estimate:
    post:
      tags: [eval]
      operationId: estimateEval
