# 四类上游错误（ADR 0177），各占一段时间，卡片窗口互不重叠：
# 1. 外部上游的配额耗尽：持续返回 429，另有两行无关的 500；
# 2. 能力不匹配：上游对模型不支持的能力返回 400，同时伴随 524；
# 3. 单一端点返回 503；
# 4. 单一供给的模型在首内容超时后由网关返回 503，没有可以转移的候选（上游没有返回错误）。
api_version: srenautix.io/pack-test/v1
interval: 1m
input_logs:
  - labels: { namespace: llm, pod: api-gateway-5d8f7c9b4-x2k9p, container: gateway }
    lines:
