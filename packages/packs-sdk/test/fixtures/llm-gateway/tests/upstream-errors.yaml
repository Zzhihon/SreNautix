tests:
  - name: 配额耗尽持续返回 429
    eval_time: 15m
    card: gateway-errors/samples
    entity: { kind: Deployment, namespace: llm, name: api-gateway }
    expect: { verdict: abnormal, reason_kind: rule, samples: { classes: { quota_exhausted: 12, other: 2, upstream_unavailable: 0 } } }
  - name: 能力不匹配返回 400 并伴随 524
    eval_time: 112m
    card: gateway-errors/samples
    entity: { kind: Deployment, namespace: llm, name: api-gateway }
    expect: { verdict: abnormal, samples: { classes: { capability_mismatch: 6, origin_timeout: 4, other: 0 } } }
  - name: 单一端点返回 503
    eval_time: 210m
    card: gateway-errors/samples
    entity: { kind: Deployment, namespace: llm, name: api-gateway }
    expect: { verdict: abnormal, samples: { classes: { upstream_unavailable: 8, first_content_timeout: 0 } } }
  - name: 单一供给的首内容超时由网关返回 503
    eval_time: 308m
    card: gateway-errors/samples
    entity: { kind: Deployment, namespace: llm, name: api-gateway }
    expect: { verdict: abnormal, samples: { classes: { first_content_timeout: 6, upstream_unavailable: 0 } } }
  - name: 只有成功的请求时正常
    eval_time: 400m
    card: gateway-errors/samples
    entity: { kind: Deployment, namespace: llm, name: api-gateway }
    expect: { verdict: normal, samples: { classes: { other: 0 } } }
